change_description:
  what: |
    Normalize TradeSpine artifacts to the current aidoc-flow templates and amend
    CHG-22 so IPLAN-04/05 may close on verified module scope without claiming
    production readiness. Correct SPEC-08 root structure, declare code-only IPLAN
    subtypes, map IPLAN-04 deployment material to canonical sections, record
    downstream release obligations, reconcile the accepted aggregate
    compilation/runtime evidence, and regenerate affected readable/registry views.
  why: |
    Missing subtype metadata made code-only plans inherit combined deployment
    requirements; SPEC-08 nested `tdd_contracts` under implementation notes; and
    CHG-22 mixed module verification with consumers that do not yet exist. The
    drift prevented truthful closure while encouraging false production claims.
  trigger: |
    A current-template conformance review of IPLAN-05 and the CHG-22 cascade found
    structural drift after the aidoc-flow template evolved. The user authorized a
    one-run documentation-only remediation with no MQL5 changes or automated MT5 use.

impact_assessment:
  affected_layers:
    - layer: SPEC
      artifacts: ["SPEC-01", "SPEC-03", "SPEC-04", "SPEC-05", "SPEC-08"]
      impact: "Normalize current metadata; make the existing event, Position, Persistence, and evidence contracts explicit; correct the future IPLAN-03 single-inheritance topology; and preserve the explicit absence of TDD-08/IPLAN-08."
    - layer: TDD
      artifacts: ["TDD-01", "TDD-03", "TDD-04", "TDD-05"]
      impact: "Pin the one-parent ITradePort/ITradeExecutor topology, make planned versus executable coverage truthful, assign deferred cross-module BDD owners, and reconcile accepted IPLAN-05 aggregate runtime status."
    - layer: IPLAN
      artifacts: ["IPLAN-00", "IPLAN-01", "IPLAN-02", "IPLAN-03", "IPLAN-04", "IPLAN-05", "IPLAN-06", "IPLAN-07", "IPLAN-09", "IPLAN-10", "IPLAN-11", "IPLAN-12", "IPLAN-13"]
      impact: "Declare subtypes, normalize IPLAN-04 deploy sections, assign CHG-22 downstream release obligations, and reconcile evidence-backed verification/inventory fields without changing plan status."
    - layer: CHG
      artifacts: ["CHG-00", "CHG-22", "CHG-23"]
      impact: "Amend the CHG-22 acceptance boundary, register this change, and prepare unsigned gate evidence."
    - layer: Documentation
      artifacts: ["SPEC-01/03/04/05/08 readable", "TDD-03 readable", "IPLAN-04 readable", "IPLAN-05 readable", "IPLAN-00 readable", "Position module", "Persistence module", "Operations", "CLAUDE.md"]
      impact: "Regenerate affected views and remove stale standalone-evidence and completion wording."
  cascade_direction: downstream
  risk_level: High
  risk_justification: |
    The change alters completion semantics across SPEC, IPLAN, and CHG governance.
    A faulty amendment could falsely close safety-critical work or hide mandatory
    release checks. Plan/CHG statuses and approval fields therefore remain
    unchanged until structural validation, team audit, and human approval;
    verification and inventory fields change only where accepted evidence exists.
  architecture_delta:
    component_boundaries: "None; no runtime component, dependency, topology, or trust boundary changes. ADR-02/04/06/07/08/10 remain unchanged."
    new_components: "None."
    interface_compatibility: "No delivered MQL5 signature or CHG-22-R1 module interface is changed. The still-Draft IPLAN-03 contract is corrected so future ITradePort derives from the delivered ITradeExecutor seam and CGuardedTrade uses one MQL5 parent."
    spec_behavior_change: "SPEC-08 is made unambiguously declarative and separates module closure from production release. Existing SPEC-01/04/05 delivered behavior is unchanged; their public surfaces and concurrency boundaries are documented exactly."
  recovery_delta:
    new_failure_modes: "No runtime failure modes; the only introduced risk is an incomplete or inconsistent documentation bundle, reversed atomically by the rollback_plan."
    state_impact: "No durable runtime state is touched; RTO/RPO are not applicable to CHG-23."
  operational_delta:
    runbook_impact: "No on-call runbook change; existing module and release runbooks retain their owners."
    observability_impact: "No runtime telemetry is added, removed, renamed, or degraded."
    deployment_impact: "No deployment, canary, smoke execution, chart attachment, MetaEditor, or MT5 action is part of CHG-23."
    runtime_cost: "No CPU, memory, IO, storage, network, or external-service cost impact."
  security_delta:
    threat_model: "No authn/authz, external surface, trust-boundary, sensitive-data, or retention change."
    supply_chain: "No third-party dependency or toolchain version is added."
    security_adrs: "Existing security and safety commitments are preserved; no ADR amendment is required."

