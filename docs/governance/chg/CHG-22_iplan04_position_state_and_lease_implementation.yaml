recovery_governance:
  adr_impact:
    - "ADR-02 preserved: terminal GV persistence remains the durable scalar boundary."
    - "ADR-06 preserved: all production providers compose quoted, vendored StdLib includes."
    - "ADR-07 preserved: hedging-first ownership and deferred netting remain unchanged."
    - "ADR-08 preserved: broker/history evidence is canonical; transactions are hints only."
    - "ADR-10 preserved: Position and Persistence module boundaries remain distinct."
  failure_modes:
    - "Unavailable or contradictory lifecycle evidence enters absorbing HALT without deleting recovery data."
    - "Lost lease makes the context non-ready and blocks subsequent state-changing operations."
    - "Partial snapshot publication leaves the previous committed generation readable."
    - "Unselected, replayed, out-of-order, or uncorrelated transactions cannot mutate lifecycle state."
  threat_model_delta:
    - "Competing charts attempting first-use ownership are serialized by an exclusive bootstrap mutex and post-publication owner recheck."
    - "Transaction identifiers are untrusted until selected history proves symbol, magic, order, position, entry, and residual volume."
    - "HALT and cancellation evidence is append-preserved for operator recovery."
  recovery_objectives:
    rpo: "Zero acknowledged lifecycle transitions without a complete committed snapshot; uncertainty fails closed to HALT."
    rto: "At most one 60-second lease expiry plus one 30-second maintenance interval when broker evidence is available."
  telemetry_events:
    - TS_DEPLOY_PHASE
    - TS_REC_DECISION
    - TS_HINT_DEFERRED
    - TS_HALT_ENTER
    - TS_HALT_PERSIST_FAIL
    - TS_HALT_UNFENCED
    - TS_HALT_CLEAR
    - TS_REC_RECOVERED
    - TS_LEASE_CLAIM
    - TS_LEASE_CONFLICT
    - TS_LEASE_LOST
    - TS_STORE_SNAPSHOT_REJECTED
    - TS_STORE_SNAPSHOT_CORRUPT
    - TS_PROVIDER_HISTORY_FAIL
    - TS_PROVIDER_POSITION_HISTORY_FAIL
    - TS_TIMER_LATE
  canary: "Demo rollback rehearsal, then one full terminal-reported demo session, one restricted live identity, a partial identity cohort when topology permits, and full rollout. Each stage requires zero duplicate owners, lease loss, contradictory snapshots, provider/history failure, uncorrelated transitions, or maintenance gaps >=60 seconds."

contract_cutover:
  revision: "CHG-22-R1"
  policy: "One atomic source/interface/test bundle; zero-width old/new interface coexistence window. The first committed CHG-22-R1 LifecycleSnapshot retires the old binary and activates the SPEC-05 SPEC.05.06.7c3a decision."
  required_consumers:
    persistence: ["CStateStore", "CAlertSink", "CPositionStateMachine", "FakeStateStore", "FakeAlertSink", "Test_StateStore", "Test_AlertSink", "RunAllTests"]
    position: ["CPositionStateMachine", "CPositionContext", "CTradeTxRouter", "three live providers", "IPLAN-02 CTradeCoordinator", "IPLAN-03 CGuardedTrade", "IPLAN-01 CStrategyBase"]
  gates:
    - "IPLAN-05 producers and IPLAN-04 consumers pass first against CHG-22-R1."
    - "IPLAN-02 coordination then consumes the pinned readiness/lifecycle contract."
    - "IPLAN-01 provider assembly and IPLAN-03 final broker-mutation fences pass a joint integration suite before two-chart, rollback rehearsal, or canary."
    - "TS_DEPLOY_PHASE records source commit, contract revision, fresh EX5 checksums, identity, rollout phase, and timestamp at demo, restricted-live, cohort, and full boundaries."

rollback_plan:
  strategy: "state-aware disable-and-restore"
  source_commit: "ac7fe244dec1aa2d5897da406bf6c817804c607d"
  restore_sla: "Disable within 60 seconds; restore plus static/manual verification within 15 minutes or remain disabled and escalate."
  steps:
    - "Disable strategy entry and preserve/export lifecycle GVs, HALT evidence, logs, and broker history before changing binaries."
    - "Verify no active owner, pending order, or owned exposure; otherwise keep HALT and reconcile manually."
    - "Restore the complete pinned source/interface/document/test bundle; use only a fresh manual-F7 EX5 checksum captured before rehearsal."
    - "Never attach a prior binary to migrated snapshots. Under disabled/HALT operation and exclusive ownership, export snapshot and legacy keys, prove flat/no-order broker state, publish the rehearsed rollback-compatible legacy IDLE state, and clear the legacy HALT flag last."
    - "Re-enable only after the restored build has 0 errors/0 warnings, exact passing test counts, exactly one owner, and safe broker reconciliation."
  estimated_effort: "Medium"
