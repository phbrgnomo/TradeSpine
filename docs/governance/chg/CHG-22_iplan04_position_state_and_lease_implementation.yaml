recovery_governance:
  architecture_and_compatibility:
    component_boundaries: "ADR-02/06/07/08/10 boundaries are preserved; Position and Persistence remain distinct modules and no new infrastructure is introduced."
    contract_version: "CHG-22-R1 is a pinned, atomic source/interface/test revision with zero-width mixed-generation coexistence at the module boundary."
    backward_compatibility: "Breaking at the internal module interface and therefore upgraded atomically; downstream IPLAN-01/02/03 consumers must pin CHG-22-R1 before release."
  adr_impact:
    - "ADR-02 preserved: terminal GV persistence remains the durable scalar boundary."
    - "ADR-06 preserved: all production providers compose quoted, vendored StdLib includes."
    - "ADR-07 preserved: hedging-first ownership and deferred netting remain unchanged."
    - "ADR-08 preserved: broker/history evidence is canonical; transactions are hints only."
    - "ADR-10 preserved: Position and Persistence module boundaries remain distinct."
  failure_modes:
    - "Unavailable or contradictory lifecycle evidence enters absorbing HALT without deleting recovery data."
    - "Lost lease makes the context non-ready and blocks subsequent state-changing operations."
    - "Partial snapshot publication leaves the previous committed generation readable."
    - "Unselected, replayed, out-of-order, or uncorrelated transactions cannot mutate lifecycle state."
  threat_model_delta:
    - "Competing charts attempting first-use ownership are serialized by an exclusive bootstrap mutex and post-publication owner recheck."
    - "Transaction identifiers are untrusted until selected history proves symbol, magic, order, position, entry, and residual volume."
    - "HALT and cancellation evidence is append-preserved for operator recovery."
  recovery_objectives:
    rpo: "Zero acknowledged lifecycle transitions without a complete committed snapshot; uncertainty fails closed to HALT."
    rto: "At most one 60-second lease expiry plus one 30-second maintenance interval when broker evidence is available."
  telemetry_events:
    - TS_DEPLOY_PHASE
    - TS_REC_DECISION
    - TS_HINT_DEFERRED
    - TS_HALT_ENTER
    - TS_HALT_PERSIST_FAIL
    - TS_HALT_UNFENCED
    - TS_HALT_CLEAR
    - TS_REC_RECOVERED
    - TS_LEASE_CLAIM
    - TS_LEASE_CONFLICT
    - TS_LEASE_LOST
    - TS_STORE_SNAPSHOT_REJECTED
    - TS_STORE_SNAPSHOT_CORRUPT
    - TS_PROVIDER_HISTORY_FAIL
    - TS_PROVIDER_POSITION_HISTORY_FAIL
    - TS_TIMER_LATE
  operational_impact:
