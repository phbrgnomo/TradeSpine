change_description:
  what: |
    Recover the IPLAN-04 position/account-mode/state layer after correctness,
    safety, persistence, integration, and traceability review findings.

    The change adds the Position module under `Include/Position/`: shared
    position types, public interfaces, `CPositionStateMachine`, hedging and
    deferred netting account-mode adapters, `CPositionContext` with external
    SL/TP drift repair through the guarded write seam, and `CTradeTxRouter`.
    It also adds IPLAN-04-owned test fixtures and tests:
    `FakePositionView`, `FakeStateStore`, `FakeAlertSink`,
    `Test_PositionStateMachine.mq5`, `Test_AccountModeAdapters.mq5`, and
    `Test_AccountModeDeferred.mq5`.

    The recovery revision makes the public persistence contract source-breaking:
    lifecycle state is committed as a checked double-buffered snapshot, pending
    cancellation evidence is retained through ambiguous outcomes, marker claims
    are bootstrap-fenced and revalidated, and `IAlertSink::Halt` reports durable
    evidence success. Trade transactions become hints that can only request the
    canonical broker-evidence reconciler. Three read-only terminal providers are
    added, while production lifetime/assembly remains owned by IPLAN-01.
  why: |
    IPLAN-04 blocks IPLAN-01, IPLAN-02, and IPLAN-03. The reviewed external
    plan identified missing state-machine, account-mode, and persistence
    contracts that must be stable before downstream strategy/coordinator/
    guarded-execution work can safely consume the Position layer.

    The Option B lease design is required because MQL5 `GlobalVariableTime()`
    records last access time; reads/checks can refresh it, so it cannot be used
    as authoritative liveness. A separate heartbeat timestamp GV keeps liveness
    explicit while `marker_owner` remains the only ownership fence.
  trigger: |
    User requested implementation of the IPLAN-04 Correctness, Safety, and
    Governance Recovery Plan while keeping CHG-22 open until all manual and
    runtime acceptance evidence is available.

impact_assessment:
  affected_layers:
    - layer: SPEC
      artifacts: ["SPEC-04"]
      impact: |
        Canonical reconciliation, correlated untrusted hints, absorbing HALT,
        classified cancellation evidence, live read-only providers, immediate
        lease fences, fixed maintenance cadence, and isolated runtimes.
      cascade_direction: downstream
    - layer: SPEC
      artifacts: ["SPEC-05"]
      impact: |
        Commit-last lifecycle snapshots, detailed read results, retained HALT
        evidence, checked alert persistence, runtime namespaces, bootstrap
        mutex/CAS/reread lease fencing, and deterministic interleaving seams.
      cascade_direction: downstream
    - layer: SPEC
      artifacts: ["SPEC-03"]
      impact: |
        SPEC-03 needs a generated/canonical cascade to declare ITradeExecutor
        CloseTicket/ModifyTicket/CancelOrder as the guarded write seam that
        CGuardedTrade will implement in IPLAN-03.
      cascade_direction: downstream
    - layer: SPEC
      artifacts: ["SPEC-01"]
      impact: |
        SPEC-01 needs a generated/canonical cascade for the CStrategyBase
        OnTimer lifecycle that will drive CPositionContext.OnMaintenance rather
        than OnTick.
      cascade_direction: downstream
    - layer: TDD
      artifacts: ["TDD-04", "TDD-05", "TDD-03", "TDD-01"]
      impact: |
        TDDs need generated/canonical updates for the new Position tests,
        persistence regression tests, guarded executor seam tests, and timer
        lifecycle tests.
      cascade_direction: downstream
    - layer: IPLAN
      artifacts: ["IPLAN-04", "IPLAN-05", "IPLAN-03", "IPLAN-01", "IPLAN-00"]
      impact: |
        IPLAN-04 expands beyond the original 14-file manifest to include live
        evidence providers and recovery tests. IPLAN-05 owns snapshot and lease
        integrity, IPLAN-03 owns pre-write HALT/lease enforcement, and IPLAN-01
        owns timer/provider lifetime and production assembly. IPLAN-00 must keep
        IPLAN-04 in progress until manual compilation and runtime evidence exist.
      cascade_direction: downstream
    - layer: Code
      artifacts:
        - "Include/Position/*"
        - "Scripts/Tests/Support/FakePositionView.mqh"
        - "Scripts/Tests/Support/FakeStateStore.mqh"
        - "Scripts/Tests/Support/FakeAlertSink.mqh"
        - "Scripts/Tests/Test_PositionStateMachine.mq5"
        - "Scripts/Tests/Test_AccountModeAdapters.mq5"
        - "Scripts/Tests/Test_AccountModeDeferred.mq5"
        - "Scripts/Tests/Test_PositionLiveProviders.mq5"
        - "Include/Position/LiveAccountModeProvider.mqh"
        - "Include/Position/LiveBrokerPositionView.mqh"
        - "Include/Position/LiveTradeTransactionEvidence.mqh"
        - "Include/Persistence/StateStore.mqh"
        - "Include/Persistence/MarkerLease.mqh"
        - "Include/Persistence/PersistenceTypes.mqh"
        - "Include/Persistence/AlertSink.mqh"
        - "Include/Core/Interfaces.mqh"
        - "Scripts/Tests/Test_StateStore.mq5"
        - "Scripts/Tests/Test_AlertSink.mq5"
        - "Scripts/Tests/RunAllTests.mq5"
        - "Docs/OPERATIONS.md"
      impact: |
        Adds the Position module, shared IPLAN-04 fakes, focused tests, and
        aggregate registration. Existing IPLAN-05 tests are updated for the
        additive `IStateStore` contract and AlertSink optimization persistence.
      cascade_direction: downstream
  cascade_direction: bubble-down
  risk_level: High
  risk_justification: |
    This is a source-breaking cross-layer change at the persistence, lifecycle,
    and guarded-execution boundaries. Earlier file-presence and aliased-test
    evidence overstated completion. No compile/runtime result is inherited by
    this recovery revision. The change remains blocked until canonical artifacts,
    focused tests, manual MetaEditor compilation, MT5 runtime counts, canary
    evidence, and the post-remediation review all pass.

