id: CHG-21
title: "Canonical TradeIntent type extraction and regular-session-end close reference"

metadata:
  document_type: "chg-document"
  purpose: governance
  last_updated: "2026-08-29"
  change_level:
    value: C3
  change_source:
    value: design

