  change_source: design
  entry_gate: GATE-06
  semver_impact: null
  author: "phbr"
  date_proposed: "2026-06-21T00:00:00-03:00"
  date_approved: "2026-06-21T00:00:00-03:00"
  date_implemented: "2026-06-21T00:00:00-03:00"
