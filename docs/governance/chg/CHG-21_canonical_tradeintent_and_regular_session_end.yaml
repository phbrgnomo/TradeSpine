change_description:
  what: |
    Two design refinements raised by the IPLAN-06 codebase review, implemented
    doc-first (SPEC/TDD/IPLAN amended ahead of code).

    (1) CANONICAL TradeIntent (M1). The `struct TradeIntent` currently defined
    locally in `Include/Market/MarketContext.mqh` is hoisted into a new shared,
    include-guarded Core header `Include/Core/TradeTypes.mqh`. The Market layer
    and the future Coordination (SPEC-02) and Execution (SPEC-03) layers then
    share one definition. This removes the latent redefinition compile collision
    that would occur once IPLAN-02/03 land their own `TradeIntent`. The v1 field
    set is unchanged (`price`, `sl`, `tp`, `lots`, `order_type`). The constructor
    zeroes numeric fields and, as clarified by the 2026-08-29 CHG-26 review
    amendment, initializes `order_type` to invalid sentinel -1 so callers must
    assign BUY or SELL explicitly before validation or submission. SPEC-02's
    composite `TradeIntent` data model is reconciled to
    EXTEND this canonical struct (adding `signal`, `stops`, `symbol`, `ts`,
    `risk_percent`, …) rather than redefine it; SPEC-03 is annotated that
    `ITradePort`/`CGuardedTrade` consume the Core `TradeIntent`.

    (2) REGULAR-SESSION-END close reference (L2). `CLiveMarketSessionProvider::
    MarketSessionEndTod` currently returns the maximum `to` across all weekday
    trade sessions, which on B3 picks up the after-hours session end. It is
    changed to return the regular (first / index-0) trade-session end so the
    day-trade close trigger references normal trading hours, not after-hours.
    The `ENUM_SESSION_CLOSE_REF` enum and the `CommonInputs.close_reference`
    field are UNCHANGED; SPEC-09 receives only a doc clarification. SPEC-06's
    market-session model is amended to define `MarketSessionEndTod` as the
    regular/first session end and to record the after-hours exclusion as a
    documented v1 simplification (alongside the existing midnight-crossing
    out-of-scope note).

    The manual B3 verification (WINQ26, 2026-06-21) surfaced a related broker
    limitation folded into this change: some B3 brokers do not configure real
    session hours and report a full-day window (00:00-24:00) for index 0.
    `MarketSessionEndTod` therefore treats `to >= 86400` as a sentinel and
    returns -1 (close trigger falls back to `entry_window_end`), rather than
    referencing midnight. Recorded as a v1 limitation in SPEC-06; for B3,
    `CLOSE_REF_USER_WINDOW_END` is the recommended close reference.
  why: |
    The IPLAN-06 codebase review flagged (M1) that the locally-defined
    `TradeIntent` will collide with the canonical SPEC-02 `TradeIntent` once
    IPLAN-02/03 are implemented, because both headers can be pulled into the same
    translation unit and the two definitions differ. Establishing a single
    include-guarded Core definition now, with SPEC-02/03 consuming/extending it,
    removes that downstream-integration hazard at its root. The review also
    flagged (L2) that referencing the broker market-session end for the day-trade
    close can select the after-hours session on B3, contradicting the intended
    "close relative to normal trading hours" behavior; returning the regular
    (first) session end aligns the close trigger with operator expectations.
  trigger: |
    IPLAN-06 codebase review (2026-06-21) findings M1 (TradeIntent collision)
    and L2 (after-hours session end in the day-trade close reference), with the
    user directing the full CHG path: amend SPEC/TDD/IPLAN, then implement code.
    The 2026-08-29 CHG-26 code review identified that the original CHG-21 wording
    still implied a valid default side and required contract alignment plus a
    separately pending GATE-CODE review for the behavior change.

impact_assessment:
  affected_layers:
    - layer: SPEC
      artifacts: ["SPEC-06"]
      impact: |
        (M1) Add `Include/Core/TradeTypes.mqh` to the file manifest / component
        exports; note `ValidateOrderDefinition` consumes the Core `TradeIntent`
        rather than a market-local struct. (L2) Amend the market-session model so
        `MarketSessionEndTod` (the `market_session_end_tod` input to
        `CSessionContext::Evaluate`) is defined as the regular (first) trade
        session end; record after-hours exclusion as a v1 simplification next to
        the midnight-crossing out-of-scope note.
        The 2026-08-29 amendment also records that ValidateOrderDefinition rejects
        any side other than ORDER_TYPE_BUY or ORDER_TYPE_SELL before other checks.
      cascade_direction: downstream
    - layer: SPEC
      artifacts: ["SPEC-02"]
      impact: |
        (M1) Reconcile the `TradeIntent` data model: it EXTENDS the canonical Core
        `TradeIntent` (Include/Core/TradeTypes.mqh) — adding `signal`, `stops`,
        `symbol`, `ts`, `risk_percent`, identity/comment fields — rather than
        declaring an independent struct. The canonical base constructor zeroes
        numeric fields, leaves `order_type` at invalid sentinel -1, and requires
        explicit BUY/SELL assignment before validation or submission. IPLAN-02
        must include and build on the Core header.
      cascade_direction: downstream
    - layer: SPEC
      artifacts: ["SPEC-03"]
      impact: |
        (M1) Annotate that `ITradePort::Submit` and `CGuardedTrade` consume the
        canonical Core `TradeIntent` (Include/Core/TradeTypes.mqh). No interface
        signature change.
      cascade_direction: downstream
    - layer: SPEC
      artifacts: ["SPEC-09"]
      impact: |
        (L2) Doc-only clarification of `CLOSE_REF_MARKET_SESSION_END`: the
        referenced session end is the broker REGULAR (first) trade-session end;
        after-hours excluded. The `ENUM_SESSION_CLOSE_REF` enum and the
        `CommonInputs.close_reference` field are unchanged.
      cascade_direction: downstream
    - layer: TDD
      artifacts: ["TDD-06"]
      impact: |
        (M1) Note that `TradeIntent` fixtures resolve to the Core canonical type
        and cover the invalid default sentinel plus explicit invalid-side rejection.
        (L2) Record that `MarketSessionEndTod` regular-session-end selection is a
        thin live-adapter behavior verified on the live/demo B3 feed (no
        fake-based unit coverage); FakeMarketSessionProvider returns a single
        configured end-tod, so existing close-reference cases remain valid.
      cascade_direction: downstream
    - layer: IPLAN
      artifacts: ["IPLAN-06"]
      impact: |
        Update `file_manifest` and `code_inventory` to add
        `Include/Core/TradeTypes.mqh` and reflect the MarketContext.mqh edit
        (TradeIntent moved out; new include) and the MarketSessionEndTod
        regular-session-end change. Update `session_handoff`.
      cascade_direction: downstream
    - layer: IPLAN
      artifacts: ["IPLAN-00"]
      impact: |
        Registry note that IPLAN-06 carries the CHG-21 amendments (canonical
        TradeIntent header + regular-session-end close reference).
      cascade_direction: downstream
    - layer: Code
      artifacts:
        - "Include/Core/TradeTypes.mqh"
        - "Include/Market/MarketContext.mqh"
        - "Include/Core/Interfaces.mqh"
        - "Include/Market/Interfaces.mqh"
        - "Include/Market/SessionContext.mqh"
        - "Include/Core/CommonInputs.mqh"
      impact: |
        (M1) New Core/TradeTypes.mqh holding the canonical TradeIntent. The
        2026-08-29 amendment changes the constructor from valid BUY default to
        invalid sentinel -1; MarketContext rejects non-BUY/SELL sides before
        trade-mode or numeric checks; Test_ContractLifecycle covers the omitted-side path.
        MarketContext.mqh removes its local struct and includes the Core header;
        Core/Interfaces.mqh deferred-seam note updated (TradeIntent now canonical
        in Core; only ITradePort/GuardResult remain deferred to SPEC-03).
        (L2) MarketContext.mqh CLiveMarketSessionProvider::MarketSessionEndTod
        returns the index-0 session end; doc-comment alignment in
        Market/Interfaces.mqh, SessionContext.mqh, CommonInputs.mqh, and the
        MarketContext.mqh EvaluateSession block. No enum/field/signature changes.
      cascade_direction: downstream
  cascade_direction: downstream
  risk_level: Medium
  risk_justification: |
    Original M1 was a type relocation. The 2026-08-29 amendment changes default
    construction behavior without changing fields or signatures: an omitted side
    now fails explicitly instead of silently representing BUY. Test_ContractLifecycle
    covers the constructor sentinel and validation branch. The durability
    of M1 depends on IPLAN-02/03 EXTENDING the Core struct rather than redefining
    it — captured as a SPEC-02/03 amendment so the constraint is recorded, not
    implicit. L2 changes which broker session end is selected for the day-trade
    close; it is bounded because the default close reference remains
    CLOSE_REF_USER_WINDOW_END (unaffected), and the change only narrows the
    optional MARKET_SESSION_END path from "last session" to "regular session."
    The L2 live-adapter behavior has no fake-based unit coverage (thin adapter,
    consistent with the other live providers) and is verified manually on the B3
    feed. EARS/BDD: assessed — no new top-level requirement; both items are
    refinements within behavior already in the corpus, so no EARS/BDD amendment
    is required.

