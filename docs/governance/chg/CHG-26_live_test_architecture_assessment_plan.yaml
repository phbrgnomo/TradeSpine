change_description:
  what: "Amend and approve @spec: SPEC-11 and @tdd: TDD-11 live-test assessment and closeout contracts at GATE-06, then derive Draft @iplan: IPLAN-14 from @tdd: TDD.11.04.c14e and @tdd: TDD.11.04.d14e before documentation_closeout."
  why: "The original Draft IPLAN-14 introduced coverage, refactor-decision, and closeout-disposition contracts before those contracts existed in approved upstream layers. The corrected cascade establishes design and test authority before execution planning."
  trigger: "Review instruction: approve the upstream contract before creating the IPLAN contract; never invent a downstream layer ahead of an approved upstream."

impact_assessment:
  affected_layers:
    - layer: "SPEC"
      artifacts: ["SPEC-11"]
      impact: "Approve LiveTestAssessmentContract, LiveTestAssessmentResult, LiveTestCloseoutGate, coverage/finding/decision/disposition models, safety boundaries, and exact-inventory closeout behavior."
    - layer: "TDD"
      artifacts: ["TDD-11", "TDD.11.04.c14e", "TDD.11.04.d14e"]
      impact: "Approve three-output assessment-completeness/evidence-separation and exact-inventory closeout-disposition test contracts derived from SPEC-11/CHG-26 without retroactive BDD attribution."
    - layer: "IPLAN"
      artifacts: ["IPLAN-14", "IPLAN-00"]
      impact: "Derive the Draft assessment plan from approved SPEC/TDD contracts and retain GATE-08 as the execution-approval boundary."
    - layer: "Project Guidance"
      artifacts: ["CLAUDE.md"]
      impact: "Retain Tier-10 documentation_closeout wording after IPLAN-14."
    - layer: "CHG"
      artifacts: ["CHG-26", "CHG-00", "CHG-26 gate form/report"]
      impact: "Correct routing from execution/GATE-08 to design/GATE-06 followed by GATE-08."
    - layer: "Code"
      artifacts: []
      impact: "No MQL5 source or assessment deliverable is implemented by this change."
  cascade_direction: "upstream→downstream"
  risk_level: Medium

