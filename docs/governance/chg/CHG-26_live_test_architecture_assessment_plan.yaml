change_description:
  what: "Amend and approve @spec: SPEC-11 and @tdd: TDD-11 before deriving Draft @iplan: IPLAN-14; align documentation_closeout at Tier 10; and govern the TradeIntent invalid-side constructor, validation guard, and regression test through SPEC-02/SPEC-06/TDD-06 plus GATE-CODE."
  why: "IPLAN-14 initially preceded approved upstream contracts. The same review set also changed production TradeIntent behavior while CHG-26 claimed no code scope, and retained an obsolete closeout-owner label plus an outdated canonical constructor contract."
  trigger: "Review instructions requiring upstream-first IPLAN derivation, complete finding matching, Tier-10 closeout consistency, and code-gate governance for the TradeIntent fail-loud default."

root_cause_analysis:
  problem_statement: "TradeIntent default construction selected ORDER_TYPE_BUY, so a caller that omitted side assignment could carry a valid direction until another incidental field guard rejected it."
  cause_chain:
    - "The canonical constructor used a valid enum member as its default."
    - "The canonical SPEC/CHG wording described only a generic zeroing default and did not require explicit side assignment."
    - "ValidateOrderDefinition lacked an explicit BUY/SELL whitelist before the amendment."
    - "The PR combined this behavior change with CHG-26 while CHG-26 declared Code scope empty."
  root_cause_layer: "SPEC/TDD and Code"
  layer_justification: "The constructor contract belongs to SPEC-02, validation behavior to SPEC-06, regression mapping to TDD-06, and enforcement to TradeTypes.mqh/MarketContext.mqh."
  regression_scope:
    - "Default constructor exposes order_type sentinel -1."
    - "ValidateOrderDefinition rejects missing or unsupported order side before other validation."
    - "Explicit ORDER_TYPE_BUY and ORDER_TYPE_SELL intents remain accepted when other fields are valid."

impact_assessment:
  affected_layers:
    - layer: "SPEC"
      artifacts: ["SPEC-02", "SPEC-06", "SPEC-11"]
      impact: "SPEC-11 owns the approved live-test assessment contracts. SPEC-02/SPEC-06 amendments define the TradeIntent invalid default side and its rejection before other validation; their new scope remains pending GATE-06 approval."
    - layer: "TDD"
      artifacts: ["TDD-06", "TDD-11", "TDD.11.04.c14e", "TDD.11.04.d14e"]
      impact: "TDD-11 owns the approved three-output assessment contracts. TDD-06 maps the missing-side TradeIntent regression to Test_ContractLifecycle; the amendment remains pending GATE-06 approval."
    - layer: "IPLAN"
      artifacts: ["IPLAN-04", "IPLAN-06", "IPLAN-14", "IPLAN-00"]
      impact: "Derive Draft IPLAN-14 from approved contracts, move documentation_closeout ownership to Tier 10, and align IPLAN-06's TradeIntent manifest description; GATE-08 remains the execution-approval boundary."
    - layer: "Implementation Documentation"
      artifacts: ["Docs/MODULES/Core.md", "Docs/MODULES/Market.md"]
      impact: "Document the invalid default side, explicit BUY/SELL assignment, and early validation rejection."
    - layer: "Project Guidance"
      artifacts: ["CLAUDE.md"]
      impact: "Retain Tier-10 documentation_closeout wording after IPLAN-14."
    - layer: "CHG"
      artifacts: ["CHG-12", "CHG-21", "CHG-26", "CHG-00", "CHG-26 gate form/report"]
      impact: "Correct Tier-10 references, record the canonical TradeIntent amendment, and route the combined design/IPLAN/code scope through GATE-06, GATE-08, and GATE-CODE."
    - layer: "Code"
      artifacts: ["Include/Core/TradeTypes.mqh", "Include/Market/MarketContext.mqh", "Scripts/Tests/Test_ContractLifecycle.mq5"]
      impact: "Default TradeIntent.order_type changes from ORDER_TYPE_BUY to invalid sentinel -1; ValidateOrderDefinition rejects non-BUY/SELL values before other checks; the lifecycle test covers constructor and validation behavior. No live-test assessment deliverable is implemented."
  cascade_direction: "upstream→downstream"
  risk_level: Medium

