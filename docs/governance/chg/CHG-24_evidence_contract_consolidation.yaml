    - layer: IPLAN
      artifacts: ["IPLAN-00", "IPLAN-04", "IPLAN-05"]
      impact: "Replace repeated closure criteria with a reference to SPEC-08 while retaining plan-specific evidence facts and the IPLAN-00 registry inventory."
    - layer: Documentation
