change_description:
  what: "Make SPEC-08 the canonical evidence-contract summary, define consistent evidence-model field semantics, and replace repeated closure/aggregate-test prose with references to that contract. Correct the README subject-verb agreement."
  why: "Duplicated closure and aggregate-runner statements can drift. Text-only evidence models leave future programmatic consumers without explicit field-name, nullability, cardinality, and timestamp rules."
  trigger: "Code review comments received 2026-08-27."

