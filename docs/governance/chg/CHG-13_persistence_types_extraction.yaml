  supersedes: []

# =============================================================================
# Section 2: Change Description
# =============================================================================

change_description:
  what: |
    Create Include/Persistence/PersistenceTypes.mqh as a thin shared-types
    header. Move ENUM_TRADE_RECORD_TYPE (the only type in StateStore.mqh that
    CStateStore does not use) into that file. Update StateStore.mqh to
    '#include "PersistenceTypes.mqh"' instead of hosting the definition.
    Update TradeLogger.mqh to '#include "PersistenceTypes.mqh"' directly,
    removing its current dependency on StateStore.mqh. Update @iplan:IPLAN-05 file
    manifest and exports map and @spec:SPEC-05 module exports to reflect the new file.

  why: |
    StateStore.mqh currently owns ENUM_TRADE_RECORD_TYPE but never references
    it in any CStateStore method, IStateStore interface, or internal logic.
    The enum exists solely for TradeLogger's use. Hosting it in StateStore
    forces TradeLogger to pull in the full GV-backed state-machine header
    (CKeyBuilder, CanonicalIdentity, fingerprint logic) just to get two enum
    values. This is spurious coupling that will worsen as more Persistence
    modules are added. A dedicated shared-types header is the standard MQL5
    pattern for breaking this kind of accidental dependency.

  trigger: |
    Code-review observation during IPLAN-05 session: "StateStore.mqh owns a
    type it never uses — ENUM_TRADE_RECORD_TYPE is defined there but not
    referenced anywhere in CStateStore logic." The comment in StateStore.mqh
    ('Shared by StateStore and TradeLogger to avoid circular inclusion') flags
    the workaround explicitly.

# =============================================================================
# Section 3: Impact Assessment
# =============================================================================

impact_assessment:
  affected_layers:
    - layer: "Code"
      artifacts:
        - "Include/Persistence/PersistenceTypes.mqh (created)"
        - "Include/Persistence/StateStore.mqh (modified)"
        - "Include/Persistence/TradeLogger.mqh (modified)"
      impact: |
        New file PersistenceTypes.mqh defines ENUM_TRADE_RECORD_TYPE.
        StateStore.mqh loses the ENUM_TRADE_RECORD_TYPE definition and gains
        '#include "PersistenceTypes.mqh"' — all existing consumers that include
        StateStore.mqh continue to resolve ENUM_TRADE_RECORD_TYPE transitively
        (no breakage). TradeLogger.mqh replaces '#include "StateStore.mqh"'
        with '#include "PersistenceTypes.mqh"'. Test files (Test_StateStore.mq5,
        Test_TradeLogger.mq5) require no changes: the transitive include chain
        remains intact.

    - layer: "IPLAN"
      artifacts: ["@iplan:IPLAN-05"]
      impact: |
        file_manifest: add PersistenceTypes.mqh entry (status: created).
        code_inventory exports map: add PersistenceTypes.mqh with export
        ENUM_TRADE_RECORD_TYPE; remove ENUM_TRADE_RECORD_TYPE from
        StateStore.mqh exports. code_paths: add PersistenceTypes.mqh reference.
        session_handoff and build_commands may reference the new file.

    - layer: "SPEC"
      artifacts: ["@spec:SPEC-05"]
      impact: |
        Module exports entry for StateStore.mqh: remove ENUM_TRADE_RECORD_TYPE
        from the exports list. Add a PersistenceTypes.mqh module entry with
        export ENUM_TRADE_RECORD_TYPE. No interface contracts, data-model
        invariants, or behavioral requirements change.

  cascade_direction: downstream→upstream
  # Root cause is in Code; documentation layers (@iplan:IPLAN-05, @spec:SPEC-05) are updated
  # to stay in sync — a limited bubble-up for doc accuracy, no upstream requirement change.

  risk_level: Low
  # Zero behavioral change. ENUM_TRADE_RECORD_TYPE values and semantics are
  # unchanged. Transitive includes preserve all existing call sites. No GV
  # keys, CSV formats, or test logic are affected.

