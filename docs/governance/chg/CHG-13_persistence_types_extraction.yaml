  document_type: "chg-document"
  purpose: governance
  last_updated: "2026-06-14"

  change_level:
    value: C2  # Section update / code refactor; no behavioral change, no new requirements.

  change_source:
    value: feedback  # Code-review observation: StateStore.mqh owns a type it never uses.

