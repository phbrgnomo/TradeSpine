  supersedes: []

change_description:
  what: |
    Three correctness fixes to Include/Persistence/TradeLogger.mqh:

    1. **ulong magic corrupted in CSV** (IMPORTANT — data integrity).
       IntegerToString((long)rec.magic) casts ulong to long before formatting,
       producing a negative signed value for magic numbers above LONG_MAX.
       Fix: StringFormat("%I64u", rec.magic) — identical pattern to CKeyBuilder.

    2. **CSV fields unquoted** (IMPORTANT — data integrity).
       Concatenating raw string fields into a comma-delimited row without
       RFC 4180 escaping allows broker_outcome (explicitly free-form in SPEC-05)
       to corrupt columns if it contains a comma, double-quote, or newline.
       Fix: add private static _CsvField(v) helper (quote + double-quote
       escape) and apply it to all string data fields in _WriteRow.

    3. **record_type not enforced by public methods** (SUGGESTION — API safety).
       WriteIntent/WriteExecution delegate to _WriteRow which reads
       rec.record_type from the caller. A caller passing the wrong type emits
       a row that disagrees with the method contract.
       Fix: WriteIntent/WriteExecution clone the record and override
       record_type before calling _WriteRow, making the methods self-enforcing.

  why: |
    Trade evidence CSV is the forensic audit trail. Corrupted magic values
    and split/shifted rows make post-mortem pairing unreliable and break
    Python/SQLite ETL pipelines. The ulong issue was already solved in
    CKeyBuilder but not applied consistently to the CSV serializer.

  trigger: |
    Code-review findings submitted to IPLAN-05 post-delivery session.

impact_assessment:
  affected_layers:
    - layer: "Code"
      artifacts:
        - "Include/Persistence/TradeLogger.mqh (modified)"
      impact: |
        _WriteRow: use _CsvField() for string fields; use %I64u for magic.
        New private static method _CsvField(v): RFC 4180 quote + escape.
        WriteIntent: clone rec, force record_type = TRADE_RECORD_INTENT.
        WriteExecution: clone rec, force record_type = TRADE_RECORD_EXECUTION.
        Zero behavior change for well-formed inputs; correct output for
        magic > LONG_MAX or broker_outcome containing commas/quotes.

    - layer: "SPEC"
      artifacts: ["SPEC-05"]
      impact: |
        Add two implementation_notes constraints:
        (a) CSV string fields MUST use RFC 4180 double-quote escaping.
        (b) ulong fields in serialized output MUST use %I64u (not cast to long).

    - layer: "IPLAN"
      artifacts: ["IPLAN-05"]
      impact: |
        Session_handoff: add CHG-14 entry. No manifest or exports changes —
        no new files created.

  cascade_direction: downstream→upstream
  risk_level: Low
  # No interface change. Existing consumers that pass correct records are unaffected.
  # Records with magic > LONG_MAX or commas in broker_outcome were previously
  # silently corrupted — CHG-14 fixes the output; no caller change required.

