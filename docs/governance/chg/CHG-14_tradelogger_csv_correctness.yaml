id: CHG-14
title: "TradeLogger CSV correctness: ulong magic, RFC 4180 quoting, record_type enforcement"

metadata:
  document_type: "chg-document"
  purpose: governance
  last_updated: "2026-06-14"

  change_level:
    value: C2

  change_source:
    value: feedback  # Code-review findings on TradeLogger._WriteRow and WriteIntent/WriteExecution.

change_control:
  chg_id: "CHG-14"
  status: Implemented
  change_level: C2
  change_source: feedback
  entry_gate: GATE-CODE
  semver_impact: null
  author: "phbr"
  date_proposed: "2026-06-14T00:00:00Z"
  date_approved: "2026-06-14T00:00:00Z"
