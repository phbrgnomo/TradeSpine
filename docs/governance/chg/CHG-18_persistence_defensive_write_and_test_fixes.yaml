id: CHG-18
title: "Persistence layer: defensive-write checks, side enum, and test-determinism fixes"

metadata:
  document_type: "chg-document"
  purpose: governance
  last_updated: "2026-06-16"

  change_level:
    value: C2

  change_source:
    value: feedback  # Code review (three rounds, 2026-06-16): TradeLogger header-write result ignored, TradeEvidenceRecord.side was an unconstrained string, CStateStore._setGV() discarded GetLastError() detail, Test_AlertSink.mq5 could not independently prove SetHalt() was attempted, and Test_TradeLogger.mq5 wrote/read mismatched file paths.

