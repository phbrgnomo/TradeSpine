rollback_plan:
  strategy: revert-commit
  steps:
    - "Revert TradeLogger.mqh: remove ENUM_TRADE_SIDE, restore TradeEvidenceRecord.side to string, remove _SideToString(), restore _EnsureFile() to ignore the header FileWriteString() result."
    - "Revert StateStore.mqh: restore _setGV() to a bare GlobalVariableSet(key, value) != 0 return."
    - "Revert Test_TradeLogger.mq5 and Test_AlertSink.mq5 to their pre-CHG-18 state (path-prefix bug and halt_call_count both reintroduced — not recommended; see why)."
    - "Revert SPEC-05, IPLAN-05, IPLAN-00 index, and Docs/MODULES/Persistence.md edits."
  estimated_effort: "20 minutes"
  risk_note: |
    Reverting Test_TradeLogger.mq5 reintroduces a confirmed test-harness bug
    (tests silently validate the wrong file). Reverting Test_AlertSink.mq5
    weakens the CHG-17 regression guard back to an indirect inference. Revert
    only if the enum/diagnostic-logging changes themselves are the problem;
    prefer a narrower revert of just files 1-2 if so.

