change_description:
  what: |
    Clarify the SDD fixture ownership boundary around FakeMarketContext.

    FakeMarketContext is the IPLAN-06 market fixture. It covers symbol metadata,
    broker-session open/end state, close-reference test data, and contract
    expiration scenarios needed by session and symbol context tests.

    Execution-only market inputs such as spread, fill mode, OrderCheck/margin
    outcomes, broker retcodes, and private CTrade submission outcomes do not
    belong in FakeMarketContext. Those are owned by SPEC-03/TDD-03/IPLAN-03 and
    are planned through FakeTradePort. Position/account ownership remains
    IPLAN-04 through FakePositionView.
  why: |
    Review of Scripts/Tests/Support/FakeMarketContext.mqh showed that the
    implementation already models the market-session and symbol-context surface
    needed by IPLAN-06, including session-end reference data. However, TDD-11
    still described IPLAN-06 as owning spread and fill-mode fake data, which
    overlaps the guarded execution plan. Leaving that wording in place would
    push execution fixtures into the wrong owner plan and make future test
    expansion unclear.
  trigger: |
    User requested implementation of the plan to update implementation
    documentation, expand FakeMarketContext only when needed, create new
    fixtures under their owner plans when needed, and run the proper SDD/aidoc
    documentation flow for both IPLAN and upstream documentation.

impact_assessment:
  affected_layers:
    - layer: SPEC
      artifacts: ["SPEC-03", "SPEC-11"]
      impact: |
        SPEC-03 now explicitly owns execution fixture inputs: spread, fill
        mode, OrderCheck, margin, broker-retcode, and private CTrade outcome
        scenarios. SPEC-11 now states that market-owned fakes stop at symbol
        metadata, broker-session state, session-close references, and contract
        expiration.
      cascade_direction: design
    - layer: TDD
      artifacts: ["TDD-03", "TDD-11"]
      impact: |
        TDD-03 integration setup now requires execution-owned fixtures for
        spread/fill/OrderCheck/margin/retcode/private CTrade call counts.
        TDD-11 owner-extension scope no longer assigns spread/fill-mode to
        IPLAN-06.
      cascade_direction: design
    - layer: IPLAN
      artifacts: ["IPLAN-03", "IPLAN-04", "IPLAN-07", "IPLAN-11", "IPLAN-00"]
      impact: |
        IPLAN-03 declares FakeTradePort as the execution-owned fixture file.
        IPLAN-04 declares FakePositionView as the position/account-owned
        fixture file. IPLAN-07 instructs sizing/stops work to reuse IPLAN-06
        market metadata before adding any local symbol facade. IPLAN-11 records
        FakeMarketContext as the implemented IPLAN-06 fixture and keeps
        FakeSymbolContext as optional future owner-extension work.
      cascade_direction: design
    - layer: Code
      artifacts: ["Scripts/Tests/Support/FakeMarketContext.mqh"]
      impact: |
        No code change is required in this CHG. Existing FakeMarketContext
        behavior is documented as the market-owned scope; future execution and
        position/account fixtures are planned in their owner IPLANs.
      cascade_direction: none
  cascade_direction: bubble-down
  risk_level: Low
  risk_justification: |
    The change is documentation and planning only. It reduces implementation
    risk by assigning future fixture expansion to the owner plans that publish
    the corresponding production interfaces.

