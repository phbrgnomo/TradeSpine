id: CHG-15
title: "TradeLogger schema extension: structured intent and execution columns"

metadata:
  document_type: "chg-document"
  purpose: governance
  last_updated: "2026-06-15"

  change_level:
    value: C2

  change_source:
    value: feedback  # Design review: broker_outcome buries all forensic detail in a free-form string.

change_control:
  chg_id: "CHG-15"
  status: Implemented
  change_level: C2
  change_source: feedback
  entry_gate: GATE-CODE
  semver_impact: null
  author: "phbr"
  date_proposed: "2026-06-15T00:00:00Z"
  date_approved: "2026-06-15T00:00:00Z"
  date_implemented: "2026-06-15T00:00:00Z"
  supersedes: []

change_description:
  what: |
    Add 9 structured forensic columns to TradeEvidenceRecord and the TradeLogger CSV output.

    Before: all forensic detail (fill price, lot size, retcode, stop levels) was buried in the
    free-form broker_outcome string, making it impossible to audit individual fields without
    string parsing.

    After: intent-side fields (side, intended_price, sl_price, tp_price, lots_requested) are
    populated on INTENT rows; execution-side fields (retcode, ticket, fill_price, lots_submitted)
    are populated on EXECUTION rows. Fields inapplicable to the row type are written as empty
    cells. side is written on both row types to allow standalone EXECUTION row auditing without
    joining back to the INTENT row. broker_outcome is retained as free-form overflow for
    rejection messages and retry info. Single-file design is preserved (no split files).

  why: |
    After the forensic audit trail purpose was clarified (MT5 trade history owns strategy
    performance analysis; TradeLogger owns the pre/post-broker evidence record), it became
    clear that broker_outcome as a catch-all string cannot serve that forensic purpose:
    you cannot ask "what SL did the EA request?" or "was this fill at the intended price?"
    without parsing opaque strings. Structured columns make those questions answerable
    with a pandas filter.

  trigger: "Design review of TradeLogger after SPEC-05 scope discussion."

