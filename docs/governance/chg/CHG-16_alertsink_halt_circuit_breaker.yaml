id: CHG-16
title: "CAlertSink HALT circuit-breaker: persistent GV flag via IStateStore"

metadata:
  document_type: "chg-document"
  purpose: governance
  last_updated: "2026-06-15"

  change_level:
    value: C2

  change_source:
    value: feedback  # Design review revealed that dismissing Alert() implicitly resumes the EA.

change_control:
  chg_id: "CHG-16"
  status: Approved
  change_level: C2
  change_source: feedback
  entry_gate: GATE-CODE
  semver_impact: null
  author: "phbr"
  date_proposed: "2026-06-15T00:00:00Z"
  date_approved: "2026-06-15T00:00:00Z"
  date_implemented: null
