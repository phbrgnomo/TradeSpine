change_description:
  what: |
    Reconcile two code-first changes made on the IPLAN-06 branch with their
    upstream SDD artifacts.

    (1) NEW INPUT — session close reference. A new enum
    `ENUM_SESSION_CLOSE_REF { CLOSE_REF_USER_WINDOW_END=0,
    CLOSE_REF_MARKET_SESSION_END=1 }` and a new `CommonInputs.close_reference`
    field (default `CLOSE_REF_USER_WINDOW_END`) were added to
    `Include/Core/CommonInputs.mqh`, validated in `CommonInputs::Validate()`
    when `day_trade_mode=true`. `CSessionContext::Evaluate` gained a
    `market_session_end_tod` parameter, and a new `IMarketSessionProvider`
    seam (`Include/Market/Interfaces.mqh`) with a live adapter
    (`CLiveMarketSessionProvider`, reading `SymbolInfoSessionTrade`) supplies
    it. When `close_reference=CLOSE_REF_MARKET_SESSION_END` the day-trade close
    trigger is measured from the broker session end rather than the user entry
    window end (falling back to the window end when the session end is
    unavailable). This adds a new input to the IPLAN-09 `CommonInputs` contract
    (SPEC-09) and a new behavioral refinement to the session model (SPEC-06),
    plus the test coverage owed in TDD-09.

    (2) CORRECTNESS — broker market-session gate. `IMarketSessionProvider`
    gained `IsMarketSessionOpen(when)`, and `CMarketContext::EvaluateSession`
    now sets `SessionWindow.market_open` from broker-session membership only
    (conservative closed when no session provider is wired). Directional
    `SYMBOL_TRADE_MODE` permission is evaluated later by
    `ValidateOrderDefinition` through `CSymbolContext::IsEntryAllowedLive` once
    a concrete BUY or SELL intent exists. Previously `market_open` combined
    schedule membership with a direction-agnostic trade-mode query, conflating
    session state with order authorization. SPEC-06 is amended to define the
    schedule-only field contract.
  why: |
    The IPLAN-06 branch review (IPLAN-06_branch_review_report_v001, finding H4)
    flagged that the `close_reference` field is live in a completed IPLAN-09
    file (`CommonInputs`) but absent from SPEC-09, SPEC-06, and TDD-09, breaking
    the SDD rule that the canonical YAML remains the implementation reference
    and risking input/template documentation drift. IPLAN-06 itself records the
    code-first spike and the owed CHG cascade. The same review (H1) flagged that
    the `market_open` contract was ambiguous before IPLAN-02/03/04 consume
    `SessionWindow`; the correction separates schedule state from directional
    order authorization and surfaces the `market_session_end_tod` parameter
    that SPEC-06 must mention for item 1.
  trigger: |
    User-approved code-first spike during IPLAN-06 (Session 3, 2026-06-18) plus
    the IPLAN-06 branch review remediation (2026-06-19) directing that all nine
    review findings — including the H4 upstream reconciliation and the H1
    market-session correctness fix — be brought to merge-ready, with the CHG
    cascade run in-session.

impact_assessment:
  affected_layers:
    - layer: SPEC
      artifacts: ["SPEC-09"]
      impact: |
        Add `close_reference` to the `CommonInputs` data model: type
        `ENUM_SESSION_CLOSE_REF`, required, `[day_trade_mode]`, default
        `CLOSE_REF_USER_WINDOW_END`, with the validation rule (whitelist the two
        enum values when day_trade_mode=true; reject unknown casts). Document
        the `ENUM_SESSION_CLOSE_REF` enum in SPEC-09's exported types.
      cascade_direction: bubble-up
    - layer: SPEC
      artifacts: ["SPEC-06"]
      impact: |
        Document that the day-trade close trigger is measured from a configurable
        reference (user entry-window end vs broker market-session end per
        `close_reference`), and that session evaluation accepts a
        `market_session_end_tod` input supplied by the new
        `IMarketSessionProvider` seam. Amend `SessionWindow.market_open` to
        describe broker-session membership only; directional symbol trade-mode
        permission belongs to ValidateOrderDefinition for a concrete intent.
      cascade_direction: bubble-up
    - layer: TDD
      artifacts: ["TDD-09"]
      impact: |
        Add a `close_reference` validation test case mapped to a new
        `Test_CommonInputs.mq5` test: default accepted; both valid enum values
        accepted under day_trade_mode=true; unknown/cast value rejected with a
        diagnostic.
      cascade_direction: bubble-up
    - layer: TDD
      artifacts: ["TDD-06"]
      impact: |
        Refine the session integration contract so market_open is asserted as
        broker schedule membership, while a separate facade assertion proves
        directional SYMBOL_TRADE_MODE permission is enforced by
        ValidateOrderDefinition for a concrete intent.
      cascade_direction: bubble-up
    - layer: Code
      artifacts:
        - "Include/Core/CommonInputs.mqh"
        - "Include/Market/Interfaces.mqh"
        - "Include/Market/MarketContext.mqh"
        - "Include/Market/SessionContext.mqh"
        - "Include/Market/SymbolContext.mqh"
        - "Scripts/Tests/Support/FakeMarketContext.mqh"
        - "Scripts/Tests/Test_CommonInputs.mq5"
        - "Scripts/Tests/Test_SymbolContext.mq5"
        - "Scripts/Tests/Test_SessionContext.mq5"
        - "Scripts/Tests/Test_ContractLifecycle.mq5"
      impact: |
        close_reference enum/field/validation (CommonInputs.mqh); Evaluate
        market_session_end_tod parameter and close-reference branch
        (SessionContext.mqh); IMarketSessionProvider seam with
        IsMarketSessionOpen + MarketSessionEndTod and the schedule-only
        EvaluateSession gate
        (Interfaces.mqh, MarketContext.mqh); fake session-open/end wiring
        (FakeMarketContext.mqh); close_reference unit coverage
        (Test_CommonInputs.mq5); session close-reference + market-session-gate
        tests (Test_SessionContext.mq5, Test_ContractLifecycle.mq5); live,
        side-aware trade-mode permission (SymbolContext.mqh and
        Test_SymbolContext.mq5). All code in this layer is already implemented
        on the branch.
      cascade_direction: source
  cascade_direction: bubble-up
  risk_level: Medium
  risk_justification: |
    The change extends a shipped Core input contract (`CommonInputs`, IPLAN-09)
    with one new optional-by-default field and refines the day-trade close
    semantics, so downstream sizing/session/execution IPLANs (02/03/04/07) will
    consume it. Risk is bounded because the default (`CLOSE_REF_USER_WINDOW_END`)
    preserves v1 behavior, the field is validated, and the code is already test-
    covered at the unit (CommonInputs) and integration (SessionContext) levels.
    The `market_open` item separates broker schedule state from directional
    entry authorization; downstream code must use ValidateOrderDefinition (and
    later CGuardedTrade) before submitting an order. EARS/BDD: assessed — no
    new top-level requirement; the day-trade
    close behavior already exists in the corpus and `close_reference` is a
    configuration refinement within it, so no EARS/BDD amendment is required.

