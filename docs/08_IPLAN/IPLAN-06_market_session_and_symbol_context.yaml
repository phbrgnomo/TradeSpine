implementation_contracts:
  provided:
    contracts:
      - name: "Market validation contract"
        type: "Protocol Interface"
        files: ["Include/Market/SymbolContext.mqh", "Include/Market/MarketContext.mqh"]
        summary: "Order definitions validate lots, stops, prices, and trade mode against initialized symbol metadata."
      - name: "Session window contract"
        type: "Data Model"
        files: ["Include/Market/SessionContext.mqh", "Scripts/Tests/Test_SessionContext.mq5"]
        summary: "Market session, user trading-hours gate, and day-trade close trigger are explicit and testable."
      - name: "Market fake surface contract"
        type: "Test Helper"
        files: ["Scripts/Tests/Support/FakeMarketContext.mqh", "Scripts/Tests/Test_SymbolContext.mq5", "Scripts/Tests/Test_SessionContext.mq5", "Scripts/Tests/Test_ContractLifecycle.mq5"]
        summary: "Owner-plan fake surface supplies deterministic symbol metadata, broker session window state and end-of-session reference, and contract expiration fixtures without calling live broker APIs from unit tests."
  consumed:
    dependencies:
      - "@iplan: IPLAN-05"
      - "@iplan: IPLAN-09"
      - "@iplan: IPLAN-11"

