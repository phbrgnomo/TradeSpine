execution_commands:
  cwd: "MQL5/Experts/Main/TradeSpine"
  setup:
    - "mkdir -p Include/Market Scripts/Tests Scripts/Tests/Support"
  implementation:
    - "# Pre-flight: decide and create Scripts/Tests/Support/FakeMarketContext.mqh before writing IPLAN-06 tests."
    - "# FakeMarketContext is the IPLAN-06 owner-extension fake surface deferred by SPEC-11/TDD-11 for symbol metadata, broker session window state and end-of-session reference, and contract lifecycle fixtures."
    - "# Write TDD-06 tests first, then implement symbol, session, and market context."
    - "# Use broker/server time as authoritative and keep session gates separate from emergency close paths."
