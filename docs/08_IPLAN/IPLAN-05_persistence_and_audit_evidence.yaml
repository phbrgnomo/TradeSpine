  provided:
    contracts:
      - name: "State persistence contract"
        type: "Protocol Interface"
        files: ["Include/Persistence/KeyBuilder.mqh", "Include/Persistence/StateStore.mqh"]
        summary: "Lifecycle state uses two checksum-verified slots with commit-last generation publication; legacy evidence migrates only when unambiguous."
      - name: "Marker fencing contract"
        type: "DI Interface"
        files: ["Include/Persistence/MarkerLease.mqh", "Include/Persistence/StateStore.mqh", "Scripts/Tests/Test_StateStore.mq5"]
        summary: "CMarkerLease owns the bootstrap/CAS/heartbeat protocol behind IMarkerBackend; production holds an exclusive identity lock, revalidates owner plus heartbeat before success, and never converts a heartbeat verification failure into release."
      - name: "Evidence sink contract"
        type: "Data Model"
        files: ["Include/Persistence/TradeLogger.mqh", "Include/Persistence/Logger.mqh", "Include/Persistence/AlertSink.mqh"]
        summary: "Trade evaluation, diagnostics, and operator alerts remain separate; HALT/recovery records append and IAlertSink reports persistence failure."
