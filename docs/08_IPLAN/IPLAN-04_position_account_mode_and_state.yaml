cutover_smoke_matrix:
  - phase: MANUAL_F7
    invocation: "In MetaEditor, open and press F7 for Test_StateStore.mq5, Test_AlertSink.mq5, Test_PositionStateMachine.mq5, Test_AccountModeAdapters.mq5, Test_AccountModeDeferred.mq5, Test_PositionLiveProviders.mq5, and RunAllTests.mq5."
    expected: "Each source produces a fresh EX5 with 0 errors and 0 warnings; record source and EX5 timestamps plus SHA-256."
    timeout_or_failure: "Any missing/stale EX5, error, or warning returns to REMEDIATE."
  - phase: MT5_TEST
    invocation: "Run each focused script, then RunAllTests, from MT5 Navigator against the same terminal build and export Experts/Journal output."
    expected: "Exact passed/failed/skipped counts meet cutover_thresholds.tests; provider parity submits zero trade requests."
    timeout_or_failure: "Any failed assertion, unexplained skip, timeout, or missing output returns to REMEDIATE."
  - phase: PRODUCTION_ASSEMBLY_INTEGRATION
    invocation: "After IPLAN-01/02/03 are DONE, manually F7 and run Test_StrategyBase.mq5, Test_Coordinator.mq5, Test_GuardedTrade.mq5, Test_BrokerBypassScan.mq5, all IPLAN-04/05 focused suites, and RunAllTests.mq5."
    expected: "All producers and consumers accept CHG-22-R1, provider lifetime/injection is proven, final broker mutation fencing passes, and bypass scan has zero findings."
    timeout_or_failure: "Absent consumer artifacts or any failure blocks TWO_CHART and every canary stage."
  - phase: TWO_CHART
    invocation: "Attach the fresh IPLAN-01 StrategyTemplate EX5 twice to demo charts with identical account, canonical symbol, and magic; export both chart logs and marker values."
    expected: "Exactly one instance becomes ready; after owner removal and lease expiry, the successor claims and fully reconciles before mutation."
    timeout_or_failure: "Duplicate success, stale-owner mutation, or recovery beyond 90 seconds transitions to HALT_AND_EXPORT."
  - phase: DEMO_CANARY
    invocation: "Attach the pinned production-assembly EX5 to one approved demo identity before the first reported trading-session open and observe through the final close."
    expected: "TS_DEPLOY_PHASE records commit, contract revision, EX5 checksums, identity, and phase; every canary threshold passes for the full session."
    timeout_or_failure: "Any stop condition disables within 60 seconds and transitions to ROLLBACK."
  - phase: RESTRICTED_LIVE_TO_FULL
    invocation: "Promote the exact pinned bundle to one restricted live identity, then an approved partial cohort, then full rollout; emit TS_DEPLOY_PHASE at every boundary."
    expected: "Each phase independently meets the demo thresholds; a single-identity topology records PARTIAL_COHORT=N/A."
    timeout_or_failure: "Any identity or checksum drift, missing deploy event, or stop condition transitions to ROLLBACK."

cutover_thresholds:
  tests:
    focused_iplan04: "0 failed and 0 skipped; exact passed/failed/skipped counts recorded per focused script."
    aggregate: "0 failed; skips are permitted only when their exact function names remain status=pending in the canonical TDD tables, and every skip is listed in the report."
  ownership:
    - "Exactly one claimant succeeds in every first-use, stale-reclaim, CAS-to-heartbeat, heartbeat-loss, and release interleaving; every competing claimant has zero success tokens."
    - "MarkerIsOwner succeeds immediately before 100% of lifecycle commits and context-owned broker mutations; stale owners produce zero shared lifecycle or broker mutations."
  timing:
    - "Live maintenance gap remains below the 60-second lease minimum; planned cadence is 30 seconds and every late event is explained."
    - "After a competing owner is removed and required evidence is available, fresh claim plus safe reconciliation completes within 90 seconds."
    - "Gate failure disables the EA within 60 seconds; rollback source restore and static/manual verification completes within 15 minutes or escalates while the EA remains disabled."
  data_and_providers:
    - "Zero contradictory committed snapshots, zero uncorrelated lifecycle transitions, zero unexplained HALT events, and zero unavailable required provider/history facts."
    - "Every snapshot publication either advances one verified generation or leaves the prior generation authoritative."
  canary_window: "One complete terminal-reported trading session: attach no later than the first SymbolInfoSessionTrade opening, observe through the final reported close, and permit no terminal disconnect longer than 60 seconds."

pre_cutover_rehearsal:
  environment: "Demo account with representative symbol/magic, broker history, active-order/position evidence, lifecycle generations, and two-chart ownership contention."
  required_injections:
    - "Lose the owner token between maintenance cycles and prove the stale chart cannot mutate shared lifecycle or broker state."
    - "Make required history/provider evidence unavailable and prove HALT plus evidence export."
    - "Corrupt the inactive snapshot during replacement and prove the prior committed generation remains authoritative."
  rollback_target:
    source_commit: "ac7fe244dec1aa2d5897da406bf6c817804c607d"
    binary_checksum: "Captured from a fresh manual F7 build of the approved rollback source before rehearsal; the existing stale EX5 is not acceptable evidence."
    retrieval: "Local Git object database plus an operator-created read-only export of the approved source/EX5 bundle before canary."
  pass_signals:
    same_revision_restore: "EA disabled, evidence preserved, approved CHG-22-R1 bundle restored, fresh F7 clean, exactly one owner, and canonical reconciliation proves flat or one unambiguously owned position within the timing thresholds."
    migrated_state_downgrade: "After SPEC.05.06.7c3a, the EA remains disabled/HALT; exclusive ownership and broker evidence prove flat with no matching live order, snapshots/legacy keys are exported, rollback-compatible legacy IDLE is published, HALT clears last, and only then may the prior binary attach."
    phase_result: "DPL-CHG22-09 passes only when same_revision_restore passes and migrated_state_downgrade also passes whenever the migration boundary is in scope."

rollback_pairs:
  - forward: "Canonical SPEC/TDD/IPLAN/CHG cascade and readable companions."
    step_id: "RBK-CHG22-01"
    rollback: "Restore the complete approved documentation bundle from source commit ac7fe244dec1aa2d5897da406bf6c817804c607d; do not mix generations."
    precondition: "EA disabled and the current review/evidence bundle exported."
    success: "All restored canonical YAML parses, trace resolves, and git diff contains no partial CHG-22 document."
  - forward: "Position interfaces, canonical reconciliation, context/router, and three live provider classes."
    step_id: "RBK-CHG22-02"
    rollback: "Restore all Position interfaces and consumers as one source bundle, compile every affected script with manual F7, and keep the EA disabled until broker state is proven safe."
    precondition: "Current source, fresh EX5 checksums, terminal logs, and provider observations exported."
    success: "Fresh rollback EX5 set has 0 errors/0 warnings and no incompatible consumer remains."
  - forward: "LifecycleSnapshot, IStateStore/IAlertSink changes, marker backend/fencing, fakes, and shared tests."
    step_id: "RBK-CHG22-03"
    rollback: "Restore Persistence interfaces, implementations, all fakes, Test_StateStore, Test_AlertSink, and RunAllTests atomically."
    precondition: "Both snapshot generations, commit key, HALT audit, marker values, and legacy keys exported."
    success: "No mixed old/new interface compiles; restored tests pass with exact counts."
  - forward: "Seven new IPLAN-04 test/support artifacts."
    step_id: "RBK-CHG22-04"
    rollback: "Remove FakePositionView.mqh, FakeStateStore.mqh, FakeAlertSink.mqh, Test_PositionStateMachine.mq5, Test_AccountModeAdapters.mq5, Test_AccountModeDeferred.mq5, and Test_PositionLiveProviders.mq5 together with their RunAllTests registrations."
    precondition: "Test reports and sources are archived in the rollback evidence bundle."
    success: "RunAllTests contains no dangling include/function and the restored aggregate compiles cleanly."
  - forward: "First committed LifecycleSnapshot migration."
    step_id: "RBK-CHG22-05"
    rollback: "Do not attach a prior binary to migrated state. Under disabled/HALT operation and exclusive ownership, export snapshots and legacy keys, prove broker flat with no matching orders, publish rollback-compatible legacy IDLE evidence, clear the legacy HALT flag last, then restore the prior binary."
    precondition: "Rollback rehearsal has proven the exact legacy-key procedure and SPEC-05 decision SPEC.05.06.7c3a is acknowledged; otherwise remain disabled and escalate."
    success: "Prior binary starts only against verified flat legacy state and produces no broker mutation during reconciliation."
  - forward: "DPL-CHG22-10 demo-canary attachment."
    step_id: "RBK-CHG22-06"
    rollback: "Disable and detach the exact demo account-symbol-magic identity; preserve its broker/session evidence and do not attach any prior binary to migrated state."
    precondition: "The demo identity set, previous detached state, CHG-22-R1 commit, and EX5 checksums were captured by TS_DEPLOY_PHASE."
    success: "The demo identity has no running EA owner, no new broker mutation, exported evidence is complete, and the release attempt is TERMINATED."
  - forward: "DPL-CHG22-11 restricted-live promotion."
    step_id: "RBK-CHG22-07"
    rollback: "Disable the one named restricted-live identity within 60 seconds and return it to its recorded pre-promotion disabled/deployed state; use RBK-CHG22-05 before any older binary if a new snapshot committed."
    precondition: "The exact identity, prior approved bundle/checksums, pre-promotion broker state, and snapshot boundary are in the phase evidence."
    success: "The restricted identity is disabled or restored to the proven prior safe bundle/state, has zero unowned exposure, and the release attempt is TERMINATED."
  - forward: "DPL-CHG22-12 partial-cohort promotion."
    step_id: "RBK-CHG22-08"
    rollback: "Disable only the newly promoted cohort identity set and return each to its recorded pre-promotion state; retain the previously approved restricted-live identity unchanged unless it also hit a stop condition."
    precondition: "The cohort manifest lists every account-symbol-magic identity, prior bundle/checksums, owner, and broker state."
    success: "Every newly promoted cohort identity is disabled/restored and reconciled; the prior restricted-live terminal state is proven, and the release attempt is TERMINATED."
  - forward: "DPL-CHG22-13 full rollout."
    step_id: "RBK-CHG22-09"
    rollback: "Disable the identities added after the last approved partial-cohort boundary and restore their recorded pre-promotion state; preserve the last approved cohort unless evidence requires broader HALT_AND_EXPORT."
    precondition: "The full-rollout manifest and immediately prior approved cohort manifest pin identities, source commit, contract revision, EX5 checksums, owners, and broker state."
    success: "All newly added identities are disabled/restored, the prior cohort boundary is proven safe, and the release attempt is TERMINATED."
  - forward: "DPL-CHG22-08 two-chart demo ownership exercise."
    step_id: "RBK-CHG22-10"
    rollback: "Detach both demo charts, export both logs and marker values, and leave the demo identity with no EA owner."
    precondition: "Both chart IDs, identical canonical identity, source/EX5 checksums, and pre-test broker state are captured."
    success: "Neither chart owns the marker, no broker mutation occurred after stop, evidence is complete, and the test attempt is TERMINATED."

implementation_contracts:
  revision: "CHG-22-R1"
  compatibility_window: "Zero width: old and new source interfaces never coexist in one deployed bundle. The old binary is retired when the first CHG-22-R1 LifecycleSnapshot generation commits; after that point rollback requires RBK-CHG22-05."
  cutover_matrix:
    - contract: "IStateStore, IAlertSink, LifecycleSnapshot, PendingOrderEvidence"
      producer: "Include/Persistence/PersistenceTypes.mqh; Include/Persistence/StateStore.mqh; Include/Persistence/AlertSink.mqh"
      consumers: "PositionStateMachine; PositionContext; FakeStateStore; FakeAlertSink; Test_StateStore; Test_AlertSink; RunAllTests"
      required_revision: "CHG-22-R1"
    - contract: "IPositionView, ITradeTransactionEvidence, IAccountModeProvider, ITradeExecutor"
      producer: "Include/Position/Interfaces.mqh and three live providers"
      consumers: "IPLAN-04 state/context/router; IPLAN-02 coordinator; IPLAN-03 GuardedTrade; IPLAN-01 StrategyBase; all corresponding fakes/tests"
      required_revision: "CHG-22-R1"
    - contract: "Lease fencing and lifecycle reconciliation"
      producer: "CStateStore; CPositionStateMachine; CPositionContext"
      consumers: "CTradeTxRouter; IPLAN-03 final broker boundary; IPLAN-01 event assembly"
      required_revision: "CHG-22-R1"
  provided:
    contracts:
      - name: "Position lifecycle contract"
        type: "State Machine"
        files: ["Include/Position/PositionStateMachine.mqh", "Include/Position/TradeTxRouter.mqh"]
        summary: "Every lifecycle change commits one checked snapshot before memory mutation; startup/timer/hint reconciliation proves broker truth; HALT is absorbing until explicit recovery."
      - name: "Account mode adapter contract"
        type: "Protocol Interface"
        files: ["Include/Position/AccountModeAdapter.mqh", "Include/Position/HedgingAdapter.mqh", "Include/Position/NettingAdapter.mqh"]
        summary: "Hedging is executable; netting/exchange modes fail initialization and perform zero executor writes in v1."
      - name: "Position context contract"
        type: "Facade"
        files: ["Include/Position/PositionContext.mqh", "Include/Position/Interfaces.mqh", "Include/Position/PositionTypes.mqh"]
        summary: "Becomes ready only after account-mode, namespace, lease, router, and reconciliation checks; revalidates ownership before every mutation, disables routing on loss, and resumes only through Recover after a fresh claim and full reconciliation."
      - name: "Production evidence provider contract"
        type: "Read-only Adapter"
        files: ["Include/Position/LiveAccountModeProvider.mqh", "Include/Position/LiveBrokerPositionView.mqh", "Include/Position/LiveTradeTransactionEvidence.mqh"]
        summary: "Composes vendored information classes, invalidates stale selections, explicitly selects bounded history, and never instantiates CTrade."
      - name: "Position/account fixture contract"
        type: "Test Fixture"
        files: ["Scripts/Tests/Support/FakePositionView.mqh", "Scripts/Tests/Support/FakeStateStore.mqh", "Scripts/Tests/Support/FakeAlertSink.mqh"]
        summary: "Reusable fakes model broker positions, transaction evidence, guarded writes, state persistence, marker lease, and alert forwarding."
      - name: "Persistence extension contract"
        type: "Protocol Interface"
        files: ["Include/Persistence/MarkerLease.mqh", "Include/Persistence/StateStore.mqh", "Include/Persistence/PersistenceTypes.mqh", "Include/Persistence/AlertSink.mqh"]
        summary: "Provides commit-last LifecycleSnapshot persistence, detailed read results, retained HALT/recovery evidence, explicit runtime isolation, and extracted mutex/CAS/reread marker fencing."
  consumed:
    dependencies:
      - "@iplan: IPLAN-05"
      - "@iplan: IPLAN-11"

