  implementation:
    - "Write assertion-backed restart, transaction-hint, HALT, namespace, lease, snapshot, and live-provider tests."
    - "Implement one canonical reconciliation path shared by startup, timer maintenance, and transaction hints."
    - "Implement commit-last lifecycle snapshots, checked HALT evidence, marker bootstrap mutex, and ownership fencing in lockstep with IPLAN-05."
  validation:
    - "Parse every canonical YAML artifact and run cross-document traceability validation."
    - "Run focused scripts and RunAllTests inside MT5; record exact pass, fail, and skip counts."
    - "Compile every changed test and aggregate runner with manual MetaEditor F7; require fresh EX5 artifacts, 0 errors, and 0 warnings."
    - "Run the manual two-chart ownership interleaving and one demo account-symbol-magic canary for a full broker session."
    - "Rerun review-team; require no P0/P1, every lens >=80, and weighted score >=85."

acceptance_workflow:
  phases:
    - id: CANONICAL_CASCADE
      step_id: "DPL-CHG22-01"
      rollback_step_id: "N/A: validation-only; no runtime or state mutation"
      entry: "CHG-22 is In Review and affected canonical YAML/readable artifacts are identified."
      exit: "Canonical SPEC/TDD/IPLAN/CHG content agrees; no generated readable companion changes normative meaning."
      failure_next: REMEDIATE
    - id: STATIC_VALIDATION
      step_id: "DPL-CHG22-02"
      rollback_step_id: "N/A: validation-only; no runtime or state mutation"
      entry: "CANONICAL_CASCADE passed and the current worktree fingerprint is recorded."
      exit: "All canonical YAML parses with duplicate-key rejection; every affected trace/delivered path and quoted include resolves; git diff --check has zero findings."
      failure_next: REMEDIATE
    - id: MANUAL_F7
      step_id: "DPL-CHG22-03"
      rollback_step_id: "N/A: build evidence only; unapproved EX5 remains undeployed"
      entry: "STATIC_VALIDATION passed on the exact source to compile."
      exit: "Every changed focused script and RunAllTests has a fresh EX5 with 0 errors and 0 warnings; source and EX5 timestamps/checksums are captured."
      failure_next: REMEDIATE
    - id: MT5_TEST
      step_id: "DPL-CHG22-04"
      rollback_step_id: "N/A: isolated test execution; test cleanup owns temporary state"
      entry: "MANUAL_F7 passed and the fresh EX5 set is loaded in the intended terminal."
      exit: "All IPLAN-04 focused scripts and RunAllTests report exact counts satisfying cutover_thresholds.tests."
      failure_next: REMEDIATE
    - id: PRODUCER_CONTRACT
      step_id: "DPL-CHG22-05"
      rollback_step_id: "N/A: source integration gate; nothing is deployed"
      entry: "MT5_TEST passed and every CHG-22-R1 producer artifact is present in one source bundle."
      exit: "IPLAN-05 persistence producers and IPLAN-04 lifecycle/providers compile and pass their focused suites against CHG-22-R1; mixed contract generations are rejected."
      failure_next: REMEDIATE
    - id: COORDINATION_CONSUMER
      step_id: "DPL-CHG22-06"
      rollback_step_id: "N/A: source integration gate; nothing is deployed"
      entry: "PRODUCER_CONTRACT passed."
      exit: "IPLAN-02 coordination consumes the CHG-22-R1 position readiness and lifecycle contract with its declared tests passing."
      failure_next: REMEDIATE
    - id: PRODUCTION_ASSEMBLY_INTEGRATION
      step_id: "DPL-CHG22-07"
      rollback_step_id: "N/A: source integration gate; nothing is deployed"
      entry: "IPLAN-01 and IPLAN-03 manifests are DONE and COORDINATION_CONSUMER passed."
      exit: "StrategyBase/provider injection, CGuardedTrade final mutation fencing, broker-bypass scan, all focused producer/consumer suites, and RunAllTests pass together against CHG-22-R1."
      failure_next: REMEDIATE
    - id: TWO_CHART
      step_id: "DPL-CHG22-08"
      rollback_step_id: "RBK-CHG22-10"
      entry: "PRODUCTION_ASSEMBLY_INTEGRATION passed on a demo identity with no production exposure."
      exit: "The interleaving matrix proves exactly one successful current owner and zero stale-owner mutations."
      failure_next: HALT_AND_EXPORT
    - id: ROLLBACK_REHEARSAL
      step_id: "DPL-CHG22-09"
      rollback_step_id: "N/A: this phase executes and proves the rollback procedures"
      entry: "TWO_CHART passed; rollback source target and evidence-export location are accessible."
      exit: "Both applicable paths pass within the declared SLAs: same-revision restoration may reconcile flat or one unambiguously owned position, while the post-SPEC.05.06.7c3a downgrade separately proves flat/no-matching-order legacy-IDLE publication before any prior binary attaches."
      failure_next: HALT_AND_EXPORT
    - id: DEMO_CANARY
      step_id: "DPL-CHG22-10"
      rollback_step_id: "RBK-CHG22-06"
      entry: "ROLLBACK_REHEARSAL passed and one account-symbol-magic identity is approved for demo."
      exit: "One complete terminal-reported broker trading session satisfies every canary threshold with no stop condition."
      failure_next: ROLLBACK
    - id: RESTRICTED_LIVE
      step_id: "DPL-CHG22-11"
      rollback_step_id: "RBK-CHG22-07"
      entry: "DEMO_CANARY passed; the exact CHG-22-R1 source/EX5 bundle is pinned and one restricted live identity is approved."
      exit: "Restricted live session meets the demo thresholds and emits TS_DEPLOY_PHASE evidence for the pinned commit and EX5 checksums."
      failure_next: ROLLBACK
    - id: PARTIAL_COHORT
      step_id: "DPL-CHG22-12"
      rollback_step_id: "RBK-CHG22-08"
      entry: "RESTRICTED_LIVE passed and topology supports more than one identity; otherwise an explicit N/A decision is recorded."
      exit: "The approved partial identity cohort meets the same thresholds, or the documented single-identity topology makes this phase N/A."
      failure_next: ROLLBACK
    - id: FULL_ROLLOUT
      step_id: "DPL-CHG22-13"
      rollback_step_id: "RBK-CHG22-09"
      entry: "PARTIAL_COHORT passed or has an approved N/A decision."
      exit: "All approved identities run the exact pinned CHG-22-R1 bundle with no stop condition."
      failure_next: ROLLBACK
    - id: FINAL_REVIEW
      step_id: "DPL-CHG22-14"
      rollback_step_id: "N/A: review-only; no runtime or state mutation"
      entry: "All preceding evidence is attached to CHG-22."
      exit: "Review-team has no P0/P1, every lens is at least 80, weighted score is at least 85, and structural gates pass."
      failure_next: REMEDIATE
    - id: APPROVAL
      step_id: "DPL-CHG22-15"
      rollback_step_id: "N/A: governance decision; deployment already passed all rollback-capable phases"
      entry: "FINAL_REVIEW passed and GATE06/GATE08/GATECODE evidence is complete."
      exit: "Human approver records approval; only then may CHG-22 close."
      failure_next: HALT_AND_EXPORT
  transitions:
    - "CANONICAL_CASCADE -> STATIC_VALIDATION -> MANUAL_F7 -> MT5_TEST -> PRODUCER_CONTRACT -> COORDINATION_CONSUMER -> PRODUCTION_ASSEMBLY_INTEGRATION -> TWO_CHART -> ROLLBACK_REHEARSAL -> DEMO_CANARY -> RESTRICTED_LIVE -> PARTIAL_COHORT -> FULL_ROLLOUT -> FINAL_REVIEW -> APPROVAL."
    - "A static, compile, or assertion failure transitions only to REMEDIATE and restarts from CANONICAL_CASCADE."
    - "Ownership loss, contradictory snapshot, uncorrelated transition, or required evidence unavailability transitions to HALT_AND_EXPORT; no retry occurs before evidence export and root-cause remediation."
    - "A demo-canary stop condition transitions to ROLLBACK; disable the EA within 60 seconds and execute the paired rollback procedure."
  failure_states:
    - id: REMEDIATE
      entry: "A canonical, static, compile, test, integration, or review gate failed before a production mutation."
      action: "Preserve the failed evidence, correct source/docs/tests as one CHG-22-R1 bundle, and record a new worktree fingerprint."
      exit: "The defect is corrected and a new release attempt is explicitly opened."
      next: CANONICAL_CASCADE
    - id: HALT_AND_EXPORT
      entry: "Ownership loss, contradictory state, uncorrelated transition, provider/history unavailability, or rollback uncertainty occurred."
      action: "Disable the affected identity within 60 seconds, enter/retain HALT, and export lifecycle, marker, broker, log, source, and EX5 evidence without deletion."
      exit: "Evidence export is complete and the root cause has an approved remediation."
      next: REMEDIATE
    - id: ROLLBACK
      entry: "A state-mutating DPL phase hit a stop condition."
      action: "Execute only that phase's rollback_step_id, preserve evidence, and leave every affected identity in the rollback row's terminal state."
      exit: "The paired rollback success signal is proven or the flow escalates to HALT_AND_EXPORT."
      next: TERMINATED
    - id: TERMINATED
      entry: "A release attempt rolled back successfully."
      action: "Keep the attempted CHG-22 promotion closed; do not resume at an intermediate phase."
      exit: "A later attempt may begin only as a new fingerprinted run at CANONICAL_CASCADE."
      next: CANONICAL_CASCADE_NEW_ATTEMPT_ONLY

