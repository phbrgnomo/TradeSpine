acceptance_workflow:
  completion_boundary: "Apply @spec: SPEC-08 data_models.evidence_contract. IPLAN-04 closes only at the CHG-22 module boundary and does not authorize production readiness or deployment."
  closure_phase_ids: [CANONICAL_CASCADE, STATIC_VALIDATION, MANUAL_F7, MT5_TEST, MODULE_CONTRACT, FINAL_REVIEW, APPROVAL]
  deferred_release_obligations:
    - owner: "IPLAN-02"
      obligation: "Consume the pinned CHG-22-R1 readiness and lifecycle contract in coordinator tests."
    - owner: "IPLAN-01"
      obligation: "Assemble live providers, wire timer/transactions, package an attachable EA, and execute two-chart validation."
    - owner: "IPLAN-03"
      obligation: "Prove final broker-mutation fencing and zero broker-bypass findings."
    - owner: "Tier-10 documentation_closeout"
      obligation: "After IPLAN-01/02/03 complete, perform rollback rehearsal, demo canary, restricted live, staged rollout, and final release approval."
  phases:
    - id: CANONICAL_CASCADE
      step_id: "DPL-CHG22-01"
      rollback_step_id: "N/A: validation-only; no runtime or state mutation"
      entry: "CHG-22 is In Review and affected canonical YAML/readable artifacts are identified."
      exit: "Canonical SPEC/TDD/IPLAN/CHG content agrees; no generated readable companion changes normative meaning."
      failure_next: REMEDIATE
    - id: STATIC_VALIDATION
      step_id: "DPL-CHG22-02"
      rollback_step_id: "N/A: validation-only; no runtime or state mutation"
      entry: "CANONICAL_CASCADE passed and the current worktree fingerprint is recorded."
      exit: "All canonical YAML parses with duplicate-key rejection; every affected trace/delivered path and quoted include resolves; git diff --check has zero findings."
      failure_next: REMEDIATE
    - id: MANUAL_F7
      step_id: "DPL-CHG22-03"
      rollback_step_id: "N/A: build evidence only; unapproved EX5 remains undeployed"
      entry: "STATIC_VALIDATION passed on the exact source to compile."
      exit: "RunAllTests has a fresh EX5 with 0 errors and 0 warnings; the aggregate source includes every Test_*.mq5 file and all dependencies, and source/EX5 timestamps plus checksum are captured."
      failure_next: REMEDIATE
    - id: MT5_TEST
      step_id: "DPL-CHG22-04"
      rollback_step_id: "N/A: isolated test execution; test cleanup owns temporary state"
      entry: "MANUAL_F7 passed and the fresh EX5 set is loaded in the intended terminal."
      exit: "RunAllTests reports exact module and aggregate counts: IPLAN-04 has 0 failed/0 skipped, IPLAN-05 has 0 failed/0 skipped, and every aggregate skip is named and mapped outside those module suites."
      failure_next: REMEDIATE
    - id: MODULE_CONTRACT
      step_id: "DPL-CHG22-05"
      rollback_step_id: "N/A: source integration gate; nothing is deployed"
      entry: "MT5_TEST passed and every CHG-22-R1 producer artifact is present in one source bundle."
      exit: "IPLAN-05 persistence producers and IPLAN-04 lifecycle/providers compile in the aggregate translation unit and their complete actual Test_* case sets pass against CHG-22-R1; mixed contract generations are rejected."
      failure_next: REMEDIATE
    - id: COORDINATION_CONSUMER
      step_id: "DPL-CHG22-06"
      rollback_step_id: "N/A: source integration gate; nothing is deployed"
      entry: "MODULE_CONTRACT passed; this phase is a downstream release obligation owned by IPLAN-02 and is not part of CHG-22 module closure."
      exit: "IPLAN-02 coordination consumes the CHG-22-R1 position readiness and lifecycle contract with its declared tests passing."
      failure_next: REMEDIATE
    - id: PRODUCTION_ASSEMBLY_INTEGRATION
      step_id: "DPL-CHG22-07"
      rollback_step_id: "N/A: source integration gate; nothing is deployed"
      entry: "IPLAN-01 and IPLAN-03 manifests are DONE and COORDINATION_CONSUMER passed; this phase is a downstream release obligation, not part of CHG-22 module closure."
      exit: "StrategyBase/provider injection, CGuardedTrade final mutation fencing, broker-bypass scan, all focused producer/consumer suites, and RunAllTests pass together against CHG-22-R1."
      failure_next: REMEDIATE
    - id: FINAL_REVIEW
      step_id: "DPL-CHG22-14"
      rollback_step_id: "N/A: review-only; no runtime or state mutation"
      entry: "MODULE_CONTRACT passed and the module evidence bundle is attached to CHG-22; release-only phases are explicitly excluded."
      exit: "Review-team has no P0/P1, every lens is at least 80, weighted score is at least 85, and structural gates pass."
      failure_next: REMEDIATE
    - id: APPROVAL
      step_id: "DPL-CHG22-15"
      rollback_step_id: "N/A: governance decision; no deployment is authorized by this approval"
      entry: "FINAL_REVIEW passed and GATE06/GATE08/GATECODE evidence is complete."
      exit: "Human approvers record the required decisions; only then may IPLAN-04/IPLAN-05 and CHG-22 close at the module boundary."
      failure_next: REMEDIATE
  transitions:
    - "CHG-22 module closure: CANONICAL_CASCADE -> STATIC_VALIDATION -> aggregate MANUAL_F7 -> aggregate MT5_TEST -> MODULE_CONTRACT -> FINAL_REVIEW -> APPROVAL."
    - "Release-only sequencing, stop conditions, and executable rollback identifiers are owned by the final release-closeout artifact after IPLAN-01/02/03 complete; they are not states in this module-closure workflow."
    - "A static, compile, or assertion failure transitions only to REMEDIATE and restarts from CANONICAL_CASCADE."
    - "Ownership loss, contradictory snapshot, uncorrelated transition, or required evidence unavailability transitions to HALT_AND_EXPORT; no retry occurs before evidence export and root-cause remediation."
  failure_states:
    - id: REMEDIATE
      entry: "A canonical, static, compile, test, integration, or review gate failed before a production mutation."
      action: "Preserve the failed evidence, correct source/docs/tests as one CHG-22-R1 bundle, and record a new worktree fingerprint."
      exit: "The defect is corrected and a new release attempt is explicitly opened."
      next: CANONICAL_CASCADE
    - id: HALT_AND_EXPORT
      entry: "Ownership loss, contradictory state, uncorrelated transition, provider/history unavailability, or rollback uncertainty occurred."
      action: "Disable the affected identity within 60 seconds, enter/retain HALT, and export lifecycle, marker, broker, log, source, and EX5 evidence without deletion."
      exit: "Evidence export is complete and the root cause has an approved remediation."
      next: REMEDIATE

