rollback_strategy:
  summary: "IPLAN-04 spans Position, Persistence, tests, runtime state, and documentation. Execute the matching rollback_pairs row; any missing precondition keeps the EA disabled and CHG-22 open."
  steps:
    - "Within 60 seconds of a stop condition, disable the affected EA and preserve both lifecycle generations, commit key, legacy keys, HALT audit evidence, marker globals, terminal logs, provider observations, and source/EX5 checksums."
    - "Select the rollback_pairs row for every forward mutation and verify all listed preconditions before changing source or state."
    - "Restore source/doc/interface bundles only from pinned commit ac7fe244dec1aa2d5897da406bf6c817804c607d or the separately approved bundle recorded at GATECODE; never mix bundles."
    - "For a migrated snapshot, execute the rehearsed downgrade protocol only after flat/no-order proof and exclusive ownership; otherwise remain disabled and escalate."
    - "Complete source restore plus static and manual F7 verification within 15 minutes; missing the SLA keeps the EA disabled."
    - "Re-enable only after exactly one owner and canonical broker reconciliation prove a safe state."
  validation_after_rollback:
    - "Use manual MetaEditor F7 for restored tests and RunAllTests; require fresh EX5 files, 0 errors, and 0 warnings."
    - "python3 -c \"import yaml, pathlib; [yaml.safe_load(p.read_text()) for p in pathlib.Path('docs').glob('**/*.yaml')]; print('yaml ok')\""
    - "git diff --check"

