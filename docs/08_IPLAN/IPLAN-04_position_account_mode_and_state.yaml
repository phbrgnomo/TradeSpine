    - name: "MetaEditor errors"
      threshold: "0 for the aggregate RunAllTests translation unit"
      window_minutes: 0
      action_on_breach: "Retain In Progress/In Review and request corrected evidence"
    - name: "MetaEditor warnings"
      threshold: "0 for the aggregate RunAllTests translation unit"
      window_minutes: 0
      action_on_breach: "Retain In Progress/In Review and request corrected evidence"
    - name: "IPLAN-04/05 module failures and skips"
      threshold: "0 failed and 0 skipped in each RunAllTests module section"
      window_minutes: 0
      action_on_breach: "Retain all false verification flags"
    - name: "Aggregate MT5 failures"
      threshold: "0 failed; skips only when named and mapped to pending TDD cases"
      window_minutes: 0
      action_on_breach: "Retain all false verification flags"
    - name: "Review-team acceptance"
      threshold: "quorum met, each lens >=80, weighted score >=85, no P0/P1"
