      pass_criterion: "RunAllTests produces a fresh EX5 with 0 errors and 0 warnings; static inspection proves exact inclusion of every Test_*.mq5 source and dependency; source/EX5 timestamps and SHA-256 are recorded."
      timeout_seconds: 900
    - name: "Aggregate MT5 module tests"
      runs_after: "MANUAL_F7"
      pass_criterion: "RunAllTests reaches every actual Test_* case and reports IPLAN-04 137/137 and IPLAN-05 243/243, each with 0 failed and 0 skipped."
      timeout_seconds: 900
    - name: "Aggregate skip reconciliation"
      runs_after: "Aggregate MT5 module tests"
      pass_criterion: "RunAllTests reports 694/694 passed and 0 failed; all 11 skips are named, mapped, and outside IPLAN-04/05."
      timeout_seconds: 1800
    - name: "Fresh review-team gate"
      runs_after: "MODULE_CONTRACT"
      pass_criterion: "No unresolved P0/P1, every required lens score is at least 80, weighted score is at least 85, and coverage quorum is met."
      timeout_seconds: 1800

