test_cases:
  unit_tests:
    cases:
      - id: "TDD.04.04.8b79"
        type: unit
        name: "State machine handles pending entry, timeout cancel, HALT, restart, and manual close"
        spec_ref: "@spec: SPEC-04"
        target: "CPositionStateMachine"
        test_file: "Scripts/Tests/Test_PositionStateMachine.mq5"
        test_function: "test_position_account_mode_and_state_unit_contract"
        inputs:
          - name: fixture
            type: string
            value: "pending_entry ticket+submitted_ts, fill_timeout_secs=5, fake executor, fake alert/store"
        expected_output:
          type: contract-result
          value: "Complete snapshots persist pending/cancel evidence before broker mutation; startup/timer/hint reconciliation repairs proven drift; ambiguous evidence and persistence failure enter absorbing HALT."
        edge_cases:
          - condition: "Context Recover is requested while HALT is active"
            expected: "A lost lease is freshly claimed; readiness resumes only after full reconciliation proves flat state without matching live orders/positions or one unambiguously owned position."
          - condition: "Cancel-submit failure"
            expected: "HALT payload includes pending ticket and exactly one alert-sink persistence path."
          - condition: "Restart in PENDING_ENTRY"
            expected: "Pending order ticket and submitted timestamp survive and recompute deadline."
          - condition: "Restart in PENDING_CANCEL"
            expected: "Pending order evidence survives and maintenance does not submit a duplicate cancel."
          - condition: "Historical canceled/rejected order is no longer active"
            expected: "Router uses history-order symbol, magic, and state to clear the pending entry."
          - condition: "Unrelated, replayed, zero-ID, out-of-order, missing-history, mismatched, or partial-exit hint"
            expected: "Hint is an idempotent no-op unless exact evidence requests reconciliation; residual position volume preserves ACTIVE."
          - condition: "HALT normal transition or implicit recovery"
            expected: "Transition is rejected; only explicit full reconciliation may clear HALT."
  integration_tests:
    cases:
      - id: "TDD.04.04.95db"
        type: integration
        name: "Hedging adapter filters owned tickets by identity"
        spec_ref: "@spec: SPEC-04"
        contract: "CPositionContext with fake broker positions"
        test_file: "Scripts/Tests/Test_AccountModeAdapters.mq5"
        test_function: "test_position_account_mode_and_state_integration_contract"
        setup:
          - "Assemble component with deterministic fakes for broker, clock, store, symbol, and logs where required."
          - "Load SPEC-defined configuration and BDD trace tags."
        action:
          description: "Load mixed symbols, magics, and manual tickets"
        expected_state:
          - "Only matching account-symbol-magic tickets are returned and closable"
        error_paths:
          - condition: "Netting and exchange modes fail init before adapter trading"
            expected_error: "SPEC-defined rejection or HALT path."
          - condition: "Unowned ticket close/modify attempt"
            expected_error: "Adapter rejects without executor calls."
          - condition: "Trailing stop candidate loosens risk"
            expected_error: "Adapter returns false and does not call ModifyTicket."
  e2e_tests:
    cases:
      - id: "TDD.04.04.8180"
        type: e2e
        name: "Account mode ownership remains strategy scoped"
        bdd_ref: "@bdd: BDD.01.03.8180"
        spec_ref: "@spec: SPEC-04"
        test_file: "Scripts/Tests/Test_AccountModeDeferred.mq5"
        test_function: "test_position_account_mode_and_state_8180_e2e"
        workflow:
          - step: 1
            action: "Exercise RETAIL_NETTING and EXCHANGE initialization"
            expected: "Both modes fail before lease publication and state-changing broker calls."
          - step: 2
            action: "Exercise hedging initialization with mixed symbol and magic tickets"
            expected: "Initialization succeeds and exposes only the strategy-owned ticket with readiness evidence."
        expected_result: "All assertion-backed account-mode and strategy-ownership checks pass."
        timeout_seconds: 300
        cleanup: "Clear fake broker state, fake stores, and generated evidence."
      - id: "TDD.04.04.b7d2"
        type: e2e
        name: "Account modes preserve ownership under parameterization"
        bdd_ref: "@bdd: BDD.01.03.f11f"
        spec_ref: "@spec: SPEC-04"
        test_file: "Scripts/Tests/Test_AccountModeDeferred.mq5"
        test_function: "test_position_account_mode_and_state_e2e_acceptance"
        workflow:
          - step: 1
            action: "Run hedging ownership case"
            expected: "Hedging produces owned-ticket evidence"
          - step: 2
            action: "Run RETAIL_NETTING deferred init case"
            expected: "Deferred modes fail init with no trade path side effects"
          - step: 3
            action: "Run EXCHANGE deferred init case"
            expected: "Release evidence records all mode outcomes"
          - step: 4
            action: "Run marker lease maintenance case"
            expected: "Init claims marker; OnTick performs no heartbeat; OnMaintenance writes heartbeat only after 30 seconds; OnDeinit releases marker"
          - step: 5
            action: "Run optimization and nonvisual tester initialization cases"
            expected: "An isolated runtime namespace is mandatory; no live lease claim or live HALT mutation occurs"
          - step: 6
            action: "Run external SL/TP repair cases"
            expected: "Owned hedging-ticket drift delegates one ModifyTicket call through ITradeExecutor; invalid topology enters HALT with ticket evidence and no modify call"
          - step: 7
            action: "Lose the live marker lease, invoke CPositionContext.Recover, and provide unambiguous flat broker evidence"
            expected: "The context performs a fresh claim, full reconciliation, clears durable HALT last, and becomes ready; ordinary maintenance never performs this recovery"
        timeout_seconds: 300
        cleanup: "Clear fake broker state, fake stores, generated evidence files, and chart objects under the strategy prefix."
      - id: "TDD.04.04.c6e1"
        type: e2e
        name: "Live read-only provider parity"
        bdd_ref: "@bdd: BDD.01.03.f11f"
        spec_ref: "@spec: SPEC-04"
        test_file: "Scripts/Tests/Test_PositionLiveProviders.mq5"
        test_function: "test_position_live_providers_contract"
        workflow:
          - step: 1
            action: "Compare CLiveAccountModeProvider with AccountInfoInteger(ACCOUNT_MARGIN_MODE)"
            expected: "Provider mode equals the current native terminal value"
          - step: 2
            action: "Compare live position, order, deal, and explicitly bounded-history selections with their native terminal APIs"
            expected: "Every selected value matches; selection failure invalidates cached evidence and returns safe empty values"
          - step: 3
            action: "Scan the provider implementation boundary for trade submission capability"
            expected: "No CTrade instance or state-changing trade request exists"
        timeout_seconds: 300
        cleanup: "Clear only test-owned observations; do not submit or cancel broker operations."
  security_tests:
    cases: []

