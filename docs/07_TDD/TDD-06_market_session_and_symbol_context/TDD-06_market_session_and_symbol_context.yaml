test_cases:
  unit_tests:
    cases:
      - id: "TDD.06.04.8f4d"
        type: unit
        name: "Symbol context rejects missing required metadata"
        spec_ref: "@spec: SPEC-06"
        target: "CSymbolContext.InitFromMetadata"
        test_file: "Scripts/Tests/Test_SymbolContext.mq5"
        test_function: "test_market_session_and_symbol_context_unit_contract"
        inputs:
          - name: fixture
            type: string
            value: "tick_size=0, tick_value=1, contract_size=1, freeze_level=0, lot_step=1, trade_mode=enabled"
        expected_output:
          type: contract-result
          value: "INIT_FAILED with missing metadata reason"
        edge_cases:
          - condition: "Valid synthetic B3-style metadata includes tick value, contract size, and freeze level"
            expected: "Case remains deterministic and broker-safe."
          - condition: "contract_size is zero, negative, NaN, or infinite; freeze_level is negative"
            expected: "InitFromMetadata rejects the fixture explicitly without fallback."
          - condition: "A valid fixture is followed by an invalid fixture re-initialization"
            expected: "The context becomes uninitialized and does not expose the prior valid tick_size."
  integration_tests:
    cases:
      - id: "TDD.06.04.a1e6"
        type: integration
        name: "Production symbol metadata initializes through vendored CSymbolInfo"
        spec_ref: "@spec: SPEC-06"
        contract: "CSymbolContext production initialization against an approved B3 broker symbol"
        test_file: "Scripts/Tests/Test_SymbolContextLive.mq5"
        test_function: "Test_SymbolContextLive_ProductionInit"
        setup:
          - "Attach the script to an approved B3 symbol chart or set InpSymbol to that broker symbol."
          - "Do not include this broker-dependent smoke script in RunAllTests."
        action:
          description: "Call CSymbolContext::Init through vendored CSymbolInfo and print the resulting snapshot."
        expected_state:
          - "Initialization succeeds and every required positive or non-negative metadata field validates."
          - "The [LIVE] diagnostic prints symbol, tick, contract, lot, stop/freeze, and trade-mode values."
        error_paths:
          - condition: "The selected broker does not expose a property required by CSymbolInfo::Name/Refresh or SymbolMetadata validation."
            expected_error: "Initialization fails with a field-level terminal diagnostic; release/gate evidence remains blocked."
        notes:
          - "This is Tier-1.5 manual integration evidence; it is intentionally not a deterministic aggregate test."
      - id: "TDD.06.04.4796"
        type: integration
        name: "Session context exposes broker schedule state while order validation enforces direction"
        spec_ref: "@spec: SPEC-06"
        contract: "CMarketContext session facade with fake clock and market-session provider"
        test_file: "Scripts/Tests/Test_ContractLifecycle.mq5"
        test_function: "Test_MarketContext_SessionGate"
        setup:
          - "Assemble component with deterministic fakes for broker, clock, store, symbol, and logs where required."
          - "Load SPEC-defined configuration and BDD trace tags."
        action:
          description: "Broker session open with user trading hours closed; separately, broker session open with SYMBOL_TRADE_MODE_DISABLED"
        expected_state:
          - "market_open reflects broker session schedule membership only."
          - "user_trading_hours_open independently blocks entry outside the configured window."
          - "A disabled or side-restricted symbol remains subject to ValidateOrderDefinition for the concrete BUY or SELL intent."
          - "A default-constructed TradeIntent exposes invalid order_type sentinel -1 and ValidateOrderDefinition rejects it with an explicit invalid-order-type reason before trade-mode or numeric validation."
        error_paths:
          - condition: "Close buffer sets day_trade_close_required"
            expected_error: "SPEC-defined rejection or HALT path."
        notes:
          - "TradeIntent fixtures resolve to the canonical type in Include/Core/TradeTypes.mqh; the missing-side regression proves its invalid default sentinel and explicit validation rejection (@chg: CHG-21, @chg: CHG-26)."
          - "MarketSessionEndTod regular-session-end (index-0) selection is a thin live-adapter behavior verified manually on the live/demo B3 feed; FakeMarketSessionProvider returns a single configured end-tod, so the close-reference cases here remain valid and after-hours exclusion is not fake-exercised (@chg: CHG-21)."
  e2e_tests:
    cases: []
  security_tests:
    cases: []

