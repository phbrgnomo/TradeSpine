test_cases:
  unit_tests:
    cases:
      - id: "TDD.07.04.a6d8"
        type: unit
        name: "Indicator wrapper reports not-ready before buffer data exists"
        spec_ref: "@spec: SPEC-07"
        target: "CIndicatorBase.IsReady through IIndicatorRuntime; concrete adapter CreateHandle(symbol,timeframe)"
        test_file: "Scripts/Tests/Test_Indicators.mq5"
        test_function: "test_indicators_stops_sizing_trailing_c0f6_unit"
        inputs:
          - name: fixture
            type: string
            value: "handle valid, bars_calculated=0, buffer read unavailable"
        expected_output:
          type: contract-result
          value: "ready=false; no broker or strategy mutation occurs"
        edge_cases:
          - condition: "Handle creation failure returns InitFailed"
            expected: "Case remains deterministic and broker-safe."
      - id: "TDD.07.04.8d11"
        type: unit
        name: "Stop and trailing proposals remain topology-valid and broker-pure"
        spec_ref: "@spec: SPEC-07"
        target: "IStopPolicy.ComputeStops and ITrailingStop.ProposeNewSL"
        test_file: "Scripts/Tests/Test_StopsAndTrailing.mq5"
        test_function: "test_indicators_stops_sizing_trailing_stops_trailing_unit"
        inputs:
          - name: request
            type: "StopRequest or TrailingRequest"
            value: "BUY/SELL StopRequest and POSITION_TYPE_BUY/POSITION_TYPE_SELL TrailingRequest with current SL/TP supplied by a deterministic fixture"
        expected_output:
          type: contract-result
          value: "invalid stops use sl_distance=0; non-tightening proposals return 0; no broker mutation occurs"
  integration_tests:
    cases:
      - id: "TDD.07.04.12de"
        type: integration
        name: "Futures sizing uses symbol grid and stop distance"
        spec_ref: "@spec: SPEC-07"
        contract: "IPositionSizer with fake CSymbolContext and IAccountValueProvider"
        test_file: "Scripts/Tests/Test_Sizers.mq5"
        test_function: "test_indicators_stops_sizing_trailing_e593_integration"
        setup:
          - "Assemble component with deterministic symbol and account-value fakes; no broker mutation seam is present."
          - "Load SPEC-defined configuration and BDD trace tags."
        action:
          description: "Risk fixture: equity=100000, risk_percent=1.0, ORDER_TYPE_BUY, entry_price=100000, sl_price=99500, tick_size=5, tick_value=1, lot_step=1, lot_min=1, lot_max=900."
        expected_state:
          - "risk_money=1000, loss_per_lot=100, raw_lots=10, and normalized lots=10."
          - "A result below lot_min, a non-finite input, or invalid metadata returns 0 without broker mutation."
        error_paths:
          - condition: "Equity placeholder selection returns visible rejection"
            expected_error: "SPEC-defined rejection or HALT path."
      - id: "TDD.07.04.cb03"
        type: integration
        name: "Equity sizing placeholder remains visibly non-executable"
        spec_ref: "@spec: SPEC-07"
        bdd_ref: "@bdd: BDD.01.03.cb03"
        contract: "IPositionSizer equity placeholder"
        test_file: "Scripts/Tests/Test_Sizers.mq5"
        test_function: "test_indicators_stops_sizing_trailing_cb03_integration"
        setup:
          - "Assemble the selected v1 equity placeholder with deterministic market metadata and account-value fakes."
        action:
          description: "Request lots through the equity sizing placeholder."
        expected_state:
          - "The placeholder returns its visible rejection and does not submit or mutate broker state."
        error_paths:
          - condition: "The placeholder is selected as if it were futures risk sizing"
            expected_error: "Reject without fallback to another sizing mode."
  e2e_tests:
    cases: []
  security_tests:
    cases: []

