test_cases:
  unit_tests:
    cases:
      - id: "TDD.11.04.6805"
        type: unit
        name: "Shared clock and assertion helpers behave deterministically"
        spec_ref: "@spec: SPEC-11"
        target: "FakeClock/CAssert"
        test_file: "Scripts/Tests/Test_TestSupportClock.mq5"
        test_function: "test_testing_support_and_harnesses_unit_contract"
        inputs:
          - name: fixture
            type: string
            value: "time_sequence=[t0,t1,t2]"
        expected_output:
          type: contract-result
          value: "Clock advances in configured order; negative Advance() is rejected; assertions report deterministic pass/fail/skip counts including Snapshot/Restore round-trip across all four fields"
        edge_cases:
          - condition: "Negative seconds passed to Advance()"
            expected: "FakeClock rejects the call and Now() remains unchanged."
  integration_tests:
    cases:
      - id: "TDD.11.04.aadd"
        type: integration
        name: "ScenarioHarness assembles fakes and evidence assertions"
        spec_ref: "@spec: SPEC-11"
        contract: "ScenarioHarness"
        test_file: "Scripts/Tests/Test_TestSupportScenarioHarness.mq5"
        test_function: "test_testing_support_and_harnesses_integration_contract"
        setup:
          - "Assemble component with deterministic shared fakes for clock, logs, runtime, and owner-extension hooks where required."
          - "Load SPEC-defined configuration and BDD trace tags."
        action:
          description: "Component plus FakeClock, FakeLogSink, CAssert, minimal ScenarioHarness, and deferred owner-extension slots"
        expected_state:
          - "Stimulus runs with deterministic time and evidence assertions fail on missing required traces"
        error_paths:
          - condition: "Owner extension slot is missing for a scenario that requires broker, position, symbol, or store behavior"
            expected_error: "Owner hooks (OnOwnerSetup/OnOwnerTeardown) are callable without crash; owner-specific assertions are deferred to the downstream IPLAN."
      - id: "TDD.11.04.c14e"
        type: integration
        name: "Live-test coverage assessment is complete and evidence-separated"
        spec_ref: "@spec: SPEC-11"
        change_ref: "@chg: CHG-26"
        contract: "LiveTestAssessmentContract"
        test_file: "Docs/ASSESSMENTS/LIVE_TEST_COVERAGE_MATRIX.yaml"
        assessment_artifacts:
          - "Docs/ASSESSMENTS/LIVE_TEST_COVERAGE_MATRIX.yaml"
          - "Docs/ASSESSMENTS/LIVE_TEST_ARCHITECTURE_REVIEW.md"
        test_function: "review_live_test_assessment_contract"
        setup:
          - "Load the final implemented code inventory, test inventory, module evidence, and Scripts/Tests/Test_SymbolContextLive.mq5 as an example input."
          - "Enumerate implemented behavior boundaries and terminal-coupled dependencies."
        action:
          description: "Build the coverage matrix before the architecture review or refactor decision."
        expected_state:
          - "Every implemented behavior boundary records a non-empty coverage_record_id unique within the complete assessment, plus module, production paths, terminal dependencies and level, mutation class, existing evidence, evidence gap, live-test need, safe environment, owner, proposed tier, and rationale."
          - "Automated, Strategy Tester, demo/live, and manual evidence remain distinct."
          - "The architecture review records the complete assessment finding inventory; every finding has a unique stable finding_id, every coverage_record_refs value resolves to exactly one coverage_record_id, and evidence references are recorded."
        error_paths:
          - condition: "A boundary is missing, evidence types are conflated, a coverage_record_id is missing or duplicated, a coverage_record_refs value does not resolve exactly once, a finding_id is missing or duplicated, or a mutation-capable test targets an unrestricted production account."
            expected_error: "Block assessment completion and documentation closeout."
  e2e_tests:
    cases:
      - id: "TDD.11.04.4f72"
        type: e2e
        name: "Deferred account-mode evidence stays manual where required"
        bdd_ref: "@bdd: BDD.01.03.f415"
        spec_ref: "@spec: SPEC-11"
        test_file: "Scripts/Tests/Test_ReleaseEvidenceHarness.mq5"
        test_function: "test_testing_support_and_harnesses_e2e_acceptance"
        workflow:
          - step: 1
            action: "Run harness for netting deferred init failure"
            expected: "Automated Strategy Tester evidence is not substituted for manual pack"
          - step: 2
            action: "Attach manual evidence pack reference"
            expected: "Missing pack blocks release gate"
          - step: 3
            action: "Run release evidence validation"
            expected: "No trade-path side effects are recorded"
        timeout_seconds: 300
        cleanup: "Clear shared fake state, generated evidence files, and chart objects under the strategy prefix."
      - id: "TDD.11.04.d14e"
        type: e2e
        name: "Live-test findings block closeout until exclusively dispositioned"
        spec_ref: "@spec: SPEC-11"
        change_ref: "@chg: CHG-26"
        test_file: "Docs/ASSESSMENTS/LIVE_TEST_REFACTOR_DECISION.md"
        input_artifacts:
          - "Docs/ASSESSMENTS/LIVE_TEST_COVERAGE_MATRIX.yaml"
          - "Docs/ASSESSMENTS/LIVE_TEST_ARCHITECTURE_REVIEW.md"
        test_function: "review_live_test_closeout_disposition_gate"
        workflow:
          - step: 1
            action: "Review the complete coverage matrix and architecture assessment."
            expected: "The decision selects NO_REFACTOR, TARGETED_REFACTOR, or SHARED_ARCHITECTURE_REFACTOR with affected contracts, risks, migration order, and follow-on artifacts."
          - step: 2
            action: "Assign one terminal disposition to every finding."
            expected: "The complete assessed finding_id set equals the disposition.finding_id set one-to-one, with no missing, extra, or duplicate IDs; each matched finding is IMPLEMENTED, DEFERRED_WITH_RATIONALE, or REJECTED_WITH_EVIDENCE; IMPLEMENTED has completed follow-on evidence, every deferral records owner, rationale, risk acceptance, and revisit trigger, and every rejection records evidence that implementation or deferral is not required."
          - step: 3
            action: "Evaluate the documentation closeout gate."
            expected: "Closeout remains blocked when the assessed and disposition finding ID inventories differ or any matched finding lacks a valid disposition."
        timeout_seconds: 300
        cleanup: "Preserve the reviewed assessment artifacts as release-governance evidence."

owner_extension_scope:
  deferred_to_owner_plans:
    - owner: "IPLAN-03"
      scope: "FakeTradePort, GuardResult, TradeIntent, broker outcome scripts, pending/ambiguous execution assertions."
    - owner: "IPLAN-04"
      scope: "Position/account context fakes, IPositionView-backed harness adapters, hedging ownership assertions."
    - owner: "IPLAN-05"
      scope: "State-store and persistence/evidence fakes, write/read failure injection, audit ledger assertions."
    - owner: "IPLAN-06"
      scope: "FakeMarketContext/FakeSymbolContext surfaces for symbol metadata, broker-session open/end state, contract expiration, sizing/stops metadata consumers, and session gates; spread, fill-mode, margin, broker retcode, and private CTrade outcome fixtures remain IPLAN-03-owned."
  security_tests:
    cases: []

thresholds:
  unit:
    coverage_target: ">=90%"
    pass_criteria:
      - "All declared unit cases pass."
      - "No broker API calls occur from unit tests."
    fail_action: "Block IPLAN Green phase."
  integration:
    coverage_target: ">=85%"
    pass_criteria:
      - "All declared integration contracts pass."
      - "Fake-boundary assertions prove the expected side effects."
    fail_action: "Block IPLAN Green phase."
  e2e:
    coverage_target: ">=75% of mapped happy paths"
    timeout_budget: "<=300s"
    pass_criteria:
      - "Critical BDD workflow passes."
      - "Required evidence artifacts are present."
    fail_action: "Block release-candidate gate."
  security:
    coverage_target: "Not mandated by parent SPEC."
    pass_criteria:
      - "No security cases are required for this component."
    fail_action: "Add cases if a later ADR or SPEC mandates security coverage."

tdd_order:
  phases:
    - phase: 1
      name: "Write Tests"
      action: "Create the test files declared in test_mapping and test_cases before implementation files."
      output: "Pending MQL5 test scripts and support includes."
    - phase: 2
      name: "Run Tests (Red)"
      action: "Run Tier-1 scripts or harness checks and confirm failure against missing implementation."
      output: "Red failure report linked to this TDD."
    - phase: 3
      name: "Implement"
      action: "Implement the smallest component code needed for the failing cases."
      output: "TradeSpine source files for the parent SPEC."
    - phase: 4
      name: "Verify (Green)"
      action: "Run the declared tests and confirm the expected pass criteria."
      output: "Green test report and evidence pack."
    - phase: 5
      name: "Refactor"
      action: "Clean implementation without changing the test-observed behavior."
      output: "Refactored source with tests still green."

