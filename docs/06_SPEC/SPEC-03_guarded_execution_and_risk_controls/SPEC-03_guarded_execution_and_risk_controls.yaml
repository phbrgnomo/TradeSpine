## Section 2: Component Overview
component_overview:
  description: "Guarded execution is the broker boundary component that validates framework-mediated TradeIntent objects for internal consistency, applies per-order catastrophic guards, performs broker preflight checks, and submits through a private vendored CTrade instance. Runtime account/strategy risk controls are a separate CRiskManager module that evaluates daily loss, open lots, trade count, and panic-stop state before entries and emergency closes."
  architecture_decision: "@adr: ADR.04.03.7277"
  diagram:
    tags: ["@diagram: c4-l3", "@diagram: dfd-l3"]
    mermaid: |
      flowchart LR
        Coord["CTradeCoordinator"] --> Port["ITradePort"]
        Port --> Guard["CGuardedTrade"]
        Risk["CRiskManager"] --> Coord["CTradeCoordinator"]
        Risk --> Guard
        Market["Market/Symbol Context"] --> Guard
        Guard --> Vendored["Private vendored CTrade"]
        Guard --> Result["GuardResult"]
  language: "MQL5"
  dependencies:
    - name: "Vendored CTrade"
      version: "frozen StdLib VERSION.md"
      purpose: "Executes only after all guard stages pass."
    - name: "CSymbolContext"
      version: "v1"
      purpose: "Provides lot, price, stop, fill-mode, and market metadata."
    - name: "CAccountContext"
      version: "v1"
      purpose: "Provides account state for margin and mode diagnostics."

## Section 3: Interfaces
interfaces:
  exports:
    - name: "ITradePort"
      type: "interface"
      signature: "interface ITradePort : public ITradeExecutor { GuardResult Submit(const TradeIntent &intent); }"
      description: "Deferred v1 submission seam; IPLAN-03 will derive ITradePort from the Position-owned ITradeExecutor contract so a future CGuardedTrade can expose submit/close/modify/cancel through one parent interface. The TradeIntent argument is canonical from Include/Core/TradeTypes.mqh (@chg: CHG-21, CHG-23)."
      errors:
        - "Deferred: GuardResult and submission behavior are not implemented until IPLAN-03."
    - name: "ITradeExecutor"
      type: "interface"
      signature: "interface ITradeExecutor { bool CloseTicket(ulong ticket, double lots); bool ModifyTicket(ulong ticket, double sl, double tp); bool CancelOrder(ulong order_ticket); }"
      description: "Implemented close/modify/cancel seam consumed by the Position layer. IPLAN-04 declares and fake-tests this interface; the IPLAN-03 guarded implementation remains deferred (@chg: CHG-22)."
      errors:
        - "false: close, modify, or cancel rejected by guard, broker, or ownership policy."
    - name: "CGuardedTrade"
      type: "class"
      signature: "class CGuardedTrade : public ITradePort"
      description: "Deferred v1 class; IPLAN-03 will validate and submit TradeIntent through a private vendored CTrade and implement the ITradeExecutor operations through ITradePort. No production implementation exists yet."
      errors:
        - "Deferred: no GuardResult or CGuardedTrade implementation exists until IPLAN-03."
    - name: "CRiskManager"
      type: "class"
      signature: "class CRiskManager"
      description: "Tracks strategy-scoped daily loss, open lots, trade count, and panic-stop state independently from per-order guarded execution."
      errors:
        - "RiskTrip: new entries are refused and strategy-scoped close behavior is requested."
    - name: "FillingPolicy"
      type: "class"
      signature: "class FillingPolicy"
      description: "Selects and validates broker-supported fill mode from initialized symbol metadata before submission."
      errors:
        - "UnsupportedFill: no allowed filling mode is compatible with the requested order."
    - name: "SpreadGuard"
      type: "class"
      signature: "class SpreadGuard"
      description: "Applies symbol-aware spread and price-grid checks before broker handoff."
      errors:
        - "SpreadBlocked: current market spread exceeds configured strategy guard."
    - name: "GuardResult"
      type: "struct"
      signature: "struct GuardResult"
      description: "Deferred v1 submission outcome that IPLAN-03 will return to the coordinator."
      errors:
        - "None; contains status and reason fields."

## Section 4: Data Models
data_models:
  models:
    - name: "GuardResult"
      type: "struct"
      description: "Deferred v1 model; its fields define the planned IPLAN-03 submission outcome contract and are not currently implemented."
      fields:
        - name: "status"
          type: "ENUM_GUARD_STATUS"
          required: true
          description: "Accepted, rejected, pending, filled, partial, or halted."
        - name: "retcode"
          type: "uint"
          required: false
          description: "Broker retcode when a broker boundary was reached."
        - name: "ordercheck_retcode"
          type: "uint"
          required: false
          description: "OrderCheck retcode captured before broker submission when preflight reaches the terminal."
        - name: "reason"
          type: "string"
          required: true
          description: "Operator-facing rejection or outcome reason."
        - name: "ticket"
          type: "ulong"
          required: false
          description: "Broker order, deal, or position ticket when available."
        - name: "submitted_lots"
          type: "double"
          required: false
          description: "Lots sent to broker after guard normalization."
        - name: "submitted_price"
          type: "double"
          required: false
          description: "Price submitted to broker after price-grid normalization."
        - name: "filled_lots"
          type: "double"
          required: false
          description: "Actual lots filled by broker; 0.0 until confirmed; differs from submitted_lots on TRADE_RETCODE_DONE_PARTIAL."
        - name: "retryable"
          type: "bool"
          required: true
          description: "Whether the failure is eligible for a bounded retry policy."
        - name: "ambiguous"
          type: "bool"
          required: true
          description: "Whether state reconciliation must HALT rather than infer the outcome."
    - name: "RiskControlState"
      type: "struct"
      fields:
        - name: "daily_loss_trip"
          type: "bool"
          required: true
          description: "Whether the strategy-scoped daily loss control is tripped."
        - name: "max_open_lots_trip"
          type: "bool"
          required: true
          description: "Whether open lots exceed configured strategy control."
        - name: "max_trades_per_day_trip"
          type: "bool"
          required: true
          description: "Whether strategy trade count exceeded the configured daily limit."
        - name: "panic_stop"
          type: "bool"
          required: true
          description: "Runtime panic flag for this strategy instance."

## Section 5: Behavior
behavior:
  validation_rules:
    - rule: "Framework-mediated catastrophic safety violations SHALL be rejected before broker handoff."
      source: "@ears: EARS.01.03.222f"
    - rule: "Daily loss, max open lots, max trades per day, and panic trips SHALL refuse new entries and trigger strategy-scoped close behavior."
      source: "@ears: EARS.01.03.375b"
    - rule: "CRiskManager SHALL own daily-loss, max-open-lots, max-trades-per-day, and panic-stop evaluation; the deferred IPLAN-03 CGuardedTrade SHALL own per-order TradeIntent consistency, catastrophic caps, broker preflight, and private CTrade submission when implemented."
      source: "@prd: PRD.01.09.d74e"
    - rule: "The deferred IPLAN-03 CGuardedTrade SHALL reject internally inconsistent order definitions before broker handoff, including non-positive lots, invalid entry price, side-inverted stops, zero risk distance, and off-grid lots or prices when implemented."
      source: "@ears: EARS.01.03.ec72"
    - rule: "Panic stop SHALL close only the strategy instance's virtual position or tickets."
      source: "@ears: EARS.01.03.f562"
    - rule: "Filling mode, lot grid, price grid, stop distance, spread, margin, and OrderCheck SHALL all pass before private CTrade submission."
      source: "@ears: EARS.01.03.ec72"
    - rule: "Unknown broker retcodes or unresolved retry outcomes SHALL be treated as failsafe ambiguity, not as success."
      source: "@ears: EARS.01.03.588b"
    - rule: "IPLAN-03 SHALL implement the deferred ITradePort as a single interface derived from ITradeExecutor and CGuardedTrade as its only parent, satisfying MQL5 single inheritance while implementing the Position close/modify/cancel seam used by adapters and timeout-cancel handling (@chg: CHG-22, CHG-23)."
      source: "@chg: CHG-22"
  state_transitions:
    - from: "RiskControlState clear"
      to: "RiskControlState tripped"
      trigger: "Runtime risk control trips."
      source: "@bdd: BDD.01.03.0ad7"
  error_handling:
    - condition: "Catastrophic validation fails."
      response: "When IPLAN-03 is implemented, return rejection and do not call private CTrade."
      source: "@bdd: BDD.01.03.9a8b"
    - condition: "Broker or retcode outcome is ambiguous after submission."
      response: "When IPLAN-03 is implemented, request HALT through the state-machine/reconciliation path."
      source: "@bdd: BDD.01.03.e16a"
    - condition: "Retryable broker retcode is returned."
      response: "The deferred IPLAN-03 implementation will apply the configured bounded retry policy; HALT if final outcome remains ambiguous."
      source: "@ears: EARS.01.03.588b"
    - condition: "OrderCheck or margin validation fails."
      response: "When IPLAN-03 is implemented, reject with preflight evidence and do not call private CTrade."
      source: "@bdd: BDD.01.03.9a8b"
    - condition: "Broker returns TRADE_RETCODE_DONE_PARTIAL."
      response: "The deferred IPLAN-03 implementation will set status to partial and record filled_lots from the broker response; treat it as deterministic — ambiguous: false, retryable: false."
      source: "@ears: EARS.01.03.ec72"
    - condition: "Guarded close, modify, or cancel cannot be safely submitted or confirmed."
      response: "The deferred IPLAN-03 implementation will return false/guard rejection to Position; Position owns follow-up HALT or reconciliation policy (@chg: CHG-22)."
      source: "@chg: CHG-22"

## Section 6: Implementation Notes
implementation_notes:
  constraints:
    - "When implemented by IPLAN-03, immediately before every OrderSend, cancel, close, or modify operation, guarded execution rechecks PositionContext readiness, non-HALT state, current MarkerIsOwner fence, supported account mode, and required provider evidence."
    - "The deferred IPLAN-03 implementation will reject mutation on lease loss or unavailable ownership/provider evidence and request HALT; a prior successful guard result cannot authorize a later broker operation."
    - "The deferred IPLAN-03 implementation will block entry, modification, trailing, and ordinary exit paths while halted; only a separately classified emergency cleanup path with current proven ownership may mutate broker state."
    - "When implemented by IPLAN-03, CGuardedTrade will own the only private CTrade instance reachable from framework-mediated execution."
    - "Strategy files MUST NOT include terminal-global Trade.mqh or call raw broker execution APIs."
    - "OrderCheck and explicit margin validation are separate guard stages."
    - "The deferred IPLAN-03 CGuardedTrade MUST NOT become the owner of daily-loss, max-open-lots, max-trades-per-day, or panic-stop policy; it will consume CRiskManager state as an environmental gate only."
    - "CRiskManager MUST NOT submit broker orders directly; emergency close requests route back through strategy/coordinator/guarded execution paths."
    - "Execution-owned test fixtures MUST supply spread, fill-mode, OrderCheck, margin, broker-retcode, and private CTrade outcome scenarios; do not add those fields to FakeMarketContext (CHG-19)."
    - "IPLAN-03 SHALL define the deferred ITradePort as the single derived interface over the IPLAN-04-owned ITradeExecutor declaration and implement only that parent on the deferred CGuardedTrade. IPLAN-04 ships the seam and fake executor needed by position tests; no multiple inheritance is permitted (@chg: CHG-22, CHG-23)."
  patterns:
    - "Use composition around vendored CTrade because convenience methods are not virtual."
    - "Classify retcodes into success, pending, retryable, terminal failure, and unknown-failsafe groups."
    - "When implemented by IPLAN-03, store normalized submitted price/lots and broker retcodes in GuardResult so trade evidence can compare intended versus actual outcome."
  performance_considerations:
    - "The matched release benchmark SHALL run the same terminal/build, data, symbol/timeframe, and settings as the hand-written equivalent. After at least 1,000 warm-up callbacks, collect at least 10,000 callbacks through the SPEC-09 profiler; gate matched median tester overhead at <=10% per @threshold: PRD.01.perf.tester_overhead and report median/p95 guard-stage time, request count, broker-preflight count, and measurement window."
    - "Rejected orders should emit diagnostics without adding optimization-mode I/O unless audit in optimization is enabled. Guard saturation fails closed: do not submit a new broker mutation when preflight or the event queue cannot preserve the current ownership/HALT deadline; shed nonessential diagnostics before lease/risk/fence work."

