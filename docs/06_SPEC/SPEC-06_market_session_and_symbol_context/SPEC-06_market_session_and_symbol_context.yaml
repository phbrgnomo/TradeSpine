## Section 2: Component Overview
component_overview:
  description: "The market context component loads broker symbol metadata at init, exposes account and symbol diagnostics, validates order definitions against symbol constraints, gates entries by market and user-defined sessions, and emits fixed contract-expiration warnings."
  architecture_decision: "@adr: ADR.10.03.51ea"
  diagram:
    tags: ["@diagram: c4-l3", "@diagram: dfd-l3"]
    mermaid: |
      flowchart LR
        Strategy["CStrategyBase"] --> Market["CMarketContext"]
        Market --> Symbol["CSymbolContext"]
        Market --> Session["CSessionContext"]
        Symbol --> StdLib["Vendored CSymbolInfo"]
        StdLib --> Terminal["MT5 symbol-property API"]
        Session --> BrokerClock["TimeCurrent broker time"]
        Market --> Guard["CGuardedTrade gates"]
  language: "MQL5"
  dependencies:
    - name: "Vendored CSymbolInfo"
      version: "pinned MQL5 Standard Library"
      purpose: "Single adapter for one-time static tick, contract, lot, digits, stop/freeze, and trade-mode metadata loading into SymbolMetadata."
    - name: "TimeCurrent"
      version: "MT5 runtime"
      purpose: "Authoritative broker/server time for sessions."
    - name: "Logger"
      version: "v1"
      purpose: "Emits init, session, and expiration diagnostics."

## Section 3: Interfaces
interfaces:
  exports:
    - name: "CSymbolContext"
      type: "class"
      signature: "class CSymbolContext"
      description: "Loads and exposes required symbol metadata for sizing and order validation."
      errors:
        - "INIT_FAILED: required symbol metadata is missing or invalid."
    - name: "CSessionContext"
      type: "class"
      signature: "class CSessionContext"
      description: "Evaluates broker market session, user trading-hours session, and day-trade close buffer. Evaluate() accepts the broker market-session end-of-day (market_session_end_tod) so the day-trade close trigger can be measured from the market session end when CommonInputs.close_reference selects it."
      errors:
        - "SessionBlocked: new entries are refused while entry sessions are closed."
    - name: "IContractInfoProvider"
      type: "interface"
      signature: "interface IContractInfoProvider"
      description: "Contract expiry seam used by CMarketContext for expiration-warning checks: ExpirationTime() returns the contract expiry timestamp (0 = no expiry / non-futures sentinel). Production implementation reads SYMBOL_EXPIRATION_TIME; test doubles return a configured fixture via SetExpirationTime(). IsExpirationWarning() compares TimeCurrent() against ExpirationTime() to emit the fixed-duration expiry alert."
      errors:
        - "ExpirationTime() == 0: treated as no-expiry / non-futures; IsExpirationWarning() returns false."
    - name: "IMarketSessionProvider"
      type: "interface"
      signature: "interface IMarketSessionProvider"
      description: "Broker market-session schedule seam (distinct from SYMBOL_TRADE_MODE): IsMarketSessionOpen(when) reports schedule membership for the market_open gate; MarketSessionEndTod(when) supplies the REGULAR (first / index-0) trade-session end-of-day for the close-reference trigger. After-hours sessions (later session indices) are intentionally excluded so the day-trade close references normal trading hours (@chg: CHG-21). Live adapter reads SymbolInfoSessionTrade session index 0; test doubles implement it directly."
      errors:
        - "IsMarketSessionOpen returns false (conservative closed) when no session schedule is defined or available."
        - "MarketSessionEndTod returns -1 when no trade session is defined for the weekday, or when the broker reports a full-day sentinel window (to >= 86400, i.e. 00:00-24:00) that is unusable as a close reference; the close trigger then falls back to entry_window_end (@chg: CHG-21)."
    - name: "CMarketContext"
      type: "class"
      signature: "class CMarketContext"
      description: "Coordinates symbol, account, session, and contract lifecycle checks."
      errors:
        - "MarketBlocked: market/symbol constraints block init, entry, or release validation."
    - name: "ValidateOrderDefinition"
      type: "method"
      signature: "bool ValidateOrderDefinition(const TradeIntent &intent, string &reason)"
      description: "Validates an explicitly assigned BUY or SELL side, lots, stop prices, and price grid against initialized symbol metadata. Consumes the canonical TradeIntent declared in Include/Core/TradeTypes.mqh; its default invalid order_type sentinel is rejected before trade-mode or numeric validation (@chg: CHG-21, @chg: CHG-26)."
      errors:
        - "false: symbol, lots, stop, price grid, or trade mode is invalid."

## Section 4: Data Models
data_models:
  models:
    - name: "SymbolMetadata"
      type: "struct"
      fields:
        - name: "tick_size"
          type: "double"
          required: true
          description: "Broker tick-size metadata."
        - name: "tick_value"
          type: "double"
          required: true
          description: "Broker tick-value metadata (SYMBOL_TRADE_TICK_VALUE)."
        - name: "contract_size"
          type: "double"
          required: true
          description: "Broker contract size (SYMBOL_TRADE_CONTRACT_SIZE)."
        - name: "point"
          type: "double"
          required: true
          description: "Broker point size used for stop-distance conversion."
        - name: "lot_min"
          type: "double"
          required: true
          description: "Broker minimum volume."
        - name: "lot_max"
          type: "double"
          required: true
          description: "Broker maximum volume."
        - name: "lot_step"
          type: "double"
          required: true
          description: "Broker volume step."
        - name: "digits"
          type: "int"
          required: true
          description: "Symbol price precision."
        - name: "trade_mode"
          type: "ENUM_SYMBOL_TRADE_MODE"
          required: true
          description: "Initialization snapshot of broker trade mode; live entry permission re-reads the dynamic terminal value."
        - name: "stops_level"
          type: "int"
          required: true
          description: "Minimum stop distance in points (SYMBOL_TRADE_STOPS_LEVEL)."
        - name: "freeze_level"
          type: "int"
          required: true
          description: "Modification freeze distance in points (SYMBOL_TRADE_FREEZE_LEVEL)."
    - name: "SessionWindow"
      type: "struct"
      fields:
        - name: "market_open"
          type: "bool"
          required: true
          description: "Broker market-session schedule membership: true only when IMarketSessionProvider.IsMarketSessionOpen reports that the current time is inside a broker trade session; false when no session schedule is available. Directional symbol trade-mode permission is evaluated later by ValidateOrderDefinition for the concrete BUY or SELL intent."
        - name: "user_trading_hours_open"
          type: "bool"
          required: true
          description: "Operator-defined entry window allows new entries."
        - name: "day_trade_close_required"
          type: "bool"
          required: true
          description: "Day-trade close sequence must run before market close."

## Section 5: Behavior
behavior:
  validation_rules:
    - rule: "ValidateOrderDefinition SHALL reject any TradeIntent.order_type other than ORDER_TYPE_BUY or ORDER_TYPE_SELL before trade-mode, lots, price, or stop validation."
      source: "@chg: CHG-21, @chg: CHG-26"
    - rule: "Required symbol information SHALL load during strategy initialization."
      source: "@ears: EARS.01.03.03b2"
    - rule: "Order definitions SHALL validate sizing, lots, stop prices, and price grid against initialized symbol information."
      source: "@ears: EARS.01.03.ec72"
    - rule: "Symbol metadata SHALL require finite positive tick_size, tick_value, contract size, point, lot step, and lot bounds; stops_level and freeze_level SHALL be non-negative point counts."
      source: "@chg: CHG-25"
    - rule: "Entries SHALL require both market trade session and user-defined strategy trading-hours window."
      source: "@ears: EARS.01.03.1a3e"
    - id: "VR-CLOSE-REF-06"
      rule: |
        WHEN day_trade_mode is true THE day-trade forced-close trigger SHALL be measured
        from the reference selected by CommonInputs.close_reference: entry_window_end for
        CLOSE_REF_USER_WINDOW_END, or the broker REGULAR (first / index-0) market-session
        end (market_session_end_tod) for CLOSE_REF_MARKET_SESSION_END, falling back to
        entry_window_end when the market session end is unavailable. After-hours sessions
        SHALL NOT be used as the close reference so the close aligns with normal trading
        hours.
      source: "@chg: CHG-19, @chg: CHG-21"
    - rule: "Expiration warning SHALL fire at session open when a supported futures contract expires in one broker day."
      source: "@ears: EARS.01.03.db97"
  state_transitions:
    - from: "EntriesAllowed"
      to: "EntriesBlocked"
      trigger: "Market session or user-defined trading-hours session is closed."
      source: "@bdd: BDD.01.03.a399"
    - from: "DayTradeActive"
      to: "ForceCloseRequired"
      trigger: "Day-trade mode reaches close buffer before market session close."
      source: "@bdd: BDD.01.03.d4a5"
  error_handling:
    - condition: "Symbol metadata is missing or invalid."
      response: "Fail initialization and disable trading."
      source: "@bdd: BDD.01.03.edae"
    - condition: "Day-trade forced close fails."
      response: "Enter HALT and preserve unresolved exposure evidence."
      source: "@bdd: BDD.01.03.9a7d"

## Section 6: Implementation Notes
implementation_notes:
  constraints:
    - "Broker/server time is authoritative; no v1 timezone offset input exists."
    - "Futures v1 is validated for B3 futures scope; unsupported symbols block release validation."
    - "Contract-expiration warning threshold is fixed via @fixed-threshold: PRD.01.market.expiration_warning_one_broker_day."
    - "v1 simplification (@chg: CHG-21): MarketSessionEndTod uses the regular (first / index-0) trade session only; after-hours sessions are excluded. Brokers that split the regular session across multiple indices before after-hours would need refinement. Consistent with the existing midnight-crossing-out-of-scope simplification."
    - "v1 limitation (@chg: CHG-21, verified on B3 WINQ26 2026-06-21): some B3 brokers do not configure real session hours and report a full-day window (00:00-24:00) for index 0. MarketSessionEndTod treats to >= 86400 as a sentinel and returns -1 (close trigger falls back to entry_window_end). A side effect is that IsMarketSessionOpen always returns true for such symbols (the [0,86400) window covers all times), effectively disabling the market_open gate; this is a broker-configuration limitation, not a framework defect. For B3, CLOSE_REF_USER_WINDOW_END is the recommended close reference."
  patterns:
    - "CSymbolContext SHALL use vendored CSymbolInfo as the sole adapter for one-time static metadata loading, map its typed accessors once into SymbolMetadata, validate the snapshot, and expose immutable reads to sizing and guard components."
    - "A live SYMBOL_TRADE_MODE read is permitted only for entry permission because the broker restriction can change intraday; it SHALL NOT become a second static metadata loader."
    - "Keep session entry gates separate from forced exit and emergency close paths."
  performance_considerations:
    - "Session and symbol checks must avoid heavy history or file I/O on idle ticks."

## Section 7: Downstream TDD Contracts
tdd_contracts:
  tdd_document: "@tdd: TDD.06.04.8f4d"
  test_files:
    - path: "Scripts/Tests/Test_SymbolContext.mq5"
      covers: "Deterministic fixture validation, invalid fixture re-initialization without stale data, and lot/price-grid validation."
    - path: "Scripts/Tests/Test_SymbolContextLive.mq5"
      covers: "Manual Tier-1.5 production initialization through vendored CSymbolInfo on the chart or explicitly supplied broker symbol; excluded from RunAllTests because it is environment-dependent."
    - path: "Scripts/Tests/Test_SessionContext.mq5"
      covers: "Market session, user trading-hours gate, and day-trade close trigger."
    - path: "Scripts/Tests/Test_ContractLifecycle.mq5"
      covers: "Order-definition validation including invalid default side, session facade behavior, and one-broker-day expiration warning at session open."

