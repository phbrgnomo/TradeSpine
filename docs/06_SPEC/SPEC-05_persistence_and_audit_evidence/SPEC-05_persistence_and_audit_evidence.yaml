## Section 2: Component Overview
component_overview:
  description: "The persistence and evidence component stores low-I/O strategy state in terminal Global Variables, builds deterministic hashed keys, writes paired trade evidence CSV records, keeps diagnostic logs separate, and raises operator alerts for unsafe states. CHG-22/IPLAN-04 adds a double-buffered LifecycleSnapshot committed generation-last, classified reads and legacy migration, retained HALT/recovery audit evidence, explicit runtime namespaces, and a mutex-bootstrapped token/heartbeat lease with mandatory ownership fencing."
  architecture_decision: "@adr: ADR.02.03.c7dd"
  diagram:
    tags: ["@diagram: c4-l3", "@diagram: dfd-l3"]
    mermaid: |
      flowchart LR
        Strategy["Strategy/Coordinator"] --> Key["CKeyBuilder"]
        Key --> Store["CStateStore"]
        Store --> GV["MT5 Global Variables"]
        Strategy --> TradeLog["TradeLogger"]
        TradeLog --> CSV["MQL5 Files CSV"]
        Logger["Logger"] --> Journal["Terminal Journal"]
        Logger --> Alert["IAlertSink"]
  language: "MQL5"
  dependencies:
    - name: "MT5 Global Variables"
      version: "terminal-managed"
      purpose: "Persist scalar double-encoded strategy state, duplicate markers, locks, and HALT flags under documented terminal key constraints."
    - name: "MQL5 Files sandbox"
      version: "terminal-managed"
      purpose: "Write trade evaluation CSV records and optional diagnostic files."
    - name: "OptContext"
      version: "v1"
      purpose: "Suppress nonessential logging and persistence during optimization."

## Section 3: Interfaces
interfaces:
  exports:
    - name: "IStateStore"
      type: "interface"
      signature: "interface IStateStore { bool WriteLifecycleSnapshot(const LifecycleSnapshot &snapshot); ENUM_STORE_READ_RESULT ReadLifecycleSnapshot(LifecycleSnapshot &snapshot); bool IsRuntimeIsolated(); bool WriteScalar(string scope, double value); bool ReadScalar(string scope, double &value); bool SetDuplicate(string intent_id_hash); bool IsDuplicate(string intent_id_hash); bool SetHalt(const HaltEvidence &ev); bool AppendHaltEvidence(const HaltEvidence &ev); bool IsHalted(); bool ClearHalt(); bool WriteTicket(ulong ticket); bool ReadTicket(ulong &ticket); bool WritePendingOrder(ulong ticket, datetime submitted_ts); bool ReadPendingOrder(ulong &ticket, datetime &submitted_ts); bool ClearPendingOrder(); bool MarkerClaimOrReclaim(datetime now, int lease_secs, long &out_token, ENUM_DUPLICATE_MARKER_STATUS &status); bool MarkerHeartbeat(long &token, datetime now); bool MarkerIsOwner(long token); bool MarkerRelease(long token); bool Verify(); }"
      description: "Persistence seam for classified LifecycleSnapshot reads, commit-last snapshot writes, legacy migration, checked HALT/recovery evidence, append-only unfenced audit evidence, explicit runtime isolation, and token-fenced marker claim, heartbeat, ownership validation, and release. Virtual-ledger fragments remain v2+ scope."
      errors:
        - "StateCorruption: identity mismatch or unrecoverable missing active ownership evidence."
    - name: "CKeyBuilder"
      type: "class"
      signature: "class CKeyBuilder { bool Build(const CanonicalIdentity &id, string &key); bool Verify(const string key, const CanonicalIdentity &expected); double Fingerprint(const CanonicalIdentity &id); }"
      description: "Builds deterministic hashed GV names from canonical strategy identity fields."
      errors:
        - "KeyCollision: stored identity hash does not match expected identity."
    - name: "CStateStore"
      type: "class"
      signature: "class CStateStore : public IStateStore"
      description: "Reads and writes lossless GV-backed lifecycle state. It writes an inactive snapshot slot, checksum, and read-back verification before publishing the generation last; failed replacements preserve the prior committed snapshot. Marker bootstrap is serialized by an exclusive identity-and-namespace lock and success requires owner/heartbeat reread validation."
      errors:
        - "StateCorruption: identity mismatch or unrecoverable missing active ownership evidence."
    - name: "TradeLogger"
      type: "class"
      signature: "class TradeLogger { bool Init(string filename_prefix, COptContext* ctx, ILogSink* sink); bool WriteIntent(const TradeEvidenceRecord &rec); bool WriteExecution(const TradeEvidenceRecord &rec); void Close(); }"
      description: "Writes paired intent and execution records for trade evaluation. _EnsureFile() checks the CSV header write on a newly created file and fails closed if it cannot be written (CHG-18)."
      errors:
        - "LogFailure: evidence write failed, including header-write failure on new-file creation (CHG-18); component returns status for caller policy."
    - name: "Logger"
      type: "class"
      signature: "class Logger { void Init(COptContext* ctx, ILogSink* sink=NULL); void Debug(const string category, const string msg); void Info(const string category, const string msg); void Warn(const string category, const string msg); void Error(const string category, const string msg); }"
      description: "Writes leveled diagnostic messages separate from trade evaluation records."
      errors:
        - "None; logging failures are reported as diagnostics where possible."
    - name: "IAlertSink"
      type: "interface"
      signature: "interface IAlertSink { bool Halt(const HaltEvidence &ev); void Warn(string category, string msg); }"
      description: "Routes HALT and operator-facing alert payloads by runtime mode."
      errors:
        - "None; unavailable UI alerts degrade to log-only sink."
    - name: "CAlertSink"
      type: "class"
      signature: "class CAlertSink : public IAlertSink"
      description: "Production implementation of IAlertSink. Init(ctx, logger, store=NULL) accepts an optional IStateStore* for the persistent HALT flag circuit-breaker (CHG-16). When wired, Halt() calls store.SetHalt(ev) before UI/log suppression and before Alert(), so the EA remains halted in every runtime mode including optimization (CHG-22). A missing store preserves notification-only success; a false SetHalt result makes Halt return false and emits a secondary diagnostic when logging is available; in-memory HALT remains effective."
      errors:
        - "Missing store pointer: notification-only routing remains available and Halt returns true; no durable circuit breaker is written."
        - "SetHalt() failure: secondary Error emitted; in-memory HALT remains effective, while durable circuit-breaker state is unconfirmed until verified."
    - name: "IMarkerBackend"
      type: "interface"
      signature: "interface IMarkerBackend { bool Exists(string key); double Get(string key); bool Set(string key, double value); bool CompareExchange(string key, double value, double expected); int AcquireExclusive(string lock_name); void ReleaseExclusive(int handle); }"
      description: "Primitive Global Variable and exclusive-file-lock seam used by CMarkerLease. CTerminalMarkerBackend is the production implementation; deterministic tests inject a fake backend."
      errors:
        - "false/INVALID_HANDLE: primitive read/write/CAS/lock operation failed or contended; lease claim fails closed."

## Section 4: Data Models
data_models:
  models:
    - name: "ENUM_STORE_READ_RESULT"
      type: "enum"
      purpose: "Classifies snapshot reads without collapsing absence, validity, corruption, and storage failure."
      fields:
        - name: "STORE_READ_ABSENT"
          type: "enum value 0"
          required: true
          description: "No committed lifecycle snapshot exists."
        - name: "STORE_READ_VALID"
          type: "enum value 1"
          required: true
          description: "Committed generation and checksum are valid."
        - name: "STORE_READ_CORRUPT"
          type: "enum value 2"
          required: true
          description: "Snapshot exists but its identity or invariants are contradictory."
        - name: "STORE_READ_ERROR"
          type: "enum value 3"
          required: true
          description: "Storage, key, or initialization access failed."
    - name: "LifecycleSnapshot"
      type: "struct"
      purpose: "One logically committed lifecycle aggregate published by generation after inactive-slot checksum verification."
      fields:
        - name: "state"
          type: "ENUM_POSITION_STATE"
          required: true
          description: "Committed lifecycle state; UNKNOWN is never committed."
        - name: "position_ticket"
          type: "ulong"
          required: true
          description: "Owned broker position ticket or zero."
        - name: "position_identifier"
          type: "ulong"
          required: true
          description: "Stable POSITION_IDENTIFIER used for history recovery or zero."
        - name: "pending"
          type: "PendingOrderEvidence"
          required: true
          description: "Complete pending/cancel evidence or the zero-ticket shape."
        - name: "halted"
          type: "bool"
          required: true
          description: "Persistent lifecycle circuit-breaker state."
        - name: "generation"
          type: "long"
          required: true
          description: "Positive committed generation; zero is caller/legacy sentinel only."
    - name: "CanonicalIdentity"
      type: "struct"
      purpose: "Defines the canonical account, symbol, magic, and scope tuple used to derive isolated persistence keys."
      fields:
        - name: "account"
          type: "long"
          required: true
          description: "Account login."
        - name: "symbol"
          type: "string"
          required: true
          description: "Strategy symbol."
        - name: "magic"
          type: "ulong"
          required: true
          description: "Strategy magic number."
        - name: "scope"
          type: "string"
          required: true
          description: "GV namespace scope."
    - name: "TradeEvidenceRecord"
      type: "struct"
      purpose: "Carries one correlated intent or execution CSV evidence row for trade audit."
      notes: "One CSV row. Intent-side fields are written as empty on EXECUTION rows; execution-side fields are written as empty on INTENT rows. side is written on both row types. CHG-15. side is ENUM_TRADE_SIDE, not a free-form string (CHG-18)."
      fields:
        - name: "record_type"
          type: "ENUM_TRADE_RECORD_TYPE"
          required: true
          scope: both
          description: "TRADE_RECORD_INTENT or TRADE_RECORD_EXECUTION."
        - name: "strategy_run_id"
          type: "string"
          required: true
          scope: both
          description: "Correlates all records within one strategy lifecycle."
        - name: "order_intent_id"
          type: "string"
          required: true
          scope: both
          description: "Pairs exactly one intent and one execution row."
        - name: "symbol"
          type: "string"
          required: true
          scope: both
          description: "Instrument symbol."
        - name: "magic"
          type: "ulong"
          required: true
          scope: both
          description: "EA magic number. Written as %I64u; never cast to long."
        - name: "side"
          type: "ENUM_TRADE_SIDE"
          required: true
          scope: both
          description: "TRADE_SIDE_BUY or TRADE_SIDE_SELL; rendered as \"BUY\"/\"SELL\" in the CSV via _SideToString() (CHG-18). Written on both row types to allow standalone EXECUTION row auditing."
        - name: "intended_price"
          type: "double"
          required: false
          scope: intent
          description: "EA's calculated entry price. Empty on EXECUTION rows."
        - name: "sl_price"
          type: "double"
          required: false
          scope: intent
          description: "Requested stop loss price (0.0 = none requested). Empty on EXECUTION rows."
        - name: "tp_price"
          type: "double"
          required: false
          scope: intent
          description: "Requested take profit price (0.0 = none requested). Empty on EXECUTION rows."
        - name: "lots_requested"
          type: "double"
          required: false
          scope: intent
          description: "Lot size from position sizer. Empty on EXECUTION rows."
        - name: "retcode"
          type: "uint"
          required: false
          scope: execution
          description: "Broker return code. Empty on INTENT rows."
        - name: "ticket"
          type: "ulong"
          required: false
          scope: execution
          description: "Order/deal ticket (0 = not created / rejected). Written as %I64u. Empty on INTENT rows."
        - name: "fill_price"
          type: "double"
          required: false
          scope: execution
          description: "Actual fill price (0.0 = rejected). Empty on INTENT rows."
        - name: "lots_submitted"
          type: "double"
          required: false
          scope: execution
          description: "Lots that reached the broker. Empty on INTENT rows."
        - name: "broker_outcome"
          type: "string"
          required: false
          scope: both
          description: "Free-form overflow for rejection messages, retry info, or supplementary evidence not covered by structured fields."
    - name: "HaltEvidence"
      type: "struct"
      purpose: "Carries operator-facing context retained when lifecycle safety enters HALT."
      fields:
        - name: "reason"
          type: "string"
          required: true
          description: "HALT reason."
        - name: "last_known_state"
          type: "ENUM_POSITION_STATE"
          required: true
          description: "Preserved lifecycle state."
        - name: "operator_action"
          type: "string"
          required: true
          description: "Recovery instruction shown to the operator."
        - name: "symbol"
          type: "string"
          required: false
          description: "Symbol associated with the HALT, if known (CHG-22)."
        - name: "magic"
          type: "ulong"
          required: false
          description: "Strategy magic associated with the HALT, if known (CHG-22)."
        - name: "ticket"
          type: "ulong"
          required: false
          description: "Position/order ticket associated with the HALT, if known (CHG-22)."
    - name: "PendingOrderEvidence"
      type: "struct"
      purpose: "Retains a pending order and its cancellation timing/origin across restart and ambiguity."
      fields:
        - name: "ticket"
          type: "ulong"
          required: true
          description: "Pending-entry order ticket stored losslessly across GV hi/lo slots (CHG-22)."
        - name: "submitted_ts"
          type: "datetime"
          required: true
          description: "Pending-entry order submission timestamp used to recompute fill timeout after restart (CHG-22)."
        - name: "cancel_requested_ts"
          type: "datetime"
          required: true
          description: "Zero before cancellation; otherwise the timestamp committed before broker cancel submission (CHG-22)."
        - name: "cancel_origin"
          type: "ENUM_CANCEL_ORIGIN"
          required: true
          description: "Classified cancellation owner/reason committed with the pending evidence (CHG-22)."
    - name: "DuplicateMarkerLease"
      type: "struct"
      purpose: "Represents the token and heartbeat evidence used to fence duplicate strategy owners."
      fields:
        - name: "marker_owner"
          type: "long"
          required: true
          description: "CAS-authoritative owner token/epoch. Positive means owned by that token; non-positive means free while preserving epoch magnitude (CHG-22)."
        - name: "marker_hb_ts"
          type: "datetime"
          required: true
          description: "Explicit heartbeat timestamp. Used for stale-reclaim decisions; GlobalVariableTime is not used for liveness (CHG-22)."
        - name: "status"
          type: "ENUM_DUPLICATE_MARKER_STATUS"
          required: true
          description: "One of DUPLICATE_MARKER_ACTIVE, DUPLICATE_MARKER_STALE_RECLAIMED, or DUPLICATE_MARKER_CONFLICT. Claim outcome for duplicate marker lease acquisition (CHG-22)."
    - name: "GlobalVariableScalarState"
      type: "struct"
      purpose: "Represents one encoded terminal Global Variable value and its deterministic key."
      fields:
        - name: "key"
          type: "string"
          required: true
          description: "Deterministic hashed terminal Global Variable key that respects documented terminal key constraints."
        - name: "value"
          type: "double"
          required: true
          description: "Scalar value stored in terminal Global Variables."
        - name: "encoding"
          type: "ENUM_GV_VALUE_ENCODING"
          required: true
          description: "Flag, timestamp, volume, hash fragment, or split identifier part encoding."

## Section 5: Behavior
behavior:
  validation_rules:
    - rule: "Trade evidence SHALL pair intent and execution records."
      source: "@ears: EARS.01.03.a023"
    - rule: "Diagnostic logs SHALL remain separate from trade evaluation records."
      source: "@ears: EARS.01.03.a71c"
    - rule: "Idle-path persistence and evidence work SHALL honor low-I/O requirements."
      source: "@ears: EARS.01.03.c5b7"
    - rule: "GV-backed state SHALL store only scalar double-compatible values; string payloads and rich evidence SHALL remain in files, logs, or documentation evidence packs."
      source: "@ears: EARS.01.03.c5b7"
    - rule: "IStateStore SHALL expose LifecycleSnapshot commit/read classification, explicit runtime isolation, checked HALT/recovery evidence, legacy migration, and MarkerClaimOrReclaim/MarkerHeartbeat/MarkerIsOwner/MarkerRelease fencing in lockstep across production, fakes, and tests."
      source: "@chg: CHG-22"
    - rule: "Duplicate marker liveness SHALL use explicit marker_hb_ts and SHALL NOT use GlobalVariableTime because reads/checks can refresh access time (CHG-22)."
      source: "@chg: CHG-22"
    - rule: "When a store is wired, CAlertSink.Halt SHALL attempt store.SetHalt(ev) before UI/log suppression and return durable persistence success; without a store it SHALL preserve notification-only success. In-memory HALT remains effective on persistence failure; suppressed runtimes require an isolated namespace and never clear live HALT state."
      source: "@chg: CHG-22"
    - rule: "A context that has lost MarkerIsOwner SHALL NOT write the shared lifecycle snapshot or HALT flag. It SHALL become HALT in memory and may append evidence through AppendHaltEvidence without changing the current owner's authoritative state."
      source: "@chg: CHG-22"
  state_transitions:
    - from: "Recoverable evidence"
      to: "Restored state"
      trigger: "GV and broker/history evidence prove current ownership."
      source: "@bdd: BDD.01.03.e16a"
    - from: "Ambiguous evidence"
      to: "HALT"
      trigger: "Hedging ticket ownership cannot be proven; pending-exit relationships are v2+ scope."
      source: "@bdd: BDD.01.03.e16a"
  error_handling:
    - condition: "GV identity hash mismatch."
      response: "Fail init before live trading, or set persistent GV HALT flag via IStateStore.SetHalt() and notify operator via Alert()/SendNotification() if detected live. EA remains halted in memory on subsequent callbacks. If SetHalt() fails, emit a secondary Error and treat only the durable circuit-breaker state as unconfirmed; do not describe the in-memory lifecycle as unhalted. (CHG-16, CHG-17, CHG-23)"
      source: "@bdd: BDD.01.03.a31d"
    - condition: "Trade evidence write fails."
      response: "Log diagnostic failure and preserve broker safety outcome. Header-write failure on new-file creation is treated as a write failure: the file handle is closed and reset, and the call returns false (CHG-18)."
      source: "@bdd: BDD.01.03.d6ae"
    - condition: "Marker owner is fresh or token compare-and-swap loses."
      response: "Return status=DUPLICATE_MARKER_CONFLICT and no token (CHG-22)."
      source: "@chg: CHG-22"
    - condition: "Marker owner is stale by explicit marker_hb_ts."
      response: "Allow MarkerClaimOrReclaim to CAS a strictly larger token and return status=DUPLICATE_MARKER_STALE_RECLAIMED on success (CHG-22)."
      source: "@chg: CHG-22"
    - condition: "Stale owner attempts heartbeat or release after ownership moved."
      response: "Reject the operation because token no longer matches marker_owner (CHG-22)."
      source: "@chg: CHG-22"

## Section 6: Implementation Notes
implementation_notes:
  one_way_decisions:
    - id: "SPEC.05.06.7c3a"
      decision: "The first committed LifecycleSnapshot generation retires compatibility with prior binaries. Old and CHG-22-R1 source interfaces have a zero-width coexistence window; downgrade after this boundary is permitted only while the system is disabled or in HALT, with exclusive ownership, exported evidence, and proven flat/no-matching-order broker state through the rehearsed legacy-IDLE procedure."
      rationale: "A prior binary cannot interpret the committed generation, checksum, complete cancel evidence, or lease-fencing contract and could mutate broker or durable state from a contradictory view."
      governed_by: "@chg: CHG-22"
  constraints:
    - "Each EA instance uses one serial, non-reentrant MQL5 event queue. Separate instances may contend for terminal Global Variables and files; authoritative lifecycle writes are fenced by the marker owner token, and append-only evidence uses the store's identity/namespace-specific file path and checked write result."
    - "LifecycleSnapshot stores state, broker ticket, stable position identifier, complete pending/cancel evidence, HALT, generation, and checksum as one logical unit."
    - "CStateStore writes the inactive slot, checksum, and read-back verification before publishing life_commit; failed replacement leaves the prior committed generation active."
    - "ReadLifecycleSnapshot distinguishes ABSENT, VALID, CORRUPT, and ERROR. Legacy keys migrate only when no committed snapshot exists and their values are unambiguous."
    - "Marker bootstrap and heartbeat publication hold an identity-and-runtime-namespace hashed exclusive file lock across CAS, heartbeat publication, and owner/heartbeat reread."
    - "MarkerIsOwner is a mandatory fence immediately before every lifecycle or broker mutation; lease loss disables readiness and enters HALT."
    - "IAlertSink.Halt returns notification-only success without a configured store and durable persistence success when one is configured. HALT and recovery events append to retained audit evidence; ClearHalt appends recovery first and clears the flag last."
    - "IMarkerBackend is injectable for deterministic first-use and CAS-to-heartbeat interleaving tests; CTerminalMarkerBackend owns production file/GV primitives."
    - "Lifecycle snapshots use two terminal-GV slots plus a commit generation; append-only audit files retain HALT and recovery evidence for at least 30 days."
    - "Ticket, deal, and order identifiers MUST be stored losslessly, not packed into imprecise double integers."
    - "Raw account, symbol, and magic identity appears in logs/docs, not GV names."
    - "GV keys MUST use deterministic hashing and respect documented terminal Global Variable key constraints."
    - "Lossless identifiers in GV state MUST be split into exact-safe scalar parts or stored outside GV state as file evidence."
  patterns:
    - "Use deterministic canonical identity strings before hashing GV keys."
    - "Use separate sinks for diagnostic logs, trade records, and alerts."
    - "Use GlobalVariableSetOnCondition-compatible scalar values for duplicate markers; execution mutex state is v2+ with netting/exchange support."
    - "ENUM_TRADE_RECORD_TYPE is defined in Include/Persistence/PersistenceTypes.mqh (CHG-13). StateStore.mqh re-exports it transitively via its own include; TradeLogger.mqh includes PersistenceTypes.mqh directly and does not depend on StateStore.mqh."
    - "CSV string fields MUST be RFC 4180 quoted (double-quote wrap; internal double-quotes doubled). broker_outcome is explicitly free-form evidence and MUST be quoted unconditionally (CHG-14)."
    - "ulong fields (magic, ticket, deal IDs) in serialized CSV output MUST use StringFormat(\"%I64u\", v) — never cast to long before formatting, which corrupts values above LONG_MAX (CHG-14). Consistent with CKeyBuilder's %I64u canonical identity pattern."
    - "TradeEvidenceRecord has 16 CSV columns (CHG-15). Intent-side fields (intended_price, sl_price, tp_price, lots_requested) are written as empty cells on EXECUTION rows; execution-side fields (retcode, ticket, fill_price, lots_submitted) are written as empty cells on INTENT rows. side is written on both row types. broker_outcome is retained as free-form overflow. Single-file design is preserved; strategy performance analysis is out of scope for TradeLogger (MT5 trade history owns that)."
    - "CAlertSink.Init() accepts optional IStateStore* (default NULL). Without a store, Halt() preserves notification-only success and writes no circuit breaker. When wired, Halt() calls store.SetHalt(ev) before Alert(), writing the persistent GV HALT flag. Alert() stays as the operator notification; the flag is the circuit breaker that keeps the EA halted after dialog dismissal. The Coordinator MUST call IStateStore.IsHalted() as the first action in OnTick() and return immediately if true. Resume requires explicit operator action: remove/re-attach the EA or clear the flag via a recovery script. (CHG-16)"
    - "CAlertSink.Halt() checks the bool returned by SetHalt(). On false, a secondary logger.Error() is emitted: 'HALT persistence failed; persistent circuit breaker may not be set'. Fall-back to Print() when logger is NULL. This gives the operator maximum information in the degraded path while preserving the primary HALT log already written above the SetHalt() call. (CHG-17)"
    - "TradeEvidenceRecord.side uses ENUM_TRADE_SIDE (TRADE_SIDE_BUY/TRADE_SIDE_SELL), not a free-form string; TradeLogger::_SideToString() renders \"BUY\"/\"SELL\" for the CSV column. Closes off casing/typo/localisation variants entering the audit evidence file. (CHG-18)"
    - "CStateStore::_setGV() logs GetLastError() via PrintFormat() on GlobalVariableSet() failure (key, value, error code), distinguishing permission/storage/transient failures for operators; the public method still returns bool per the IStateStore contract. (CHG-18)"
    - "TradeLogger::_EnsureFile() checks the FileWriteString() result when writing the CSV header on a newly created file. On failure, it closes and resets the file handle and returns false so WriteIntent()/WriteExecution() emit the existing LogFailure diagnostic, instead of silently proceeding with a possibly headerless evidence file. (CHG-18)"
    - "ENUM_DUPLICATE_MARKER_STATUS is defined in Include/Persistence/PersistenceTypes.mqh to avoid a Persistence-to-Position include cycle (CHG-22)."
    - "CStateStore marker lease uses marker_owner as the only ownership fence and marker_hb_ts as advisory liveness; MarkerRelease stores -token rather than zero to prevent ABA reuse (CHG-22)."
    - "CAlertSink.Halt routes symbol, magic, and ticket in the HALT payload; existing callers may leave them empty/zero for backward compatibility (CHG-22)."
  performance_considerations:
    - "State writes occur on meaningful transitions, not every tick, and release evidence must cover @threshold: PRD.01.perf.idle_tick."

## Section 7: Downstream TDD Contracts
tdd_contracts:
  tdd_document: "@tdd: TDD.05.04.e64a"
  test_files:
    - path: "Scripts/Tests/Test_StateStore.mq5"
      covers: "GV key generation, hi/lo identifier storage, duplicate markers, HALT persistence/clear, pending-order evidence, and marker lease fencing."
    - path: "Scripts/Tests/Test_TradeLogger.mq5"
      covers: "Intent/execution pairing, CSV field coverage, and log separation."
    - path: "Scripts/Tests/Test_AlertSink.mq5"
      covers: "Live, visual tester, non-visual tester, optimization alert behavior, HALT persistence before optimization suppression, and SetHalt failure diagnostics."

## Section 8: Traceability
traceability:
  provenance: ["@chg: CHG-22", "@chg: CHG-23"]
