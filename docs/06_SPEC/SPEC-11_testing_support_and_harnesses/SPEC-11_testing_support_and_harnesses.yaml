## Section 2: Component Overview
component_overview:
  description: "Testing support provides shared deterministic primitives, release-evidence separation, and the approved live-test architecture assessment contract used after code delivery to classify live evidence needs and resolve test-architecture findings before documentation closeout."
  architecture_decision: "@adr: ADR.10.03.51ea"
  diagram:
    tags: ["@diagram: c4-l3", "@diagram: dfd-l3"]
    mermaid: |
      flowchart LR
        Tests["MQL5 test scripts"] --> Harness["ScenarioHarness"]
        Harness --> Clock["FakeClock"]
        Harness --> Extensions["Owner-plan fake extensions"]
        Harness --> Logs["FakeLogSink"]
        Harness --> Components["SPEC components"]
        Components --> Assessment["LiveTestAssessmentContract"]
        Assessment --> Closeout["LiveTestCloseoutGate"]
  language: "MQL5"
  dependencies:
    - name: "Core runtime shared interfaces"
      version: "v1"
      purpose: "IPLAN-09 publishes IClock, ILogSink, runtime context, and profiling data models for test support."
    - name: "Release governance"
      version: "v1"
      purpose: "Consumes test reports and manual evidence packs."

## Section 3: Interfaces
interfaces:
  exports:
    - name: "FakeClock"
      type: "class"
      signature: "class FakeClock : public IClock"
      description: "Deterministic time source for session, timeout, daily reset, and evidence ordering tests."
      errors:
        - "None."
    - name: "FakeLogSink"
      type: "class"
      signature: "class FakeLogSink : public ILogSink"
      description: "Captures diagnostics and evidence messages for deterministic assertions without production logging side effects."
      errors:
        - "Assertion failure when required messages are missing."
    - name: "CAssert"
      type: "class"
      signature: "class CAssert"
      description: "Shared assertion counters, equality checks, and pass/fail summary output for MQL5 test scripts."
      errors:
        - "Assertion failure."
    - name: "ScenarioHarness"
      type: "class"
      signature: "class ScenarioHarness"
      description: "Minimal reusable assembly for component-under-test, shared fakes, owner-extension hooks, stimulus, and evidence assertions."
      errors:
        - "Test assertion failure."
    - name: "LiveTestAssessmentContract"
      type: "process contract"
      signature: "AssessLiveTestArchitecture(ImplementedCodeInventory) -> LiveTestAssessmentResult"
      description: "Inventories implemented behavior boundaries and assessment findings, classifies live-evidence necessity, and decides whether test-architecture refactoring is required."
      errors:
        - "AssessmentIncomplete: an implemented behavior boundary lacks an evidence classification or rationale."
        - "FindingInventoryInvalid: an assessment finding lacks a unique stable finding_id."
        - "UnsafeEnvironment: a mutation-capable test is assigned to an unrestricted production environment."
    - name: "LiveTestCloseoutGate"
      type: "governance contract"
      signature: "CanStartDocumentationCloseout(LiveTestAssessmentResult assessment, LiveTestFindingDisposition[] dispositions) -> bool"
      description: "Allows documentation closeout only when the complete assessed finding inventory matches the disposition inventory one-to-one and every finding has one valid, mutually exclusive disposition."
      errors:
        - "UnresolvedFinding: a finding has no disposition or more than one disposition."
        - "FindingInventoryMismatch: assessed finding IDs and disposition finding_ids are not equal one-to-one."

## Section 4: Data Models
data_models:
  models:
    - name: "EvidenceAssertion"
      type: "struct"
      fields:
        - name: "expected_kind"
          type: "ENUM_EVIDENCE_KIND"
          required: true
          description: "Intent, execution, diagnostic, state, or release evidence kind."
        - name: "expected_trace"
          type: "string"
          required: true
          description: "Expected requirement/spec trace tag in the emitted evidence."
        - name: "required"
          type: "bool"
          required: true
          description: "Whether absence is a test failure."
    - name: "DeferredAccountModeEvidencePack"
      type: "struct"
      fields:
        - name: "account_mode"
          type: "string"
          required: true
          description: "Deferred account mode label covered by init-failure evidence."
        - name: "scenario"
          type: "string"
          required: true
          description: "Deferred-mode validation scenario name."
        - name: "artifacts"
          type: "string"
          required: true
          description: "Evidence file paths or operator notes proving init failure and no trade-path side effects."
    - name: "LiveTestCoverageRecord"
      type: "record"
      fields:
        - name: "module"
          type: "string"
          required: true
          description: "Owning implemented module."
        - name: "behavior_boundary"
          type: "string"
          required: true
          description: "Implemented behavior boundary under assessment."
        - name: "production_paths"
          type: "string[]"
          required: true
          description: "Implemented source paths realizing the behavior."
        - name: "terminal_api_dependencies"
          type: "string[]"
          required: true
          description: "Terminal, broker, account, symbol, or market dependencies affecting testability."
        - name: "dependency_level"
          type: "NONE | TERMINAL | BROKER | ACCOUNT | SYMBOL | MARKET"
          required: true
          description: "Highest external dependency required to observe the behavior."
        - name: "mutation_class"
          type: "READ_ONLY | ACCOUNT_STATE | BROKER_MUTATION"
          required: true
          description: "Highest external-state mutation performed by the behavior or proposed live test."
        - name: "existing_evidence"
          type: "EvidenceType[]"
          required: true
          description: "Zero or more of AUTOMATED, STRATEGY_TESTER, DEMO_LIVE, or MANUAL, recorded without conflation."
        - name: "evidence_gap"
          type: "string"
          required: true
          description: "Behavior claim not established by existing evidence; empty only when no gap remains."
        - name: "live_test_need"
          type: "REQUIRED | CONDITIONAL | NOT_REQUIRED"
          required: true
          description: "Live-evidence necessity classification."
        - name: "safe_environment"
          type: "NONE | DEMO | RESTRICTED_LIVE"
          required: true
          description: "Most permissive environment allowed for the proposed evidence."
        - name: "owner"
          type: "string"
          required: true
          description: "Responsible owner for any proposed evidence or follow-on."
        - name: "proposed_tier"
          type: "AUTOMATED | STRATEGY_TESTER | DEMO_LIVE | RESTRICTED_LIVE | MANUAL | NONE"
          required: true
          description: "Recommended evidence tier after assessment."
        - name: "rationale"
          type: "string"
          required: true
          description: "Evidence-backed classification rationale."
    - name: "LiveTestArchitectureDecision"
      type: "record"
      fields:
        - name: "refactor_decision"
          type: "NO_REFACTOR | TARGETED_REFACTOR | SHARED_ARCHITECTURE_REFACTOR"
          required: true
          description: "Evidence-backed test-architecture decision."
        - name: "affected_contracts"
          type: "string[]"
          required: true
          description: "Contracts and artifacts affected by the decision."
        - name: "risks"
          type: "string[]"
          required: true
          description: "Risks introduced or retained by the decision."
        - name: "migration_order"
          type: "string[]"
          required: true
          description: "Required ordering for refactor work; empty only for NO_REFACTOR."
        - name: "follow_on_artifacts"
          type: "string[]"
          required: true
          description: "Required CHG, SPEC, TDD, or IPLAN follow-ons; empty only for NO_REFACTOR with rationale."
    - name: "LiveTestAssessmentFinding"
      type: "record"
      fields:
        - name: "finding_id"
          type: "string"
          required: true
          description: "Stable identifier unique within the complete architecture assessment."
        - name: "summary"
          type: "string"
          required: true
          description: "Concise statement of the assessed evidence or architecture gap."
        - name: "coverage_record_refs"
          type: "string[]"
          required: true
          description: "Coverage-record identifiers supporting the finding."
        - name: "evidence_refs"
          type: "string[]"
          required: true
          description: "Source, test, runtime, or documentation evidence supporting the finding."
    - name: "LiveTestAssessmentResult"
      type: "record"
      fields:
        - name: "coverage_records"
          type: "LiveTestCoverageRecord[]"
          required: true
          description: "Complete assessed behavior-boundary inventory."
        - name: "findings"
          type: "LiveTestAssessmentFinding[]"
          required: true
          description: "Complete authoritative finding inventory with unique stable finding IDs."
        - name: "architecture_decision"
          type: "LiveTestArchitectureDecision"
          required: true
          description: "Evidence-backed refactor decision derived from the coverage records and findings."
    - name: "LiveTestFindingDisposition"
      type: "record"
      fields:
        - name: "finding_id"
          type: "string"
          required: true
          description: "Stable finding identifier from the architecture assessment."
        - name: "disposition"
          type: "IMPLEMENTED | DEFERRED_WITH_RATIONALE | REJECTED_WITH_EVIDENCE"
          required: true
          description: "Exactly one terminal disposition for the finding."
        - name: "owner"
          type: "string"
          required: true
          description: "Finding owner or accountable decision owner."
        - name: "rationale_or_evidence"
          type: "string"
          required: true
          description: "Implementation evidence, deferral rationale, or rejection evidence."
        - name: "risk_acceptance"
          type: "string"
          required: false
          description: "Mandatory for DEFERRED_WITH_RATIONALE; omitted for other dispositions."
        - name: "revisit_trigger"
          type: "string"
          required: false
          description: "Mandatory for DEFERRED_WITH_RATIONALE; omitted for other dispositions."

## Section 5: Behavior
behavior:
  validation_rules:
    - rule: "Tier-1 tests SHALL use deterministic shared fakes for clock, logging, runtime, and assertion seams; broker, position, symbol, and store fakes are added by their owner plans."
      source: "@bdd: BDD.01.03.aa68"
    - rule: "Tier-1.5 tests SHALL cover hedging account ownership, deferred netting/exchange init failure, no side effects, and manual non-interference scenarios."
      source: "@bdd: BDD.01.03.f415"
    - rule: "Release governance SHALL distinguish automated Strategy Tester evidence from deferred account-mode evidence required for v1 netting/exchange exclusion."
      source: "@ears: EARS.01.03.d7e9"
    - rule: "Test harnesses SHALL verify paired strategy diagnostics and trade execution logs remain separate evidence streams."
      source: "@ears: EARS.01.03.a71c"
    - rule: "After all code-deliverable IPLANs complete and before documentation closeout, the assessment SHALL inventory every implemented behavior boundary and record existing automated, Strategy Tester, demo/live, and manual evidence without conflating those evidence types."
      source: "@chg: CHG-26"
    - rule: "Each coverage record SHALL classify live evidence as REQUIRED, CONDITIONAL, or NOT_REQUIRED and provide an owner, rationale, and safe environment."
      source: "@chg: CHG-26"
    - rule: "Mutation-capable live tests SHALL use DEMO or an explicitly controlled RESTRICTED_LIVE environment and SHALL NOT target an unrestricted production account."
      source: "@chg: CHG-26"
    - rule: "The architecture decision SHALL select exactly one of NO_REFACTOR, TARGETED_REFACTOR, or SHARED_ARCHITECTURE_REFACTOR and enumerate governed follow-on artifacts."
      source: "@chg: CHG-26"
      architecture_basis: "@adr: ADR.10.03.51ea"
    - rule: "Documentation closeout SHALL compare the complete LiveTestAssessmentResult.findings inventory with LiveTestFindingDisposition[] and remain blocked unless the assessed finding_id set and disposition.finding_id set match one-to-one, with no missing, extra, or duplicate IDs."
      source: "@chg: CHG-26"
    - rule: "Every matched finding SHALL have exactly one disposition: IMPLEMENTED, DEFERRED_WITH_RATIONALE, or REJECTED_WITH_EVIDENCE."
      source: "@chg: CHG-26"
    - rule: "IMPLEMENTED is valid only when the governed follow-on is complete with required evidence; DEFERRED_WITH_RATIONALE is valid only with owner, rationale, risk acceptance, and revisit trigger; REJECTED_WITH_EVIDENCE is valid only when recorded evidence explains why implementation or deferral is not required."
      source: "@chg: CHG-26"
  state_transitions:
    - from: "TestUnassembled"
      to: "TestReady"
      trigger: "ScenarioHarness receives required component and fake dependencies."
      source: "@bdd: BDD.01.03.aa68"
    - from: "AssessmentPending"
      to: "AssessmentDispositioned"
      trigger: "Coverage inventory and architecture decision are reviewed; the complete assessed finding ID set matches the disposition finding_id set one-to-one; and every finding receives one valid disposition."
      source: "@chg: CHG-26"
  error_handling:
    - condition: "Scenario requires an owner-specific broker, position, symbol, or store fake before the owner plan has published it."
      response: "Owner-extension hooks (OnOwnerSetup/OnOwnerTeardown) are callable without crash; owner-specific assertions are deferred to the owner IPLAN."
      source: "@bdd: BDD.01.03.e16a"
    - condition: "Manual evidence pack is required but absent."
      response: "Mark release gate blocked rather than substituting automated tester evidence."
      source: "@bdd: BDD.01.03.f415"
    - condition: "An implemented boundary is absent from the coverage matrix, evidence types are conflated, an assessed finding ID is missing or duplicated, or the assessed and disposition finding ID sets do not match one-to-one."
      response: "Block IPLAN-14 completion and documentation closeout until the assessment contract is satisfied."
      source: "@chg: CHG-26"

## Section 6: Implementation Notes
implementation_notes:
  constraints:
    - "Test support modules MUST remain outside production execution paths."
    - "IPLAN-11 fakes MUST implement only IPLAN-09 contracts: IClock, ILogSink, runtime context, and profiling data models."
    - "Broker, position/account, symbol, and persistence fakes MUST be implemented by the owner plans that publish their production interfaces: IPLAN-03, IPLAN-04, IPLAN-06, and IPLAN-05 respectively."
    - "Market-owned fakes cover symbol metadata, broker-session state, session-close references, and contract expiration only; spread, fill-mode, margin, OrderCheck, broker-retcode, and submission-outcome fixtures belong to @iplan: IPLAN-03."
    - "Manual evidence pack contracts MUST remain visible to release governance and must not be represented as Strategy Tester automation."
    - "The live-test architecture assessment MUST consume the final implemented code inventory; planned placeholders are not assessment evidence."
    - "The assessment MUST NOT authorize MQL5 source changes; accepted implementation findings require governed downstream artifacts."
  patterns:
    - "Use owner-extension hooks so later plans can attach broker outcomes, position views, symbol context, and state stores without changing shared assertion helpers."
    - "Keep component construction explicit so TDD can map each BDD scenario to a harness."
    - "Record deferred owner fake scope in the consuming owner IPLAN rather than in the shared testing foundation manifest."
    - "Create the coverage matrix before the architecture review and refactor decision so conclusions remain evidence-derived."
  performance_considerations:
    - "Performance tests must collect evidence for @threshold: PRD.01.perf.tester_overhead, @threshold: PRD.01.perf.memory_per_ea, and @threshold: PRD.01.perf.idle_tick."

## Section 7: Downstream TDD Contracts
tdd_contracts:
  tdd_document: "@tdd: TDD-11"
  implementation_evidence_root: "Docs"
  path_casing_policy: "Docs/ is the case-sensitive implementation evidence root; docs/ is the SDD corpus and SHALL NOT replace it."
  test_files:
    - path: "Scripts/Tests/Test_TestSupportScenarioHarness.mq5"
      covers: "Executable entry point for minimal ScenarioHarness assembly, owner-extension hooks, and evidence assertions."
    - path: "Scripts/Tests/Test_TestSupportClock.mq5"
      covers: "Executable unit entry point for deterministic clock and assertion helper behavior."
    - path: "Scripts/Tests/Support/FakeClock.mqh"
      covers: "Deterministic time, session, timeout, and daily reset tests."
    - path: "Scripts/Tests/Support/FakeLogSink.mqh"
      covers: "Capturing log sink tests for diagnostics and evidence assertions."
    - path: "Scripts/Tests/Support/ScenarioHarness.mqh"
      covers: "Reusable shared component assembly, owner-extension hooks, and evidence assertions."
    - path: "Scripts/Tests/Test_ReleaseEvidenceHarness.mq5"
      covers: "Manual evidence pack contracts and automated/manual gate separation."
    - path: "Docs/ASSESSMENTS/LIVE_TEST_COVERAGE_MATRIX.yaml"
      covers: "LiveTestAssessmentContract coverage inventory, evidence separation, live-test classification, safe-environment, and ownership fields."
    - path: "Docs/ASSESSMENTS/LIVE_TEST_ARCHITECTURE_REVIEW.md"
      covers: "LiveTestAssessmentResult finding inventory and evidence-backed LiveTestArchitectureDecision analysis."
    - path: "Docs/ASSESSMENTS/LIVE_TEST_REFACTOR_DECISION.md"
      covers: "LiveTestArchitectureDecision, LiveTestCloseoutGate exact inventory matching, and mutually exclusive finding dispositions."

