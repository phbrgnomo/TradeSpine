## Section 2: Component Overview
component_overview:
  description: "The pluggable behavior component defines the indicator wrappers, stop-policy interface, futures sizing modes, v2 sizing placeholders, and trailing policy contracts used by strategy classes. Strategy code owns indicator-readiness decisions and trailing invocation; the coordinator consumes only normalized stop and sizing outputs for TradeIntent construction."
  architecture_decision: "@adr: ADR.10.03.51ea"
  diagram:
    tags: ["@diagram: c4-l3", "@diagram: dfd-l3"]
    mermaid: |
      flowchart LR
        Strategy["Strategy class"] --> Indicators["IIndicator"]
        Strategy --> Stops["IStopPolicy"]
        Strategy --> Sizer["IPositionSizer"]
        Strategy --> Trail["ITrailingStop"]
        Indicators --> StrategyReady["Strategy readiness gate"]
        Stops --> Coordinator
        Sizer --> Coordinator
        Trail --> Position["Position operations"]
  language: "MQL5"
  dependencies:
    - name: "CSymbolContext"
      version: "v1"
      purpose: "Provides symbol metadata for sizing, price grid, and lot normalization."
    - name: "CTradeCoordinator"
      version: "v1"
      purpose: "Consumes stop and sizing policy outputs."
    - name: "CPositionContext"
      version: "v1"
      purpose: "Applies trailing and management operations to strategy-owned exposure."

## Section 3: Interfaces
interfaces:
  exports:
    - name: "IIndicator"
      type: "interface"
      signature: "interface IIndicator { bool Init(string symbol, ENUM_TIMEFRAMES timeframe); bool IsInitialized(); bool IsReady(int min_bars); int Handle(); string Name(); IndicatorValue ValueAt(int buffer, int shift); }"
      description: "Indicator readiness, handle observability, and buffer-value contract consumed by strategy-layer readiness checks."
      errors:
        - "NotReady: indicator history or buffer data is unavailable."
    - name: "CIndicatorBase"
      type: "class"
      signature: "class CIndicatorBase : public IIndicator"
      description: "Base wrapper for handle lifecycle, buffer reads, and readiness through an injectable indicator runtime seam."
      errors:
        - "InitFailed: indicator handle cannot be created."
    - name: "IStopPolicy"
      type: "interface"
      signature: "interface IStopPolicy { StopLevels ComputeStops(const StopRequest &request); }"
      description: "Computes initial SL/TP from IPLAN-07-owned policy inputs without a coordinator Signal dependency."
      errors:
        - "InvalidStops: returns unusable stop distance for coordinator rejection."
    - name: "IPositionSizer"
      type: "interface"
      signature: "interface IPositionSizer { double CalcLots(const SizingRequest &request); }"
      description: "Calculates broker-normalized lots; concrete risk sizing obtains equity through IAccountValueProvider."
      errors:
        - "0.0: sizing anomaly or v2 placeholder selection."
    - name: "ITrailingStop"
      type: "interface"
      signature: "interface ITrailingStop { double ProposeNewSL(const TrailingRequest &request); }"
      description: "Proposes a tighten-only stop from a supplied position snapshot and never reads or mutates broker state."
      errors:
        - "0.0: no trailing change."
    - name: "IIndicatorRuntime"
      type: "interface"
      signature: "interface IIndicatorRuntime { int BarsCalculated(int handle); int CopyBuffer(int handle, int buffer, int shift, int count, double &values[]); void Release(int handle); }"
      description: "Adapter seam for post-creation native handle operations used by CIndicatorBase and deterministic tests. Each concrete adapter owns CreateHandle(symbol,timeframe), calling iATR, iMA, or iCustom as appropriate; the runtime does not expose an ambiguous generic Create operation."
      errors:
        - "InitFailed or NotReady when create, bars, copy, or release operations fail."
    - name: "IAccountValueProvider"
      type: "interface"
      signature: "interface IAccountValueProvider { double Equity(); }"
      description: "Injected account-equity seam used only by risk-percent sizing."
      errors:
        - "0.0 or non-finite equity: sizing returns 0.0."
    - name: "SizingMath::CalcRiskLots"
      type: "namespace function"
      signature: "double SizingMath::CalcRiskLots(double equity, const SizingRequest &request, const SymbolMetadata &metadata)"
      description: "Pure risk-percent sizing calculation called by the injected-provider concrete sizer; it performs no account or broker lookup."
      errors:
        - "0.0: non-finite or invalid input, risk below the minimum lot, or no executable broker-normalized result."
    - name: "IndATR, IndMA, IndDonchian, IndSupertrend"
      type: "classes"
      signature: "class IndATR/IndMA/IndDonchian/IndSupertrend : public CIndicatorBase"
      description: "v1 concrete indicator wrappers for the simple samples and approved hedging port dependencies."
      errors:
        - "InitFailed or NotReady when handle creation, history loading, or buffer reads are unavailable."
    - name: "CStopATR, CStopFixed, CStopSwing"
      type: "classes"
      signature: "class CStopATR/CStopFixed/CStopSwing : public IStopPolicy"
      description: "v1 initial stop policies for ATR distance, fixed distance, and swing-level stops."
      errors:
        - "InvalidStops: no executable risk distance can be produced."
    - name: "CTrailATRMultiple, CTrailBreakeven"
      type: "classes"
      signature: "class CTrailATRMultiple/CTrailBreakeven : public ITrailingStop"
      description: "v1 strategy-owned trailing policies for ATR-multiple and breakeven stop proposals."
      errors:
        - "0.0: no tighten-only stop change is valid."

## Section 4: Data Models
data_models:
  models:
    - name: "StopRequest"
      type: "struct"
      fields:
        - name: "order_type"
          type: "ENUM_ORDER_TYPE"
          required: true
          description: "BUY or SELL direction for stop topology."
        - name: "entry_price"
          type: "double"
          required: true
          description: "Resolved entry price."
    - name: "StopLevels"
      type: "struct"
      owner: "Include/Strategy/PolicyTypes.mqh; @iplan: IPLAN-07"
      fields:
        - name: "sl_price"
          type: "double"
          required: true
          description: "Initial stop loss price or unset marker."
        - name: "tp_price"
          type: "double"
          required: false
          description: "Initial take profit price or unset marker."
        - name: "sl_distance"
          type: "double"
          required: true
          description: "Positive risk distance required for executable risk sizing."
    - name: "SizingRequest"
      type: "struct"
      fields:
        - name: "order_type"
          type: "ENUM_ORDER_TYPE"
          required: true
          description: "BUY or SELL entry direction; sizing is performed before a position exists."
        - name: "entry_price"
          type: "double"
          required: true
          description: "Resolved entry price."
        - name: "sl_price"
          type: "double"
          required: true
          description: "Resolved stop-loss price."
        - name: "risk_percent"
          type: "double"
          required: true
          description: "Strategy risk percentage input."
        - name: "fixed_lots"
          type: "double"
          required: false
          description: "Requested fixed volume for CPositionSizerFixed; ignored by risk-percent sizing."
    - name: "TrailingRequest"
      type: "struct"
      fields:
        - name: "ticket"
          type: "ulong"
          required: true
          description: "Position correlation identifier; no broker lookup is implied."
        - name: "position_type"
          type: "ENUM_POSITION_TYPE"
          required: true
          description: "Open position side."
        - name: "open_price"
          type: "double"
          required: true
          description: "Position open price."
        - name: "current_price"
          type: "double"
          required: true
          description: "Current market price supplied by the caller."
        - name: "current_sl"
          type: "double"
          required: true
          description: "Current stop price or zero when unset."
        - name: "current_tp"
          type: "double"
          required: false
          description: "Current take-profit price or zero when unset."
    - name: "IndicatorValue"
      type: "struct"
      fields:
        - name: "ready"
          type: "bool"
          required: true
          description: "Whether value is safe for strategy use."
        - name: "value"
          type: "double"
          required: false
          description: "Indicator buffer value."

## Section 5: Behavior
behavior:
  validation_rules:
    - rule: "Registered indicators that are not ready SHALL block entries."
      source: "@ears: EARS.01.03.4e80"
    - rule: "Indicator readiness SHALL be checked at the strategy layer before helper requests are sent to the coordinator."
      source: "@ears: EARS.01.03.4e80"
    - rule: "Futures risk-percent sizing SHALL use initialized symbol information."
      source: "@ears: EARS.01.03.5e92"
    - rule: "Fixed-lot sizing SHALL normalize fixed lots against initialized symbol information."
      source: "@ears: EARS.01.03.bc8b"
    - rule: "Equity sizing modes selected in v1 SHALL reject as visible v2 placeholders."
      source: "@ears: EARS.01.03.932d"
    - rule: "All v1 concrete stop and sizing policies SHALL validate symbol-derived lot, price-grid, and stop-distance constraints before coordinator submission."
      source: "@ears: EARS.01.03.ec72"
    - rule: "Trailing policies SHALL only propose tighten-only stop changes and SHALL be invoked by strategy management code, not by the framework idle path."
      source: "@prd: PRD.01.09.5963"
    - rule: "Policy request and result types SHALL be owned by IPLAN-07 and SHALL NOT depend on Signal or any IPLAN-02 implementation type."
      source: "@chg: CHG-25"
    - rule: "Indicator runtime and account-equity reads SHALL cross injectable seams; stop, sizing, and trailing policies SHALL not mutate broker state."
      source: "@chg: CHG-25"
    - rule: "Each concrete indicator adapter SHALL create its own native handle through CreateHandle(symbol,timeframe); CIndicatorBase SHALL use IIndicatorRuntime only for BarsCalculated, CopyBuffer, and Release so tests can deterministically replace every post-creation operation."
      source: "@chg: CHG-25"
    - rule: "SizingMath::CalcRiskLots SHALL calculate risk_money=equity*risk_percent/100, loss_per_lot=abs(entry_price-sl_price)/tick_size*tick_value, and raw_lots=risk_money/loss_per_lot. It SHALL round down to lot_step, cap at lot_max, and return 0.0 when the result is below lot_min or any required input is non-finite or invalid. contract_size is retained as validated market metadata and SHALL NOT be multiplied into this tick-value-per-lot formula."
      source: "@chg: CHG-25"
  state_transitions:
    - from: "IndicatorNotReady"
      to: "IndicatorReady"
      trigger: "Registered indicator reports required history and buffer readiness."
      source: "@bdd: BDD.01.03.c0f6"
  error_handling:
    - condition: "Sizing mode cannot produce executable lots."
      response: "Return 0.0 and let coordinator reject without broker submission."
      source: "@bdd: BDD.01.03.e593"
    - condition: "Equity sizing placeholder is selected in v1."
      response: "Reject visibly and do not execute as futures sizing."
      source: "@bdd: BDD.01.03.cb03"
    - condition: "Concrete indicator wrapper cannot create a handle or read required buffers."
      response: "Report not-ready or init failure and block entries using that dependency."
      source: "@bdd: BDD.01.03.c0f6"
    - condition: "Stop policy computes a side-inverted, off-grid, or zero-distance stop."
      response: "Return InvalidStops so the coordinator rejects before sizing."
      source: "@bdd: BDD.01.03.e593"

## Section 6: Implementation Notes
implementation_notes:
  constraints:
    - "v1 active sizing modes are futures risk percent and fixed lot; equity modes are placeholders."
    - "v1 active native indicators are limited to wrappers required by the simple samples, approved hedging ports, and approved custom indicators."
    - "Trailing is strategy-owned in OnManagePosition and the framework MUST NOT auto-call trailing; accepted proposals later route through ITradeExecutor::ModifyTicket."
    - "Indicator readiness is strategy-owned; the coordinator may defensively reject unresolved requests but MUST NOT own indicator-readiness decisions."
  patterns:
    - "Use enum-selected member policy objects rather than conditional feature branches."
    - "Keep IIndicator generic: it defines lifecycle, readiness, and value access, never one method per indicator type."
    - "Group v1 native ATR and MA handle adapters in Include/Indicators/NativeIndicators.mqh; keep each custom algorithm in its own file because its buffers and calculation differ."
    - "Expose Include/Indicators/Indicators.mqh as an include-only facade over IndicatorBase, NativeIndicators, and custom adapters."
    - "Own StopRequest, StopLevels, SizingRequest, TrailingRequest, and IndicatorValue in Include/Strategy/PolicyTypes.mqh."
    - "Concrete ATR policies own their IIndicator dependency; generic policy requests contain no indicator-specific field."
    - "Use pure namespace functions for stateless sizing and stop-distance math."
    - "Map v1 enum values explicitly to IndATR, IndMA, IndDonchian, IndSupertrend, CStopATR, CStopFixed, CStopSwing, CTrailATRMultiple, and CTrailBreakeven."
  performance_considerations:
    - "Indicator caching is optional and off by default unless a SPEC/TDD case proves safe value reuse."

