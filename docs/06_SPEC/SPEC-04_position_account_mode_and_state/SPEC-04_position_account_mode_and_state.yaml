## Section 2: Component Overview
component_overview:
  description: "The position component owns account-mode selection, strategy-scoped ownership, canonical lifecycle reconciliation, untrusted transaction-hint routing, and the per-strategy state machine. CHG-22/IPLAN-04 makes HALT absorbing, persists complete cancel evidence before broker submission, fences every mutation with current lease ownership, and permits recovery only through CPositionContext.Recover after a fresh claim and full broker/store reconciliation. Read-only live evidence providers expose terminal account, position, order, deal, and bounded-history facts without submitting trades."
  architecture_decision: "@adr: ADR.07.03.6df1"
  diagram:
    tags: ["@diagram: c4-l3", "@diagram: dfd-l3"]
    mermaid: |
      flowchart LR
        Base["CStrategyBase"] --> SM["CPositionStateMachine"]
        Coord["CTradeCoordinator"] --> Pos["CPositionContext"]
        Tx["OnTradeTransaction"] --> Router["CTradeTxRouter"]
        Router --> SM
        Pos --> Adapter["IAccountModeAdapter"]
        Adapter -.->|v2 deferred| Netting["CNettingAdapter"]
        Adapter --> Hedging["CHedgingAdapter"]
  language: "MQL5"
  dependencies:
    - name: "CStateStore"
      version: "CHG-22-R1"
      purpose: "Persists the commit-last lifecycle snapshot, token-fenced marker lease, deferred-mode diagnostics, and retained HALT/recovery evidence."
    - name: "CGuardedTrade"
      version: "Deferred CHG-22-R1 consumer; implementation owned by IPLAN-03"
      purpose: "Deferred v1 consumer. IPLAN-03 will submit hedging adapter close/modify operations only after immediate readiness, HALT, lease, mode, and provider fences; pending-exit operations are v2+ netting scope."
    - name: "Vendored CPositionInfo and history classes"
      version: "frozen StdLib VERSION.md"
      purpose: "Read broker tickets, deals, orders, and position diagnostics."

## Section 3: Interfaces
interfaces:
  exports:
    - name: "IAccountModeProvider"
      type: "interface"
      signature: "interface IAccountModeProvider { ENUM_ACCOUNT_MARGIN_MODE MarginMode(); }"
      description: "Injectable account margin-mode source. CLiveAccountModeProvider is the production read-only implementation; tests may supply deterministic fakes."
      errors:
        - "Unsupported/deferred mode: CPositionContext initialization fails before any trade path."
    - name: "IAccountModeAdapter"
      type: "interface"
      signature: "interface IAccountModeAdapter { bool Init(string symbol, ulong magic, IBrokerPositionView* view, ITradeExecutor* executor, Logger* logger); string ModeName(); bool IsReady(); bool HasOwnedPosition(); int OwnedTicketCount(); double NetExposureLots(); bool CloseTicket(ulong ticket, double lots); bool ModifyTicket(ulong ticket, double sl, double tp); bool CancelOrder(ulong order_ticket); bool TrailSL(ulong ticket, double candidate_sl); bool SupportsMultiplePositions(); bool AllowsAddVolume(); }"
      description: "Mode-specific ownership and position operation contract."
      errors:
        - "OperationRejected: ownership unknown, invalid lots, or unsupported mode operation."
    - name: "CPositionContext"
      type: "class"
      signature: "class CPositionContext : public IPositionView { bool Init(string symbol, ulong magic, IAccountModeProvider* mode_provider, IBrokerPositionView* broker_view, ITradeTransactionEvidence* tx_evidence, ITradeExecutor* executor, IStateStore* store, CPositionStateMachine* sm, COptContext* opt, Logger* logger, datetime now, int lease_secs=60); void OnDeinit(); bool OnMaintenance(datetime now); bool Recover(datetime now, int lease_secs=60); bool OnTick(); bool RouteTradeTransaction(const MqlTradeTransaction &trans, const MqlTradeRequest &request, const MqlTradeResult &result); bool RepairExternalStops(ulong ticket, double expected_sl, double expected_tp); CTradeTxRouter* Router(); bool IsReady(); bool HasOpenPosition(); double NetExposureLots(); int MyTicketCount(); ENUM_POSITION_STATE State(); ENUM_ACCOUNT_MARGIN_MODE MarginMode(); }"
      description: "Owns initialization ordering, live or isolated runtime namespace, lease claim and fencing, startup/timer/hint reconciliation, explicit HALT recovery, and strategy-owned position queries. Init becomes ready only after safe ownership and reconciliation; Recover is the only context path that may resume an absorbing HALT."
      errors:
        - "INIT_FAILED: account mode or duplicate identity cannot be initialized safely."
    - name: "CNettingAdapter"
      type: "class"
      signature: "class CNettingAdapter : public IAccountModeAdapter"
      description: "Deferred v2+ placeholder for netting/exchange strategy exposure through virtual ledger and pending exits. In v1, selecting netting or exchange-netting fails initialization before this adapter can trade."
      errors:
        - "INIT_FAILED: netting/exchange mode is deferred in v1."
    - name: "CHedgingAdapter"
      type: "class"
      signature: "class CHedgingAdapter : public IAccountModeAdapter"
      description: "Tracks strategy exposure through magic-filtered broker tickets and orders."
      errors:
        - "OperationRejected: no strategy-owned ticket matches requested operation."
    - name: "CPositionStateMachine"
      type: "class"
      signature: "class CPositionStateMachine { bool Init(IStateStore* store, IAlertSink* alerts, ITradeExecutor* executor, Logger* logger, int fill_timeout_secs=5, IClock* clock=NULL, string symbol=\"\", ulong magic=0); void SetIdentity(string symbol, ulong magic); void BindLeaseFence(bool required, long token); ENUM_POSITION_STATE State(); ulong PendingOrderTicket(); datetime PendingSubmittedTs(); bool CancelOwned(); LifecycleSnapshot Snapshot(); bool OnPendingEntrySubmitted(ulong order_ticket, datetime now); bool RequestCancellation(ENUM_CANCEL_ORIGIN origin, datetime now); bool Update(datetime now, IBrokerPositionView* positions=NULL, ITradeTransactionEvidence* evidence=NULL); bool EnterHalt(const HaltEvidence &ev); bool Reconcile(IBrokerPositionView* positions, ITradeTransactionEvidence* evidence, datetime now, bool allow_halt_clear=false); bool ReconcileOnInit(IBrokerPositionView* positions, ITradeTransactionEvidence* evidence, datetime now); bool TryAutoClearHalt(ITradeTransactionEvidence* evidence); bool IsHalted(); }"
      description: "Owns guarded lifecycle transitions, complete-snapshot commit-before-mutation, timeout cancellation evidence, canonical restart/timer/hint reconciliation, stable position identity, and absorbing HALT behavior. It accepts an optional IClock; in-memory HALT remains effective even if durable alert evidence fails."
      errors:
        - "HALT: async, cancel, or reconciliation outcome is ambiguous."
    - name: "IPositionView"
      type: "interface"
      signature: "interface IPositionView { bool HasOpenPosition(); double NetExposureLots(); int MyTicketCount(); ENUM_POSITION_STATE State(); ENUM_ACCOUNT_MARGIN_MODE MarginMode(); }"
      description: "Read-only strategy-owned position facade consumed by downstream coordination layers (CHG-22)."
      errors:
        - "UNKNOWN: position state is not yet initialized."
    - name: "IBrokerPositionView"
      type: "interface"
      signature: "interface IBrokerPositionView { int Total(); bool SelectByIndex(int index); bool SelectByTicket(ulong ticket); ulong Ticket(); ulong Identifier(); string Symbol(); ulong Magic(); ENUM_POSITION_TYPE PositionType(); double Volume(); double StopLoss(); double TakeProfit(); }"
      description: "Selected-position broker evidence seam exposing ticket, exact symbol and magic, volume, and stable POSITION_IDENTIFIER. Selection failure invalidates prior selection and returns safe empty evidence."
      errors:
        - "false: selected position or ticket is unavailable."
    - name: "ITradeTransactionEvidence"
      type: "interface"
      signature: "interface ITradeTransactionEvidence { bool SelectHistory(datetime from, datetime to); bool SelectHistoryByPosition(ulong position_id); int HistoryDealCount(); ulong HistoryDealTicket(int index); ulong HistoryDealMagic(ulong ticket); string HistoryDealSymbol(ulong ticket); ENUM_DEAL_ENTRY HistoryDealEntry(ulong ticket); ulong HistoryDealOrder(ulong ticket); ulong HistoryDealPositionId(ulong ticket); double HistoryDealVolume(ulong ticket); ENUM_ORDER_STATE HistoryOrderState(ulong ticket); ulong HistoryOrderMagic(ulong ticket); string HistoryOrderSymbol(ulong ticket); ulong HistoryOrderPositionId(ulong ticket); int ActiveOrderTotal(); bool ActiveOrderSelectByIndex(int index); ulong ActiveOrderTicket(); bool ActiveOrderSelect(ulong ticket); ENUM_ORDER_STATE ActiveOrderState(); ulong ActiveOrderMagic(); string ActiveOrderSymbol(); bool PositionSelectByTicket(ulong ticket); string PositionSymbol(); ulong PositionMagic(); ENUM_POSITION_TYPE EvidencePositionType(); double PositionVolume(); double PositionSL(); double PositionTP(); }"
      description: "Explicit bounded-history selection, deal-to-order/position correlation, active-order iteration, and residual-position evidence seam used by canonical reconciliation. Every usable fact requires nonzero identity plus exact symbol and magic."
      errors:
        - "false/zero/empty evidence: transaction hint cannot be proven and must be reconciled later."
    - name: "ITradeExecutor"
      type: "interface"
      signature: "interface ITradeExecutor { bool CloseTicket(ulong ticket, double lots); bool ModifyTicket(ulong ticket, double sl, double tp); bool CancelOrder(ulong order_ticket); }"
      description: "Implemented canonical declaration owned by IPLAN-04 at Include/Position/Interfaces.mqh. IPLAN-03 will consume it by defining the deferred ITradePort as its single derived interface and the deferred CGuardedTrade as the ITradePort implementation (CHG-22, CHG-23)."
      errors:
        - "false: guarded close, modify, or cancel was rejected or unavailable."
    - name: "CLiveAccountModeProvider, CLiveBrokerPositionView, CLiveTradeTransactionEvidence"
      type: "classes"
      signature: "read-only terminal evidence providers"
      description: "Separate composition-based production providers implementing IAccountModeProvider, IBrokerPositionView, and ITradeTransactionEvidence over the vendored account, position, order, history-order, and deal readers. They never instantiate CTrade or submit broker operations."
      errors:
        - "false/empty evidence: native selection or bounded history selection failed; previous selection is invalidated."

## Section 4: Data Models
data_models:
  models:
    - name: "VirtualPosition"
      type: "struct"
      fields:
        - name: "virtual_position_id"
          type: "ulong"
          required: true
          description: "Deferred v2+ strategy-scoped virtual position identity."
        - name: "signed_volume"
          type: "double"
          required: true
          description: "Deferred v2+ long positive or short negative strategy exposure."
        - name: "avg_entry_price"
          type: "double"
          required: true
          description: "Deferred v2+ virtual average entry price for this strategy."
        - name: "lifecycle_state"
          type: "ENUM_POSITION_STATE"
          required: true
          description: "Strategy lifecycle state used by the state machine."
    - name: "PendingExitLink"
      type: "struct"
      fields:
        - name: "ticket"
          type: "ulong"
          required: true
          description: "Deferred v2+ broker pending exit order ticket."
        - name: "role"
          type: "ENUM_EXIT_ROLE"
          required: true
          description: "Deferred v2+ SL or TP pending-exit role."
        - name: "sibling_ticket"
          type: "ulong"
          required: false
          description: "Deferred v2+ linked OCO sibling order ticket."
    - name: "StateTransition"
      type: "struct"
      fields:
        - name: "from_state"
          type: "ENUM_POSITION_STATE"
          required: true
          description: "Prior lifecycle state."
        - name: "to_state"
          type: "ENUM_POSITION_STATE"
          required: true
          description: "Result lifecycle state."
        - name: "trigger"
          type: "ENUM_STATE_TRIGGER"
          required: true
          description: "Broker event, timeout, reconciliation, panic, or day-trade trigger."
    - name: "PendingEntry"
      type: "struct"
      fields:
        - name: "order_ticket"
          type: "ulong"
          required: true
          description: "Pending-entry order ticket persisted so timeout/cancel behavior survives restart (CHG-22)."
        - name: "submitted_ts"
          type: "datetime"
          required: true
          description: "Submission timestamp used to recompute the fill-timeout deadline after restart (CHG-22)."
        - name: "fill_timeout_secs"
          type: "int"
          required: true
          description: "Non-input timeout constant; default is POSITION_FILL_TIMEOUT_SECS_DEFAULT=5 (CHG-22)."
    - name: "DuplicateMarker"
      type: "struct"
      fields:
        - name: "identity"
          type: "string"
          required: true
          description: "Account, terminal, symbol, and magic identity key."
        - name: "heartbeat_ts"
          type: "datetime"
          required: true
          description: "Last liveness marker written by the owning instance."
        - name: "status"
          type: "ENUM_DUPLICATE_MARKER_STATUS"
          required: true
          description: "One of DUPLICATE_MARKER_ACTIVE, DUPLICATE_MARKER_STALE_RECLAIMED, or DUPLICATE_MARKER_CONFLICT. Ownership is fenced by IStateStore marker lease token, not by GlobalVariableTime (CHG-22)."
    - name: "ExecutionMutex"
      type: "struct"
      fields:
        - name: "lock_key"
          type: "string"
          required: true
          description: "Deferred v2+ strategy/account/symbol lock key for serialized netting operations."
        - name: "owner_id"
          type: "string"
          required: true
          description: "Current owner of the critical execution section."
        - name: "lease_expires_at"
          type: "datetime"
          required: true
          description: "Deferred v2+ time after which a stale lock can be recovered."
    - name: "RecoveryDecision"
      type: "struct"
      fields:
        - name: "decision"
          type: "ENUM_RECOVERY_DECISION"
          required: true
          description: "Resume, safe-clear, repair-ledger, or HALT."
        - name: "evidence"
          type: "string"
          required: true
          description: "Reason and broker/store facts used for the recovery decision."

## Section 5: Behavior
behavior:
  validation_rules:
    - rule: "Netting and exchange-netting modes SHALL fail initialization in v1 before any trade path, virtual ledger, pending-exit tracker, or execution mutex becomes active."
      source: "@ears: EARS.01.03.5d1b"
    - rule: "Hedging adapter SHALL record strategy ownership against broker tickets or orders."
      source: "@ears: EARS.01.03.fb67"
    - rule: "Duplicate same-terminal account-symbol-magic identity SHALL fail or safely recover initialization."
      source: "@ears: EARS.01.03.7d34"
    - rule: "HALT SHALL be absorbing, block entry, modification, trailing, and ordinary exits, and preserve last-known state and cancel evidence. Only explicitly classified emergency cleanup with proven ownership is permitted while halted."
      source: "@ears: EARS.01.03.6bda"
    - rule: "Strategy-scoped v1 position state SHALL be sourced from hedging ticket evidence, GV-backed state, and broker reconciliation, not from broker aggregate position alone."
      source: "@ears: EARS.01.03.5d1b"
    - rule: "Netting and exchange-netting execution paths are deferred v2+ and SHALL NOT be reachable in v1."
      source: "@prd: PRD.01.09.5cce"
    - rule: "External intervention detection SHALL reconcile strategy-owned state and preserve manual/non-TradeSpine exposure boundaries."
      source: "@ears: EARS.01.03.4f9d"
    - rule: "CPositionContext SHALL validate dependencies, establish runtime namespace and account mode, claim or deliberately suppress the lease, initialize the state machine and router, reconcile, and only then become ready. OnMaintenance(now) SHALL evaluate local timeouts every callback and run broker reconciliation plus heartbeat at a fixed 30-second cadence with a minimum 60-second live lease; OnTick SHALL NOT persist maintenance state."
      source: "@chg: CHG-22"
    - rule: "Account-mode adapters SHALL delegate close, modify, and cancel writes only through the implemented ITradeExecutor seam; the production guard implementation remains deferred to IPLAN-03 (CHG-22)."
      source: "@chg: CHG-22"
    - rule: "CPositionStateMachine SHALL commit order ticket, submission time, cancel-request time, and cancellation origin before CancelOrder; wait five seconds for confirmation; reconcile once; and retain the evidence in HALT when the outcome remains unavailable."
      source: "@chg: CHG-22"
    - rule: "Every state-changing lifecycle operation SHALL validate MarkerIsOwner immediately before snapshot commit; every context-owned broker mutation SHALL revalidate ownership immediately before submission. Lease loss SHALL disable readiness and routing, enter HALT once, and require a fresh claim plus full reconciliation."
      source: "@chg: CHG-22"
    - rule: "Optimization and nonvisual tester suppression SHALL use an explicit isolated namespace and SHALL NOT claim, clear, or mutate the live namespace."
      source: "@chg: CHG-22"
    - rule: "CPositionContext.Recover(now) SHALL be the only normal path out of HALT and SHALL report ready only after current lease ownership and canonical reconciliation prove either flat state with no matching live order/position or one unambiguously owned position."
      source: "@chg: CHG-22"
    - rule: "After a competing owner is removed and all required broker/history evidence is available, a live context SHALL establish a fresh lease and complete safe reconciliation within at most one 60-second lease expiry plus one 30-second maintenance interval (90 seconds total)."
      source: "@chg: CHG-22"
    - rule: "Broker fills, rejects, cancellations, partial exits, and external closes SHALL have no public direct lifecycle mutator. Exact broker/history correlation and observed residual volume SHALL flow through canonical Reconcile; close reasons remain audit evidence, not transition authority."
      source: "@chg: CHG-22"
    - rule: "CPositionContext.RepairExternalStops(ticket, expected_sl, expected_tp) SHALL repair externally drifted hedging-ticket SL/TP only through ITradeExecutor-backed adapter modification; invalid stop topology or failed repair SHALL enter HALT with symbol, magic, and ticket evidence (CHG-22)."
      source: "@chg: CHG-22"
  state_transitions:
    - from: "FLAT"
      to: "PENDING_ENTRY"
      trigger: "Accepted pending entry submission."
      source: "@bdd: BDD.01.03.0073"
    - from: "PENDING_ENTRY"
      to: "PENDING_CANCEL"
      trigger: "Fill timeout expires and guarded CancelOrder succeeds."
      source: "@chg: CHG-22"
    - from: "PENDING_CANCEL"
      to: "ACTIVE"
      trigger: "Fill race is proven during cancel reconciliation."
      source: "@chg: CHG-22"
    - from: "PENDING_CANCEL"
      to: "FLAT"
      trigger: "Cancel is confirmed for the pending entry."
      source: "@chg: CHG-22"
    - from: "PENDING_ENTRY"
      to: "HALT"
      trigger: "Async fill, cancel, or reconciliation outcome cannot be disambiguated."
      source: "@bdd: BDD.01.03.e16a"
    - from: "ACTIVE"
      to: "FLAT"
      trigger: "Canonical reconciliation proves zero residual position and a correlated exit for the stable position identity."
      source: "@chg: CHG-22"
    - from: "ACTIVE"
      to: "HALT"
      trigger: "Day-trade close sequence cannot close or cancel all strategy-owned exposure."
      source: "@bdd: BDD.01.03.9a7d"
  error_handling:
    - condition: "Netting or exchange-netting deferred-mode init-failure evidence is missing."
      response: "Block v1 release sign-off."
      source: "@bdd: BDD.01.03.f415"
    - condition: "Duplicate marker is active for the same account-symbol-magic identity."
      response: "Fail initialization unless the marker is proven stale and safely recoverable."
      source: "@ears: EARS.01.03.7d34"
    - condition: "Hedging ticket state, partial fill, or cancel origin cannot be reconstructed."
      response: "Persist last-known state and enter HALT rather than guessing ownership."
      source: "@ears: EARS.01.03.588b"
    - condition: "Pending-entry fill timeout occurs and CancelOrder fails or cannot be proven."
      response: "Route HALT through IAlertSink with symbol, magic, ticket, and last-known state; do not write HALT directly from the state machine (CHG-22)."
      source: "@chg: CHG-22"
    - condition: "OnTradeTransaction has zero/missing IDs, unavailable selected history, replay, ordering drift, partial exit, or mismatched correlation."
      response: "Treat it as an untrusted wake-up hint. Unrelated or replayed evidence is an idempotent no-op; ambiguous correlated evidence is preserved and enters HALT through canonical reconciliation."
      source: "@chg: CHG-22"
    - condition: "External broker-side SL/TP drift is detected but the expected topology is invalid or guarded repair fails."
      response: "Route HALT through IAlertSink with symbol, magic, ticket, and last-known state; do not guess a safe repaired state (CHG-22)."
      source: "@chg: CHG-22"

## Section 6: Implementation Notes
implementation_notes:
  constraints:
    - "Each EA instance executes startup, timer, tick, and transaction callbacks on one serial, non-reentrant MQL5 event queue. Separate EA/chart instances coordinate only through the token-fenced SPEC-05 marker lease; ownership must be revalidated immediately before every shared-state or broker mutation."
    - "Startup order is dependency validation, explicit runtime namespace and account-mode establishment, lease claim or deliberate suppression, checked state-machine/router initialization, canonical reconciliation, then readiness."
    - "Startup, transaction hints, and fixed 30-second timer maintenance invoke one reconciliation routine; local timeout evaluation runs on every timer callback and the lease threshold is at least 60 seconds."
    - "Transaction payloads are untrusted hints. A transition requires nonzero IDs, explicit bounded history selection, exact symbol/magic, order-to-position correlation, and observed residual volume."
    - "HALT is absorbing. Only Reconcile with explicit recovery permission may clear it after proving flat broker state or one unambiguously owned position."
    - "Cancellation evidence includes order ticket, submission timestamp, request timestamp, and ENUM_CANCEL_ORIGIN; it commits before CancelOrder and remains durable through the 5-second confirmation window."
    - "CLiveAccountModeProvider, CLiveBrokerPositionView, and CLiveTradeTransactionEvidence are read-only terminal adapters; selection failure invalidates prior selection and returns empty evidence."
    - "CStrategyBase owns one CPositionStateMachine; adapters, router, and coordinator receive references only."
    - "Netting/exchange modes MUST NOT reach live trading in v1."
    - "Manual or non-TradeSpine exposure without this strategy magic MUST NOT perturb strategy state."
    - "CPositionContext.OnMaintenance is driven by framework OnTimer wiring from SPEC-01; OnTick must not perform marker heartbeat writes (CHG-22)."
    - "CPositionStateMachine keeps in-memory HALT effective even when IAlertSink.Halt reports durable evidence failure (CHG-22)."
  patterns:
    - "Use adapter selection from ACCOUNT_MARGIN_MODE during framework init."
    - "Use deferred-mode diagnostics for netting/exchange in v1; virtual ledger identity account, symbol, magic, and virtual position id are v2+ only."
    - "Use magic and symbol ticket filtering for hedging ownership."
    - "Treat OCO links as deferred v2+ strategy-owned ledger records; v1 hedging uses broker-native ticket SL/TP."
    - "Repair external SL/TP drift through CPositionContext.RepairExternalStops and the ITradeExecutor-backed adapter path only; freeze/stop clamping remains guarded-execution scope for IPLAN-03."
    - "Write duplicate marker heartbeat through the persistence boundary, not ad hoc terminal globals in strategy code."
    - "Use IStateStore.MarkerClaimOrReclaim/MarkerHeartbeat/MarkerIsOwner/MarkerRelease for duplicate identity ownership; bootstrap creation is mutex-protected and claim success is reread-validated."
    - "Use ITradeTransactionEvidence history surfaces only after HistorySelect from pending submission minus 60 seconds or HistorySelectByPosition for the stable position identifier (CHG-22)."
    - "Runtime namespaces are explicit: live uses the canonical namespace; optimization and nonvisual tester contexts require an isolated namespace and never clear or claim the live lease."
    - "CPositionContext.Recover performs an explicit fresh claim when ownership was lost, rebinds the fence, and invokes Reconcile with HALT-clear permission; ordinary maintenance and transaction hints never carry that permission."
  performance_considerations:
    - "Idle OnTick SHALL perform zero broker scans and zero persistence writes. The matched release benchmark SHALL use the same terminal/build, data, symbol/timeframe, and settings as its baseline; after at least 1,000 warm-up callbacks, collect at least 10,000 idle callbacks with the SPEC-09 profiler and gate median idle tick at <=50 us and matched median tester overhead at <=10% per @threshold: PRD.01.perf.idle_tick and @threshold: PRD.01.perf.tester_overhead. Report p95, scan/write counts, position/order/history cardinality, and the measurement window."
    - "Reconciliation requiring broker scans runs on init, trade transaction, explicit timer maintenance, or intervention detection, not on idle ticks. When queue delay or evidence cardinality threatens the lease/maintenance deadline, block new mutations and preserve or enter reconciliation/HALT rather than skipping ownership proof."

## Section 7: Downstream TDD Contracts
tdd_contracts:
  tdd_document: "@tdd: TDD.04.04.8b79"
  test_files:
    - path: "Scripts/Tests/Test_PositionStateMachine.mq5"
      covers: "State transitions, complete cancel evidence, both cancellation origins, restart matrix, canonical hint/timer reconciliation, stable position identity, absorbing HALT, lease fencing, and explicit recovery guards."
    - path: "Scripts/Tests/Test_AccountModeAdapters.mq5"
      covers: "Hedging ticket ownership and netting/exchange deferred-mode init failure."
    - path: "Scripts/Tests/Test_AccountModeDeferred.mq5"
      covers: "RETAIL_NETTING and EXCHANGE init failure, startup ordering, lease fencing/loss, 30-second maintenance, isolated tester namespaces, and guarded external stop repair."
    - path: "Scripts/Tests/Test_PositionLiveProviders.mq5"
      covers: "Read-only production provider parity with native account, position, order, and bounded-history APIs."

